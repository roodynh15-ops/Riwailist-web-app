<div id="root"></div>
<script type="text/babel" data-presets="env,react">
/* ═══════════════════════════════════════════════════════════════════════════
   NOVELIST PRO · Application Script
   ───────────────────────────────────────────────────────────────────────────
   Contents (search ▎ to jump):
     ▎ Utilities          ▎ Constants & i18n    ▎ Icons
     ▎ Storage            ▎ Reducer             ▎ Hooks
     ▎ Primitives         ▎ Home                ▎ Sidebar & lists
     ▎ Rich editor        ▎ Chapter view        ▎ Character view
     ▎ Location view      ▎ Timeline view       ▎ Blueprint view
     ▎ Notes / Stats      ▎ Settings            ▎ App root
═══════════════════════════════════════════════════════════════════════════ */

const {useState,useEffect,useRef,useMemo,useCallback,useReducer,createContext,useContext,memo,Fragment} = React;

/* ▎ Utilities ──────────────────────────────────────────────────────────── */
const uid = (p='id') => p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clamp = (n,lo,hi) => Math.max(lo,Math.min(hi,n));
const noop = () => {};

// Count words from HTML — collapses whitespace, ignores tags / entities, counts CJK chars individually.
const countWords = (html) => {
  if(!html) return 0;
  const text = html.replace(/<[^>]*>/g,' ').replace(/&[a-z0-9#]+;/gi,' ').replace(/\s+/g,' ').trim();
  if(!text) return 0;
  // CJK characters: each counts as one word. Covers main CJK block + hiragana/katakana
  // + CJK Extension A (3400–4DBF) + CJK Extension B (20000–2A6DF)
  const cjkRe = /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u{20000}-\u{2a6df}]/gu;
  const cjkMatches = text.match(cjkRe);
  const cjk = cjkMatches ? cjkMatches.length : 0;
  const rest = text.replace(cjkRe,' ').trim();
  const restCount = rest ? rest.split(/\s+/).filter(Boolean).length : 0;
  return cjk + restCount;
};
const readingMinutes = (words) => Math.max(1, Math.round(words / 225));

// Plain text extraction
const htmlToText = (html) => {
  if(!html) return '';
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent||'').trim();
};
// Very simple HTML → Markdown (best-effort)
const htmlToMarkdown = (html) => {
  if(!html) return '';
  let s = html;
  // Block elements first
  s = s.replace(/<h1[^>]*>(.*?)<\/h1>/gis, '\n# $1\n\n');
  s = s.replace(/<h2[^>]*>(.*?)<\/h2>/gis, '\n## $1\n\n');
  s = s.replace(/<h3[^>]*>(.*?)<\/h3>/gis, '\n### $1\n\n');
  s = s.replace(/<blockquote[^>]*>([\s\S]*?)<\/blockquote>/gis, (_, c) =>
    '\n' + c.replace(/<[^>]*>/g,'').split('\n').map(l => '> ' + l.trim()).join('\n') + '\n\n');
  // Inline elements
  s = s.replace(/<(strong|b)[^>]*>(.*?)<\/\1>/gis, '**$2**');
  s = s.replace(/<(em|i)[^>]*>(.*?)<\/\1>/gis, '*$2*');
  s = s.replace(/<u[^>]*>(.*?)<\/u>/gis, '$1');
  s = s.replace(/<li[^>]*>(.*?)<\/li>/gis, '- $1\n');
  s = s.replace(/<\/?(ul|ol)[^>]*>/gis, '\n');
  s = s.replace(/<br\s*\/?>/gi, '\n');
  s = s.replace(/<\/p>\s*<p[^>]*>/gis, '\n\n');
  s = s.replace(/<p[^>]*>/gi, '').replace(/<\/p>/gi, '\n');
  s = s.replace(/<[^>]+>/g, '');
  // HTML entities
  s = s.replace(/&nbsp;/g, ' ')
       .replace(/&amp;/g, '&')
       .replace(/&lt;/g, '<')
       .replace(/&gt;/g, '>')
       .replace(/&quot;/g, '"')
       .replace(/&#39;/g, "'")
       .replace(/&apos;/g, "'");
  s = s.replace(/\n{3,}/g, '\n\n').trim();
  return s;
};

const sanitizeHTML = (dirty) => {
  if(!dirty) return '';
  const ALLOW_TAGS = new Set(['P','BR','B','STRONG','I','EM','U','H1','H2','H3','UL','OL','LI','BLOCKQUOTE','A','HR','CODE','DIV','SPAN']);
  const ALLOW_ATTR = new Set(['href','dir','class']);
  const doc = new DOMParser().parseFromString(`<div>${dirty}</div>`,'text/html');
  const root = doc.body.firstChild;
  const walk = (node) => {
    // Snapshot children before modifying — avoid live NodeList issues
    const children = [...node.childNodes];
    for(const n of children){
      if(n.nodeType === 1){
        if(!ALLOW_TAGS.has(n.tagName)){
          // Unwrap: move all children before the node, then remove
          const frag = document.createDocumentFragment();
          while(n.firstChild) frag.appendChild(n.firstChild);
          n.parentNode.insertBefore(frag, n);
          n.parentNode.removeChild(n);
        } else {
          [...n.attributes].forEach(a => {
            if(!ALLOW_ATTR.has(a.name)) n.removeAttribute(a.name);
            else if(a.name === 'href' && !/^https?:|^mailto:|^#/.test(a.value)) n.removeAttribute(a.name);
          });
          walk(n);
        }
      } else if(n.nodeType !== 3 && n.nodeType !== 4){
        n.parentNode && n.parentNode.removeChild(n);
      }
    }
  };
  walk(root);
  return root.innerHTML;
};

// Date helpers (ISO date, today key)
const todayKey = () => {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
const daysAgoKey = (n) => {
  const d = new Date();
  d.setDate(d.getDate()-n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
const fmtDate = (iso, lang='en') => {
  if(!iso) return '';
  try {
    const d = new Date(iso);
    return new Intl.DateTimeFormat(lang==='ar'?'ar':'en-GB',{day:'numeric',month:'short',year:'numeric'}).format(d);
  } catch { return iso; }
};
const fmtRelative = (iso, lang='en') => {
  if(!iso) return '';
  const d = new Date(iso);
  const diff = Date.now() - d.getTime();
  // Guard against future timestamps (clock skew)
  if(diff < 0) return fmtDate(iso, lang);
  const mins = Math.round(diff/60000), hours = Math.round(mins/60), days = Math.round(hours/24);
  try {
    const rtf = new Intl.RelativeTimeFormat(lang==='ar'?'ar':'en', {numeric:'auto'});
    if(mins < 60) return rtf.format(-mins, 'minute');
    if(hours < 24) return rtf.format(-hours, 'hour');
    if(days < 30) return rtf.format(-days, 'day');
  } catch { /* Intl not available */ }
  return fmtDate(iso, lang);
};

const makeDebouncer = () => {
  let timer = null;
  let pendingCallback = null;
  const fn = (callback, ms=500) => {
    if(timer) clearTimeout(timer);
    pendingCallback = callback;
    timer = setTimeout(() => { timer = null; pendingCallback = null; callback(); }, ms);
  };
  fn.cancel = () => {
    if(timer){ clearTimeout(timer); timer = null; pendingCallback = null; }
  };
  fn.flush = () => {
    if(timer && pendingCallback){
      clearTimeout(timer);
      const cb = pendingCallback;
      timer = null; pendingCallback = null;
      cb();
    }
  };
  return fn;
};

const downloadFile = (name, content, type='application/json') => {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), {href: url, download: name});
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  // Revoke after a short delay to allow the download to start
  setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1500);
};

const slug = (s) => {
  const base = s || 'untitled';
  try {
    return base.replace(/[^\p{L}\p{N}_\-]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'untitled';
  } catch {
    // Fallback for environments without Unicode property escapes
    return base.replace(/[^a-zA-Z0-9_\-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'untitled';
  }
};

// Pick/weighted initial letter
const initials = (name) => {
  if(!name) return '?';
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
};

const THEME_DOT_COLORS = {dark:'#1a1a1f', warm:'#2a231d', sepia:'#e8dcc4', midnight:'#0a0f1f'};

/* Unified "save file" — tries the File System Access API for a native Save-As
   dialog, falls back to the Downloads folder if not supported or cancelled.
   Returns: 'saved' | 'cancelled' | 'error'. */
const saveFileWithPicker = async (fileName, data, mime='text/plain;charset=utf-8', extension='.txt') => {
  if(window.showSaveFilePicker){
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description: 'File', accept: { [mime.split(';')[0]]: [extension] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(data);
      await writable.close();
      return 'saved';
    } catch(err){
      return err.name === 'AbortError' ? 'cancelled' : 'error';
    }
  }
  // Fallback: regular download
  try {
    downloadFile(fileName, data, mime);
    return 'saved';
  } catch(err){
    return 'error';
  }
};

/* Novel → reader-friendly TXT output. Used by sidebar TXT button and settings export. */
const buildNovelTxt = (project, lang) => {
  const totalWords = project.chapters.reduce((s,c)=>s+(c.wc||0),0);
  const pad = (s, len) => {
    const diff = Math.max(0, len - s.length);
    const left = Math.floor(diff/2);
    return ' '.repeat(left) + s + ' '.repeat(diff-left);
  };
  const WIDTH = 60;
  let out = '\n\n' + pad(project.name, WIDTH) + '\n';
  out += pad('─'.repeat(Math.min(project.name.length+4, WIDTH-4)), WIDTH) + '\n\n';
  out += pad(`${project.chapters.length} ${lang==='ar'?'فصلاً':'chapters'} · ${totalWords.toLocaleString()} ${lang==='ar'?'كلمة':'words'}`, WIDTH) + '\n\n';
  project.chapters.forEach((c,i)=>{
    const chTitle = c.title || (lang==='ar' ? `الفصل ${i+1}` : `Chapter ${i+1}`);
    out += '\n\n\n';
    out += pad('═'.repeat(50), WIDTH) + '\n';
    out += pad(chTitle, WIDTH) + '\n';
    out += pad('═'.repeat(50), WIDTH) + '\n\n\n';
    out += htmlToText(c.content||'').trim() + '\n';
  });
  out += '\n\n\n' + pad(lang==='ar'?'— النهاية —':'— The End —', WIDTH) + '\n\n';
  return '\uFEFF' + out; // BOM for Windows Notepad
};

const LANG = {

    // Chapters
    chapters:'Chapters', scenes:'Scenes', findChapter:'Find chapter…',

    beginStory:'Begin your story…', chapter:'Chapter', scene:'Scene',

    renameCh:'Rename', deleteCh:'Delete', duplicate:'Duplicate',
    setGoal:'Set word goal', goalReached:'Goal reached',
    goalFor:'Words goal', currentGoal:'Current:',

/* Pixel art: small palette of 6 writing-themed colours + background. Each
   project can store a custom 8×8 pixel icon instead of using an emoji.
   Stored on the project as `pixelIcon` = string of 64 chars, each 0-6:
     0 = empty (transparent), 1-6 = index into PIXEL_PALETTE. */
const PIXEL_PALETTE = [
  'transparent',         // 0 — empty
  '#c49a5a',            // 1 — gold / ink
  '#e8dcc4',            // 2 — paper

/* ▎ Supabase Sync ───────────────────────────────────────────────────────── */
const SUPABASE_URL = 'https://knmiervzjlmjkuofelkc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jgdpqjb5zbWG3VdC8oYrAw_5m5eEcXN';
const SYNC_SESSION_KEY = 'riwailist_sync_session_v1';
const SYNC_LAST_KEY = 'riwailist_sync_last_v1';

// Lazily initialise the Supabase client once (browser-only)
let _supabase = null;
const getSupabase = () => {
  if(!_supabase && window.supabase){
    _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        storageKey: SYNC_SESSION_KEY,
        storage: window.localStorage,
        autoRefreshToken: true,
      }
    });
  }
  return _supabase;
};

// Auth helpers
const sbSignUp = async (email, password) => {
  const sb = getSupabase();
  if(!sb) return { error: { message: 'Supabase not available' } };
  return sb.auth.signUp({ email, password });
};
const sbSignIn = async (email, password) => {
  const sb = getSupabase();
  if(!sb) return { error: { message: 'Supabase not available' } };
  return sb.auth.signInWithPassword({ email, password });
};
const sbSignOut = async () => {
  const sb = getSupabase();
  if(!sb) return;
  await sb.auth.signOut();
};
const sbGetSession = async () => {
  const sb = getSupabase();
  if(!sb) return null;
  const { data } = await sb.auth.getSession();
  return data?.session || null;
};

const sbResetPassword = async (email) => {
  const sb = getSupabase();
  if(!sb) return { error: { message: 'Supabase not available' } };
  return sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.href,
  });
};

// Upload: serialise current localStorage into stories table (one row per user)
const sbUpload = async (rawData) => {
  const sb = getSupabase();
  if(!sb) return { error: 'Supabase not available' };
  const session = await sbGetSession();
  if(!session) return { error: 'Not signed in' };
  const userId = session.user.id;
  const title = 'riwailist_local_backup';
  const content = typeof rawData === 'string' ? rawData : JSON.stringify(rawData);
  const now = new Date().toISOString();

  // Check if a row already exists for this user
  const { data: existing, error: selectErr } = await sb.from('stories')
    .select('id')
    .eq('user_id', userId)
    .eq('title', title)
    .maybeSingle();

  if(selectErr) return { error: selectErr.message };

  let error;
  if(existing?.id){
    // Row exists → UPDATE
    ({ error } = await sb.from('stories')
      .update({ content, updated_at: now })
      .eq('id', existing.id)
      .eq('user_id', userId)); // RLS guard
  } else {
    // No row yet → INSERT
    ({ error } = await sb.from('stories')
      .insert({ user_id: userId, title, content, updated_at: now }));
  }

  if(!error) localStorage.setItem(SYNC_LAST_KEY, now);
  return { error: error?.message };
};

// Download: fetch latest row from stories table
const sbDownload = async () => {
  const sb = getSupabase();
  if(!sb) return { error: 'Supabase not available', data: null };
  const session = await sbGetSession();
  if(!session) return { error: 'Not signed in', data: null };
  const userId = session.user.id;
  const title = 'riwailist_local_backup';
  const { data, error } = await sb.from('stories')
    .select('content, updated_at')
    .eq('user_id', userId)
    .eq('title', title)
    .maybeSingle();
  return { error: error?.message, data };
};

/* ▎ AuthGate ────────────────────────────────────────────────────────────── */
function AuthGate({ onAuth, lang, setLang }) {
  const [tab, setTab] = useState('login');       // 'login' | 'register' | 'forgot'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [checking, setChecking] = useState(true); // checking for existing session
  const [err, setErr] = useState('');
  const [msg, setMsg] = useState('');

  // On mount: check for an existing valid session → skip gate entirely
  useEffect(() => {
    sbGetSession().then(s => {
      if(s?.user) onAuth(s.user);
      else setChecking(false);
    });
  }, []);

  const handleForgot = async () => {
    if(!email.trim()) {
      setErr(lang==='ar' ? 'يرجى إدخال بريدك الإلكتروني' : 'Please enter your email address');
      return;
    }
    setLoading(true); setErr(''); setMsg('');
    try {
      const { error } = await sbResetPassword(email.trim());
      if(error) { setErr(error.message); }
      else {
        setMsg(lang==='ar'
          ? '✓ تم الإرسال! تحقق من بريدك الإلكتروني وافتح رابط إعادة تعيين كلمة المرور.'
          : '✓ Email sent! Check your inbox for the password reset link.');
      }
    } catch(e) { setErr(e.message); }
    setLoading(false);
  };

  const handleSubmit = async () => {
    if(tab === 'forgot') { handleForgot(); return; }
    if(!email.trim() || !password.trim()) {
      setErr(lang==='ar' ? 'يرجى إدخال البريد الإلكتروني وكلمة المرور' : 'Please enter email and password');
      return;
    }
    setLoading(true); setErr(''); setMsg('');
    try {
      if(tab === 'register') {
        const { data, error } = await sbSignUp(email.trim(), password);
        if(error) { setErr(error.message); }
        else if(data?.user?.identities?.length === 0) {
          setErr(lang==='ar' ? 'هذا البريد الإلكتروني مسجّل بالفعل' : 'This email is already registered');
        } else if(data?.session) {
          onAuth(data.user);
        } else {
          setMsg(lang==='ar'
            ? '✓ تم إنشاء حسابك! تحقق من بريدك الإلكتروني للتأكيد ثم سجّل دخولك.'
            : '✓ Account created! Check your email to confirm, then sign in.');
          setTab('login');
        }
      } else {
        const { data, error } = await sbSignIn(email.trim(), password);
        if(error) { setErr(error.message); }
        else if(data?.user) { onAuth(data.user); }
      }
    } catch(e) { setErr(e.message); }
    setLoading(false);
  };

  const isAr = lang === 'ar';

  // While checking session show a minimal loading screen
  if(checking) return (
    <div className="auth-gate" dir={isAr?'rtl':'ltr'}>
      <div style={{color:'var(--txm)',fontSize:13,fontFamily:'var(--ff-ui)',display:'flex',alignItems:'center',gap:10}}>
        <span className="spin" style={{fontSize:18}}>↻</span>
        {isAr ? 'جارٍ التحقق…' : 'Checking session…'}
      </div>
    </div>
  );

  return (
    <div className="auth-gate" dir={isAr?'rtl':'ltr'}>
      <div className="auth-card">

        {/* Language toggle */}
        <button className="auth-lang-btn" onClick={()=>setLang(isAr?'en':'ar')}>
          {isAr ? 'English' : 'عربي'}
        </button>

        {/* Header */}
        <div className="auth-card-top">
          <div className="auth-logo">R</div>
          <div className="auth-app-name">{isAr ? 'رِوايِليست' : 'Riwailist'}</div>
          <div className="auth-app-sub">{isAr ? 'بيئة الكتابة الاحترافية' : 'Professional Writing Suite'}</div>
        </div>

        {/* Form */}
        <div className="auth-body">
          {/* Tabs — hidden in forgot mode */}
          {tab !== 'forgot' && (
            <div className="auth-tabs">
              <button className={`auth-tab ${tab==='login'?'on':''}`} onClick={()=>{setTab('login');setErr('');setMsg('');}}>
                {isAr ? 'تسجيل الدخول' : 'Sign in'}
              </button>
              <button className={`auth-tab ${tab==='register'?'on':''}`} onClick={()=>{setTab('register');setErr('');setMsg('');}}>
                {isAr ? 'حساب جديد' : 'Create account'}
              </button>
            </div>
          )}

          {/* Forgot header */}
          {tab === 'forgot' && (
            <div style={{marginBottom:18}}>
              <button onClick={()=>{setTab('login');setErr('');setMsg('');}} style={{display:'inline-flex',alignItems:'center',gap:5,background:'none',border:'none',color:'var(--tx2)',fontSize:12,cursor:'pointer',marginBottom:12,padding:0}}>
                <span style={{fontSize:14}}>←</span>
                {isAr ? 'رجوع لتسجيل الدخول' : 'Back to sign in'}
              </button>
              <div style={{fontSize:13.5,fontWeight:600,color:'var(--tx)',marginBottom:4}}>
                {isAr ? 'إعادة تعيين كلمة المرور' : 'Reset your password'}
              </div>
              <div style={{fontSize:12,color:'var(--tx2)',lineHeight:1.6}}>
                {isAr ? 'أدخل بريدك وسنرسل لك رابط إعادة التعيين.' : 'Enter your email and we’ll send you a reset link.'}
              </div>
            </div>
          )}

          {err && <div className="auth-error">{err}</div>}
          {msg && <div className="auth-success">{msg}</div>}

          <div className="auth-field">
            <label className="auth-label">{isAr ? 'البريد الإلكتروني' : 'Email'}</label>
            <input className="auth-input" type="email" value={email} dir="ltr"
              placeholder={isAr ? 'بريدك الإلكتروني…' : 'your@email.com'}
              autoComplete="email" autoFocus
              onChange={e=>setEmail(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&handleSubmit()}/>
          </div>

          {tab !== 'forgot' && (
            <div className="auth-field" style={{marginBottom:6}}>

/* ▎ SyncModal component ─────────────────────────────────────────────────── */
function SyncModal({ open, onClose, t, lang, push, state, initialUser, onSignOut }) {
  const [tab, setTab] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [user, setUser] = useState(initialUser || null);
  const [lastSync, setLastSync] = useState(() => localStorage.getItem(SYNC_LAST_KEY));
  const [syncLoading, setSyncLoading] = useState(null);

  // Stay in sync with the authenticated user from App
  useEffect(() => { setUser(initialUser || null); }, [initialUser]);

  useEffect(() => {
    if(!open) return;
    setErr('');
    setLastSync(localStorage.getItem(SYNC_LAST_KEY));
  }, [open]);

  const handleAuth = async () => {
    if(!email.trim() || !password.trim()) { setErr(lang==='ar'?'يرجى إدخال البريد الإلكتروني وكلمة المرور':'Please enter email and password'); return; }
    setLoading(true); setErr('');
    try {
      const fn = tab === 'register' ? sbSignUp : sbSignIn;
      const { data, error } = await fn(email.trim(), password);
      if(error) { setErr(error.message); }
      else if(data?.user) { setUser(data.user); setEmail(''); setPassword(''); }
      else if(tab==='register') { setErr(lang==='ar'?'تحقق من بريدك الإلكتروني لتأكيد حسابك':'Check your email to confirm your account'); }
    } catch(e) { setErr(e.message); }
    setLoading(false);
  };

  const handleSignOut = async () => {
    await sbSignOut();
    setUser(null);
    if(onSignOut) onSignOut(); // returns to AuthGate
  };

  const handleUpload = async () => {
    setSyncLoading('up');
    const raw = localStorage.getItem(STORAGE_KEY) || '{}';
    const { error } = await sbUpload(raw);
    setSyncLoading(null);
    if(error) { push((lang==='ar'?'فشل الرفع: ':'Upload failed: ') + error, 'error'); }
    else { setLastSync(localStorage.getItem(SYNC_LAST_KEY)); push(lang==='ar'?'✓ تم رفع بياناتك إلى السحاب':'✓ Data uploaded to cloud', 'success'); }
  };

  const handleDownload = async () => {
    const confirmed = window.confirm(lang==='ar'?
      'سيتم استبدال بياناتك المحلية ببيانات السحاب. هل أنت متأكد؟':
      'This will replace your local data with the cloud version. Continue?');
    if(!confirmed) return;
    setSyncLoading('down');
    const { error, data } = await sbDownload();
    setSyncLoading(null);
    if(error) { push((lang==='ar'?'فشل التحميل: ':'Download failed: ') + error, 'error'); return; }
    if(!data?.content) { push(lang==='ar'?'لا توجد بيانات في السحاب بعد':'No cloud data found yet', 'info'); return; }
    try {
      let contentStr = data.content;

      // Guard: if Supabase returned an object instead of a string, stringify it
      if(typeof contentStr !== 'string') {
        contentStr = JSON.stringify(contentStr);
      }

      // Validate: must parse as a valid JSON object
      const parsed = JSON.parse(contentStr);
      if(!parsed || typeof parsed !== 'object') throw new Error('Invalid data format');

      // Ensure the version field is present and correct — loadState requires it.
      // If the cloud data has no version, stamp it so loadState accepts it.
      if(!parsed.version) parsed.version = SCHEMA_VERSION;
      if(!Array.isArray(parsed.projects)) throw new Error('No projects array found in cloud data');

      // Re-stringify after possible version fix
      const finalStr = JSON.stringify(parsed);

      // Freeze auto-save: patch saveState so any in-flight debounced write is a no-op
      saveState._frozen = true;

      // Clear the key first, then write the cloud data
      localStorage.removeItem(STORAGE_KEY);
      localStorage.setItem(STORAGE_KEY, finalStr);

      // Verify write
      const written = localStorage.getItem(STORAGE_KEY);
      if(!written) throw new Error('localStorage write failed silently');

      // Double-check: re-parse what we wrote to confirm round-trip integrity
      const check = JSON.parse(written);
      if(!check || !Array.isArray(check.projects)) throw new Error('Write verification failed');

      console.log('[Sync] Downloaded', check.projects.length, 'projects from cloud. Reloading…');

      push(lang==='ar'?`✓ تم تحميل ${check.projects.length} مشاريع. جاري إعادة التشغيل…`:`✓ Loaded ${check.projects.length} project(s). Reloading…`, 'success');

      // Hard reload — bypass any cached JS state
      setTimeout(() => { window.location.href = window.location.href; }, 1400);
    } catch(e) {
      saveState._frozen = false;
      push((lang==='ar'?'خطأ: ':'Error: ') + e.message, 'error');
    }
  };

  if(!open) return null;

  const isAr = lang === 'ar';
  const ls = lastSync ? new Date(lastSync).toLocaleString(isAr?'ar':'en-GB',{dateStyle:'short',timeStyle:'short'}) : null;

  return (
    <div className="sync-modal-overlay" onClick={onClose}>
      <div className="sync-modal" dir={isAr?'rtl':'ltr'} onClick={e=>e.stopPropagation()}>
        <div className="sync-modal-head">
          <div className="sync-modal-logo"><Icon.Cloud/></div>
          <div className="sync-modal-title">{isAr?'مزامنة السحاب':'Cloud Sync'}</div>
          <div className="sync-modal-sub">{isAr?'احتفظ بنسخة من بياناتك في السحاب وادخل إليها من أي جهاز':'Keep your data backed up and accessible from anywhere'}</div>
        </div>

        <div className="sync-modal-body">
          {!user ? (
            <>
              {err && <div className="sync-error">{err}</div>}
              <div className="sync-form-group">
                <label className="sync-form-label">{isAr?'البريد الإلكتروني':'Email'}</label>
                <input className="sync-form-input" type="email" value={email}
                  onChange={e=>setEmail(e.target.value)} placeholder={isAr?'بريدك الإلكتروني…':'your@email.com'}
                  onKeyDown={e=>e.key==='Enter'&&handleAuth()}
                  dir="ltr" autoComplete="email"/>
              </div>
              <div className="sync-form-group" style={{marginBottom:0}}>
                <label className="sync-form-label">{isAr?'كلمة المرور':'Password'}</label>
                <input className="sync-form-input" type="password" value={password}
                  onChange={e=>setPassword(e.target.value)} placeholder="••••••••"
                  onKeyDown={e=>e.key==='Enter'&&handleAuth()}
                  dir="ltr" autoComplete={tab==='register'?'new-password':'current-password'}/>
              </div>
            </>
          ) : (
            <>
              <div className="sync-user-bar">
                <div className="sync-user-avatar">{(user.email||'?')[0].toUpperCase()}</div>
                <div className="sync-user-info">
                  <div className="sync-user-email">{user.email}</div>
                  <div className="sync-user-status">{isAr?'متصل':'Connected'}</div>
                </div>
              </div>
              <div className="sync-actions-row">
                <button className="sync-action-card" onClick={handleUpload} disabled={!!syncLoading}>
                  <div className="sync-action-icon">
                    {syncLoading==='up' ? <span className="spin">↻</span> : <Icon.CloudUp/>}
                  </div>
                  <div className="sync-action-label">{isAr?'رفع المزامنة':'Upload'}</div>
                  <div className="sync-action-desc">{isAr?'ارفع بياناتك المحلية إلى السحاب':'Push local data to cloud'}</div>
                </button>
                <button className="sync-action-card" onClick={handleDownload} disabled={!!syncLoading}>
                  <div className="sync-action-icon">
                    {syncLoading==='down' ? <span className="spin">↻</span> : <Icon.CloudDown/>}
                  </div>
                  <div className="sync-action-label">{isAr?'تحميل المزامنة':'Download'}</div>
                  <div className="sync-action-desc">{isAr?'حمّل آخر نسخة من السحاب':'Pull latest cloud data'}</div>
                </button>
              </div>
              {ls && <div className="sync-last">{isAr?`آخر مزامنة: ${ls}`:`Last synced: ${ls}`}</div>}
            </>
          )}
        </div>

        <div className="sync-modal-foot">
          {!user ? (
            <>
              <button className="sync-btn-primary" onClick={handleAuth} disabled={loading}>
                {loading ? (isAr?'جارٍ التحميل…':'Loading…') : tab==='register' ? (isAr?'إنشاء حساب':'Create account') : (isAr?'تسجيل الدخول':'Sign in')}
              </button>
              <div className="sync-divider">{isAr?'أو':'or'}</div>
              <button className="sync-btn-ghost" onClick={()=>{setTab(tab==='login'?'register':'login');setErr('');}}>
                {tab==='login' ? (isAr?'ليس لديك حساب؟ أنشئ واحدًا':'New here? Create an account') : (isAr?'لديك حساب بالفعل؟ سجّل الدخول':'Already have an account? Sign in')}
              </button>
              <button className="sync-btn-ghost" onClick={onClose}>{isAr?'إلغاء':'Cancel'}</button>
            </>
          ) : (
            <>
              <button className="sync-btn-ghost" onClick={onClose}>{isAr?'إغلاق':'Close'}</button>
              <button
                className="sync-btn-signout"
                onClick={async () => {
                  const ok = window.confirm(isAr?'هل تريد تسجيل الخروج من حسابك؟':'Sign out of your account?');
                  if(!ok) return;
                  await handleSignOut();
                  push(isAr?'تم تسجيل الخروج':'Signed out', 'info');
                  onClose();
                }}>
                <Icon.LogOut/>{isAr?'تسجيل الخروج':'Sign out'}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* Project-level snapshots. Keyed by project ID so each project has its OWN
   independent history (and the "N words, M projects" meta is per-project only).
   Storage shape: { [projectId]: [{id, ts, reason, wordsTotal, data}, ...] }
   data = a single project object (not the whole state).
   Keep MAX_SNAPSHOTS_PER_PROJECT most-recent per project. */
const loadAllSnapshots = () => {
  try {
    const raw = localStorage.getItem(SNAPSHOTS_KEY);
    if(!raw) return {};
    const obj = JSON.parse(raw);
    return (obj && typeof obj === 'object') ? obj : {};
  } catch { return {}; }
};
const saveAllSnapshots = (map) => {
  try { localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(map)); return true; }
  catch(e){ console.warn('Snapshot save failed:', e); return false; }
};
const loadSnapshotsFor = (projectId) => {
  if(!projectId) return [];
  const all = loadAllSnapshots();
  return Array.isArray(all[projectId]) ? all[projectId] : [];
};
const wordsOfProject = (project) => {
  if(!project) return 0;
  try {
    if(project.kind === 'screenplay')
      return (project.lines||[]).reduce((s,l)=>s+((l.text||'').split(/\s+/).filter(Boolean).length), 0);
    return (project.chapters||[]).reduce((s,c)=>s+(c.wc||0), 0);
  } catch { return 0; }
};
const makeProjectSnapshot = (project, reason='auto') => ({
  id: uid('snap'),
  ts: new Date().toISOString(),
  reason,
  wordsTotal: wordsOfProject(project),
  data: project, // the single project, not the whole state
});
const addProjectSnapshot = (project, reason='auto') => {
  if(!project || !project.id) return null;
  const snap = makeProjectSnapshot(project, reason);
  const all = loadAllSnapshots();
  const list = Array.isArray(all[project.id]) ? all[project.id] : [];
  all[project.id] = [snap, ...list].slice(0, MAX_SNAPSHOTS_PER_PROJECT);
  saveAllSnapshots(all);
  return snap;
};
const deleteProjectSnapshot = (projectId, snapshotId) => {
  const all = loadAllSnapshots();
  if(!all[projectId]) return;
  all[projectId] = all[projectId].filter(s => s.id !== snapshotId);
  saveAllSnapshots(all);
};
const deleteAllSnapshotsFor = (projectId) => {
  const all = loadAllSnapshots();
  delete all[projectId];
  saveAllSnapshots(all);
};
const getProjectSnapshot = (projectId, snapshotId) => {
  const list = loadSnapshotsFor(projectId);
  return list.find(s => s.id === snapshotId);
};

/* Helper: words across all projects (used by session / sprint hooks which
   want a "total writing activity today" baseline regardless of which project
   the user switches to). */
const totalWordsOfState = (state) => {
  try { return (state.projects||[]).reduce((sum, p) => sum + wordsOfProject(p), 0); }
  catch { return 0; }
};

// Migration from original app (v1) — DISABLED. If the user wants their old
// data back, they can use the Import feature. This keeps the app clean by default.
const migrateFromV1 = () => null;

const loadState = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const state = JSON.parse(raw);
      if(state && state.version === SCHEMA_VERSION && Array.isArray(state.projects)) return state;
      // Try migrating older versions
      if(state && state.version < SCHEMA_VERSION){
        const migrated = runMigrations(state);
        if(migrated) return migrated;
      }
    }
    // Try v1 migration
    const v1 = migrateFromV1();
    if(v1){
      return {
        version: SCHEMA_VERSION,
        lang: v1.lang,
        tweaks: v1.tweaks,
        projects: [v1.project],
        activeProjectId: v1.project.id,
        view: 'home',
      };
    }
  } catch(e){ console.warn('State load failed', e); }
  return null;
};

const saveState = (state) => {
  // Frozen: a sync download is in progress — do NOT overwrite localStorage
  if(saveState._frozen) return false;
  try {
    const data = JSON.stringify(state);
    const kbUsed = Math.round(data.length / 1024);
    // Warn (once per session) when approaching 4MB — localStorage typical limit is ~5-10MB
    if(data.length > 4_000_000 && !saveState._warned){
      saveState._warned = true;
      console.warn(`Riwailist: storage usage is high (${kbUsed}KB). Consider exporting and cleaning old projects.`);
      try {
        window.dispatchEvent(new CustomEvent('riwailist:storage-warning', {detail:{size:data.length, kb:kbUsed}}));
      } catch(e){}
    }
    localStorage.setItem(STORAGE_KEY, data);
    return true;
  } catch(e){
    console.error('Save failed', e);
    try {
      window.dispatchEvent(new CustomEvent('riwailist:storage-error', {detail:{error:e.message}}));
    } catch(_){}
    return false;
  }
};

/* Schema migration: when SCHEMA_VERSION increases in a future release, add a
   migrator function to this table keyed by the OLD version. Each migrator
   receives the old-shape state and returns the new-shape state. */
const SCHEMA_MIGRATIONS = {
  // Example: 3: (old) => ({...old, version: 4, tweaks: {...old.tweaks, newField: 'default'}}),
};

const runMigrations = (state) => {
  let s = state;
  while(s && s.version < SCHEMA_VERSION){
    const migrator = SCHEMA_MIGRATIONS[s.version];
    if(!migrator) return null; // unknown version jump — bail out
    s = migrator(s);
  }
  return s;
};

/* ▎ Reducer ─────────────────────────────────────────────────────────────── */
const initialState = () => {
  const loaded = loadState();
  if(loaded) return loaded;
  return {
    version: SCHEMA_VERSION,
    lang: 'en',
    tweaks: {...DEFAULT_TWEAKS},
    projects: [],
    activeProjectId: null,
    view: 'home',
  };
};

// Helpers for reducer
const updateActiveProject = (state, updater) => {
  if(!state.activeProjectId) return state;
  return {
    ...state,
    projects: state.projects.map(p => {
      if(p.id !== state.activeProjectId) return p;
      const next = updater(p);
      return {...next, updatedAt: new Date().toISOString()};
    })
  };
};

const computeStreak = (daily) => {
  let streak = 0;
  for(let i = 0; i < 365; i++){
    const key = daysAgoKey(i);
    if((daily[key] || 0) > 0) streak++;
    else if(i > 0) break; // today always counts (we just wrote), only break on past gaps
  }
  return streak;
};

const recordDailyWords = (proj, addedWords) => {
  if(!addedWords || addedWords <= 0) return proj;
  const k = todayKey();
  const daily = {...(proj.streak?.daily||{})};
  daily[k] = (daily[k]||0) + addedWords;
  const streak = computeStreak(daily);
  const longest = Math.max(proj.streak?.longest||0, streak);
  return {...proj, streak:{...proj.streak, daily, current: streak, longest, lastDay: k}};
};

function reducer(state, action){
  switch(action.type){
    case 'HYDRATE': return action.state;
    case 'SET_LANG': return {...state, lang: action.lang};
    case 'SET_VIEW': return {...state, view: action.view};
    case 'SET_TWEAKS': return {...state, tweaks: {...state.tweaks, ...action.tweaks}};

    // Projects
    case 'CREATE_PROJECT': {
      const p = action.project;
      return {...state, projects: [...state.projects, p], activeProjectId: p.id, view: 'app'};
    }
    case 'OPEN_PROJECT': return {...state, activeProjectId: action.id, view:'app'};
    case 'UPDATE_PROJECT': return updateActiveProject(state, p => ({...p, ...action.patch}));
    case 'RENAME_PROJECT': return {
      ...state,
      projects: state.projects.map(p => p.id===action.id ? {...p, name: action.name, updatedAt: new Date().toISOString()} : p)
    };
    case 'DELETE_PROJECT': {
      const projects = state.projects.filter(p=>p.id!==action.id);
      // Also purge this project's snapshots from storage
      try { deleteAllSnapshotsFor(action.id); } catch(e){}
      return {...state, projects, activeProjectId: state.activeProjectId===action.id ? null : state.activeProjectId, view: state.activeProjectId===action.id ? 'home' : state.view};
    }
    case 'REPLACE_PROJECT': return {
      ...state,
      projects: state.projects.map(p => p.id===action.project.id ? action.project : p)
    };
    case 'RESET_ALL': return {...state, projects: [], activeProjectId: null, view: 'home'};

    // Chapters
    case 'ADD_CHAPTER': return updateActiveProject(state, p => ({
      ...p, chapters: [...p.chapters, action.chapter]
    }));
    case 'UPDATE_CHAPTER': return updateActiveProject(state, p => {
      const prev = p.chapters.find(c=>c.id===action.id);
      const next = {...p, chapters: p.chapters.map(c=>c.id===action.id?{...c,...action.patch}:c)};
      // record daily words if wc changed upward
      if(action.patch.wc !== undefined && prev){
        const diff = action.patch.wc - (prev.wc||0);
        if(diff > 0) return recordDailyWords(next, diff);
      }
      return next;
    });
    case 'DELETE_CHAPTER': return updateActiveProject(state, p => ({
      ...p, chapters: p.chapters.filter(c=>c.id!==action.id)
    }));
    case 'REORDER_CHAPTERS': return updateActiveProject(state, p => ({...p, chapters: action.chapters}));
    case 'DUPLICATE_CHAPTER': return updateActiveProject(state, p => {
      const src = p.chapters.find(c=>c.id===action.id);
      if(!src) return p;
      const idx = p.chapters.indexOf(src);
      const copy = {...src, id: uid('ch'), title: src.title + ' (copy)', scenes: (src.scenes||[]).map(s=>({...s,id:uid('sc')}))};
      const chapters = [...p.chapters.slice(0,idx+1), copy, ...p.chapters.slice(idx+1)];
      return {...p, chapters};
    });

    // Characters
    case 'ADD_CHAR': return updateActiveProject(state, p => ({...p, characters: [...p.characters, action.character]}));
    case 'UPDATE_CHAR': return updateActiveProject(state, p => ({
      ...p, characters: p.characters.map(c=>c.id===action.id?{...c,...action.patch}:c)
    }));
    case 'DELETE_CHAR': return updateActiveProject(state, p => ({
      ...p, characters: p.characters.filter(c=>c.id!==action.id),
      // remove dangling relations
      // (simple): we leave relations as they are; could also clean but that's not urgent
    }));

    // Locations
    case 'ADD_LOC': return updateActiveProject(state, p => ({...p, locations: [...p.locations, action.location]}));
    case 'UPDATE_LOC': return updateActiveProject(state, p => ({
      ...p, locations: p.locations.map(l=>l.id===action.id?{...l,...action.patch}:l)
    }));
    case 'DELETE_LOC': return updateActiveProject(state, p => ({...p, locations: p.locations.filter(l=>l.id!==action.id)}));

    // Events
    case 'ADD_EVENT': return updateActiveProject(state, p => ({...p, events: [...p.events, action.event]}));
    case 'UPDATE_EVENT': return updateActiveProject(state, p => ({
      ...p, events: p.events.map(ev=>ev.id===action.id?{...ev,...action.patch}:ev)
    }));
    case 'DELETE_EVENT': return updateActiveProject(state, p => ({...p, events: p.events.filter(ev=>ev.id!==action.id)}));

    // Blueprint & notes
    case 'UPDATE_BP': return updateActiveProject(state, p => ({...p, blueprint: {...p.blueprint, [action.key]: action.value}}));
    case 'UPDATE_NOTES': return updateActiveProject(state, p => ({...p, notes: action.value}));
    case 'UPDATE_GOAL': return updateActiveProject(state, p => ({...p, goal: {...p.goal, ...action.goal}}));

    default: return state;
  }
}

/* ▎ Context & Hooks ───────────────────────────────────────────────────── */
const AppCtx = createContext(null);
const ToastCtx = createContext(null);

// Auto-save hook: debounces + reflects status. Uses a *private* debouncer.
// Also takes periodic per-project snapshots of the ACTIVE project so the
// user can roll back to earlier versions of that project (independently of
// other projects).
function useAutoSave(state){
  const [status, setStatus] = useState('saved'); // 'saved' | 'saving'
  const persistDeb = useRef(makeDebouncer());
  const statusDeb = useRef(makeDebouncer());
  const first = useRef(true);
  const lastSnapRef = useRef({}); // keyed by project id: { [id]: {ts, words} }

  useEffect(() => {
    if(first.current){ first.current = false; return; }
    setStatus('saving');
    persistDeb.current(() => {
      saveState(state);
      statusDeb.current(() => setStatus('saved'), 300);
      // Consider a per-project snapshot for the ACTIVE project only
      try {
        const activeProj = (state.projects||[]).find(p => p.id === state.activeProjectId);
        if(!activeProj) return;
        const now = Date.now();
        const words = wordsOfProject(activeProj);
        const last = lastSnapRef.current[activeProj.id] || { ts: now, words };
        // First time we see this project in this session — seed the baseline
        if(!lastSnapRef.current[activeProj.id]){
          lastSnapRef.current[activeProj.id] = { ts: now, words };
          return;
        }
        const dWords = Math.abs(words - last.words);
        const dTime = now - last.ts;
        if(dTime > SNAPSHOT_MIN_INTERVAL_MS && (dWords >= SNAPSHOT_WORD_DELTA || dTime > 60*60*1000)){
          addProjectSnapshot(activeProj, 'auto');
          lastSnapRef.current[activeProj.id] = { ts: now, words };
        }
      } catch(e){ /* snapshot failures are non-fatal */ }
    }, 600);
  }, [state]);

  // Save immediately on unload — flush any debounced save in progress
  useEffect(() => {
    const h = () => {
      persistDeb.current.flush(); // flush the debouncer first
      saveState(state);
    };
    window.addEventListener('beforeunload', h);
    return () => window.removeEventListener('beforeunload', h);
  }, [state]);

  return status;
}

/* useSession — tracks current writing-session stats: when it started,
   how many words have been added since the start, time elapsed, WPM.
   The baseline is captured on mount (or on manual reset). */
function useSession(state){
  const startTimeRef = useRef(Date.now());
  const baselineWordsRef = useRef(totalWordsOfState(state));
  const [tick, setTick] = useState(0);

  // Force re-render every 10s so time-based stats stay fresh
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 10000);
    return () => clearInterval(id);
  }, []);

  const currentWords = totalWordsOfState(state);
  const wordsAdded = Math.max(0, currentWords - baselineWordsRef.current);
  const elapsedMs = Date.now() - startTimeRef.current;
  const elapsedMin = Math.max(1, Math.round(elapsedMs / 60000));
  const wpm = wordsAdded > 0 ? Math.round(wordsAdded / (elapsedMs / 60000)) : 0;
  const startTimeStr = new Date(startTimeRef.current).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
  return { startTime: startTimeRef.current, startTimeStr, wordsAdded, elapsedMin, wpm };
}

/* useSprint — writing sprint timer. Returns { active, remaining, percent,
   wordsInSprint, start, stop }. */
function useSprint(state, push, t){
  const [sprint, setSprint] = useState(null); // { endsAt, startedAt, baselineWords, goal, duration }
  const [, tick] = useState(0);

  useEffect(() => {
    if(!sprint) return;
    const id = setInterval(() => {
      if(Date.now() >= sprint.endsAt){
        push(t.sprintDone, 'success', 6000);
        setSprint(null);
      } else {
        tick(x => x + 1);
      }
    }, 1000);
    return () => clearInterval(id);
  }, [sprint, push, t.sprintDone]);

  const start = (minutes, goal) => {
    const now = Date.now();
    setSprint({
      startedAt: now,
      endsAt: now + minutes * 60000,
      duration: minutes,
      goal: goal || 0,
      baselineWords: totalWordsOfState(state),
    });
  };
  const stop = () => setSprint(null);

  if(!sprint) return { active: false, start, stop };
  const now = Date.now();
  const remainingMs = Math.max(0, sprint.endsAt - now);
  const totalMs = sprint.endsAt - sprint.startedAt;
  const percent = totalMs > 0 ? Math.max(0, Math.min(100, 100 - (remainingMs / totalMs) * 100)) : 100;
  const currentWords = totalWordsOfState(state);
  const wordsInSprint = Math.max(0, currentWords - sprint.baselineWords);
  const min = Math.floor(remainingMs / 60000);
  const sec = Math.floor((remainingMs % 60000) / 1000);
  const remainingStr = `${min}:${String(sec).padStart(2,'0')}`;
  return { active: true, remaining: remainingStr, percent, wordsInSprint, goal: sprint.goal, start, stop };
}

// Keyboard shortcut hook — uses a ref so the effect only attaches once per mount,
// while still seeing the latest handlers via the ref (avoids stale closure).
function useKeyboard(handlers){
  const handlersRef = useRef(handlers);
  useEffect(() => { handlersRef.current = handlers; });
  useEffect(() => {
    const h = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      const key = e.key.toLowerCase();
      const combo = `${mod?'mod+':''}${e.shiftKey?'shift+':''}${e.altKey?'alt+':''}${key}`;
      const fn = handlersRef.current[combo];
      if(fn){
        const target = e.target;
        const tag = target?.tagName;
        const inEditable = target?.isContentEditable || tag==='INPUT' || tag==='TEXTAREA';
        // Allow Esc, Cmd+K, Cmd+S, etc. even while typing
        const globalOk = ['mod+k','escape','mod+s','mod+n','mod+shift+n','mod+f','mod+shift+f'].includes(combo);
        if(inEditable && !globalOk) return;
        e.preventDefault();
        fn(e);
      }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []); // empty deps — handler ref is always current
}

// Toasts
let _toastId = 0;
function ToastProvider({children}){
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, kind='info', ttl=2600) => {
    const id = ++_toastId;
    setToasts(ts => [...ts, {id, msg, kind}]);
    if(ttl > 0) setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), ttl);
  }, []);
  const close = (id) => setToasts(ts => ts.filter(t => t.id !== id));

  // Listen for global storage warnings from saveState
  useEffect(() => {
    const onWarn = () => push('⚠ Storage is getting full. Please export a backup from Settings.', 'error', 8000);
    const onErr = () => push('❌ Failed to save! Please export a backup immediately.', 'error', 12000);
    window.addEventListener('riwailist:storage-warning', onWarn);
    window.addEventListener('riwailist:storage-error', onErr);
    return () => {
      window.removeEventListener('riwailist:storage-warning', onWarn);
      window.removeEventListener('riwailist:storage-error', onErr);
    };
  }, [push]);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-stack">
        {toasts.map(t => (
          <div key={t.id} className={`toast ${t.kind}`}>
            <div className="toast-icon">
              {t.kind==='success' ? <Icon.Check/> : t.kind==='error' ? <Icon.Warning/> : <Icon.Info/>}
            </div>
            <div className="toast-body">{t.msg}</div>
            <button className="toast-close" onClick={() => close(t.id)} aria-label="Close"><Icon.X/></button>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => useContext(ToastCtx);

/* ▎ Primitives ─────────────────────────────────────────────────────────── */
// Modal
function Modal({open, onClose, children, wide}){
  useEffect(() => {
    if(!open) return;
    const h = e => { if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [open, onClose]);
  if(!open) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className={`modal${wide?' wide':''}`} onClick={e=>e.stopPropagation()}>{children}</div>
    </div>
  );
}

// Confirm dialog (imperative-ish via state)
function Confirm({open, onClose, onConfirm, title, body, confirmLabel, danger, t}){
  if(!open) return null;
  return (
    <Modal open={open} onClose={onClose}>
      <div className="modal-head">
        <div className="modal-title">{title}</div>
        {body && <div className="modal-sub">{body}</div>}
      </div>
      <div className="modal-foot">
        <button className="btn btn-ghost" onClick={onClose}>{t.cancel}</button>
        <button className={`btn ${danger?'btn-danger':'btn-primary'}`} onClick={()=>{onConfirm();onClose();}}>{confirmLabel||t.confirm}</button>
      </div>
    </Modal>
  );
}

// Prompt dialog — asks for text input (supports number input via `type`)
function PromptDialog({open, onClose, onSubmit, title, body, placeholder, defaultValue='', inputType='text', t, lang}){
  const [val, setVal] = useState(defaultValue);
  const ref = useRef(null);
  useEffect(() => { if(open){ setVal(defaultValue); setTimeout(()=>ref.current?.focus(), 50); } }, [open, defaultValue]);
  if(!open) return null;
  const submit = () => {
    if(inputType === 'number'){
      const n = parseInt(val,10);
      if(!isNaN(n) && n>=0){ onSubmit(n); onClose(); return; }
      // empty or 0 is valid for goal
      if(val === '' || val === '0'){ onSubmit(0); onClose(); return; }
    } else {
      if(String(val).trim()) { onSubmit(String(val).trim()); onClose(); return; }
    }
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose}>
      <div className="modal-head">
        <div className="modal-title">{title}</div>
        {body && <div className="modal-sub">{body}</div>}
      </div>
      <div className="modal-body">
        <input ref={ref} className="fi-inp" value={val} placeholder={placeholder}
          type={inputType==='number'?'number':'text'}
          onChange={e=>setVal(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter') submit(); if(e.key==='Escape') onClose(); }}
          dir={lang==='ar'?'rtl':'ltr'}/>
      </div>
      <div className="modal-foot">
        <button className="btn btn-ghost" onClick={onClose}>{t.cancel}</button>
        <button className="btn btn-primary" onClick={submit}>{t.confirm}</button>
      </div>
    </Modal>
  );
}

/* ▎ DialogProvider — imperative confirm/prompt replacements for window.confirm/prompt.
   Usage:
     const dialogs = useDialogs();
     dialogs.confirm({title, body, danger}).then(ok => {...});
     dialogs.prompt({title, defaultValue, inputType:'number'}).then(val => {...});
   The returned promises resolve to the user's answer, or null for prompt cancel /
   false for confirm cancel. Never call these inside render — always inside handlers. */
const DialogCtx = createContext(null);
function DialogProvider({children, t, lang}){
  const [confirmState, setConfirmState] = useState(null);
  const [promptState, setPromptState] = useState(null);

  const api = useMemo(() => ({
    confirm: (opts) => new Promise((resolve) => {
      setConfirmState({
        ...opts,
        resolve,
      });
    }),
    prompt: (opts) => new Promise((resolve) => {
      setPromptState({
        ...opts,
        resolve,
      });
    }),
  }), []);

  const closeConfirm = (answer) => {
    if(confirmState) confirmState.resolve(answer);
    setConfirmState(null);
  };
  const closePrompt = (value) => {
    if(promptState) promptState.resolve(value);
    setPromptState(null);
  };

  return (
    <DialogCtx.Provider value={api}>
      {children}
      <Confirm
        open={!!confirmState}
        onClose={()=>closeConfirm(false)}
        onConfirm={()=>closeConfirm(true)}
        title={confirmState?.title || ''}
        body={confirmState?.body}
        confirmLabel={confirmState?.confirmLabel}
        danger={confirmState?.danger}
        t={t}/>
      <PromptDialog
        open={!!promptState}
        onClose={()=>closePrompt(null)}
        onSubmit={(v)=>closePrompt(v)}
        title={promptState?.title || ''}
        body={promptState?.body}
        placeholder={promptState?.placeholder}
        defaultValue={promptState?.defaultValue||''}
        inputType={promptState?.inputType||'text'}
        t={t} lang={lang}/>
    </DialogCtx.Provider>
  );
}
const useDialogs = () => useContext(DialogCtx);


/* ▎ Rich Editor ──────────────────────────────────────────────────────────
   Bug-fixed: only writes innerHTML when the *id* changes (switching docs),
   NOT on every state update — preserves cursor & selection while typing. */
function RichEditor({id, html, onChange, dir='ltr', placeholder='', className='prose-ed', spellcheck=true, onFocus}){
  const ref = useRef(null);
  const lastIdRef = useRef(null);
  useEffect(() => {
    if(!ref.current) return;
    if(lastIdRef.current !== id){
      ref.current.innerHTML = html || '';
      lastIdRef.current = id;
    }
  }, [id]);
  // Handle external html reset (e.g. import) only if id didn't change but html differs and editor is blurred.
  useEffect(() => {
    const el = ref.current;
    if(!el) return;
    if(lastIdRef.current === id && document.activeElement !== el && el.innerHTML !== (html||'')){
      el.innerHTML = html || '';
    }
  }, [html, id]);
  const onInput = () => { if(ref.current && onChange) onChange(ref.current.innerHTML); };
  const onKeyDown = (e) => {
    if(e.key === 'Tab'){
      e.preventDefault();
      // insertHTML is deprecated but remains the most reliable way to insert
      // a tab-equivalent character inside contenteditable across all browsers.
      try {
        const inserted = document.execCommand('insertHTML', false, '\u2003');
        if(!inserted) throw new Error('execCommand failed');
      } catch {
        // Fallback: insert via Selection API
        const sel = window.getSelection();
        if(sel && sel.rangeCount){
          const range = sel.getRangeAt(0);
          range.deleteContents();
          const node = document.createTextNode('\u2003');
          range.insertNode(node);
          range.setStartAfter(node);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
          if(ref.current && onChange) onChange(ref.current.innerHTML);
        }
      }
    }
  };
  return (
    <div ref={ref} className={className} contentEditable suppressContentEditableWarning
      dir={dir} data-ph={placeholder} onInput={onInput} onKeyDown={onKeyDown}
      onFocus={onFocus} spellCheck={spellcheck} />
  );
}

/* Toolbar — exec-command based. onMouseDown preventDefault to keep selection. */
function Toolbar({chapter, onChapterPatch, tweaks, setTweaks,
  focusMode, setFocusMode, saveStatus, t, lang, onManualSave}){
  // execCommand is deprecated but remains the only cross-browser way to apply
  // rich-text formatting to a contenteditable region without reimplementing
  // the full selection / range manipulation from scratch.
  const exec = (cmd, val=null) => {
    try { document.execCommand(cmd, false, val); } catch(e){ console.warn('execCommand failed:', cmd, e); }
  };
  const stop = (e) => e.preventDefault();
  const setDir = (d) => { onChapterPatch({dir: d}); };
  const nudge = (key, delta, min, max) => {
    setTweaks({[key]: Math.max(min, Math.min(max, tweaks[key] + delta))});
  };
  return (
    <div className="toolbar" onMouseDown={stop}>
      <div className="tb-group">
        <button className="tb-btn" title={t.bold}      onClick={()=>exec('bold')}><Icon.Bold/></button>
        <button className="tb-btn" title={t.italic}    onClick={()=>exec('italic')}><Icon.Italic/></button>
        <button className="tb-btn" title={t.underline} onClick={()=>exec('underline')}><Icon.Underline/></button>
      </div>
      <div className="tb-sep"/>
      <div className="tb-group">
        <button className="tb-btn" title={t.unordered} onClick={()=>exec('insertUnorderedList')}><Icon.ListUL/></button>
        <button className="tb-btn" title={t.ordered}   onClick={()=>exec('insertOrderedList')}><Icon.ListOL/></button>
        <button className="tb-btn" title={t.insertHr}  onClick={()=>exec('insertHorizontalRule')}><Icon.Minus/></button>
      </div>
      <div className="tb-sep"/>
      <div className="tb-group">
        <button className="tb-btn" title={t.alignLeft}   onClick={()=>exec('justifyLeft')}><Icon.AlignL/></button>
        <button className="tb-btn" title={t.alignCenter} onClick={()=>exec('justifyCenter')}><Icon.AlignC/></button>
        <button className="tb-btn" title={t.alignRight}  onClick={()=>exec('justifyRight')}><Icon.AlignR/></button>
      </div>
      <div className="tb-sep"/>
      <div className="tb-group">
        <button className={`tb-btn ${chapter?.dir==='ltr'?'on':''}`} title={t.dirLtr} onClick={()=>setDir('ltr')}>LTR</button>
        <button className={`tb-btn ${chapter?.dir==='rtl'?'on':''}`} title={t.dirRtl} onClick={()=>setDir('rtl')}>RTL</button>
      </div>
      <div className="tb-sep"/>
      <div className="tb-group">
        <button className="tb-btn" title={t.undo} onClick={()=>exec('undo')}><Icon.Undo/></button>
        <button className="tb-btn" title={t.redo} onClick={()=>exec('redo')}><Icon.Redo/></button>
      </div>
      <div className="tb-sep"/>
      <button className={`tb-btn ${focusMode?'on':''}`} title={t.focusMode} onClick={()=>setFocusMode(!focusMode)}><Icon.Expand/></button>
      <div className="tb-space"/>
      <div className="tb-group" title={t.fontSize}>
        <button className="tb-step" onClick={()=>nudge('fontSize',-1,12,28)}>A−</button>
        <span className="tb-num">{tweaks.fontSize}</span>
        <button className="tb-step" onClick={()=>nudge('fontSize',+1,12,28)}>A+</button>
      </div>
      <div className="tb-sep"/>
      <div className="tb-group" title={t.lineHeight}>
        <button className="tb-step" onClick={()=>nudge('lineHeight',-0.1,1.2,2.4)}>↕−</button>
        <span className="tb-num">{tweaks.lineHeight.toFixed(1)}</span>
        <button className="tb-step" onClick={()=>nudge('lineHeight',+0.1,1.2,2.4)}>↕+</button>
      </div>
      <div className="tb-sep"/>
      <div className="tb-group" title={t.theme}>
        {THEMES.map(th => (
          <button key={th} className={`tb-theme-dot ${tweaks.theme===th?'on':''}`}
            onClick={()=>setTweaks({theme:th})}
            style={{background: THEME_DOT_COLORS[th] || '#1a1a1f'}}/>
        ))}
      </div>
      <div className="tb-sep"/>
      <div className="save-ind" title={saveStatus==='saving'?t.saving:t.saved} onClick={onManualSave}>
        <span className={`save-dot ${saveStatus}`}/>
        <span>{saveStatus==='saving'?t.saving:t.saved}</span>
      </div>
    </div>
  );
}

/* ▎ Chapter List with drag-drop reorder & inline rename */
function ChapterList({project, selectedId, onSelect, onAdd, onDelete, onRename, onReorder, onDuplicate, t, lang, search, dispatch, push}){
  const [editingId, setEditingId] = useState(null);
  const [editVal, setEditVal] = useState('');
  const [dragId, setDragId] = useState(null);
  const [overId, setOverId] = useState(null);

  const chapters = useMemo(() => {
    const q = (search||'').trim().toLowerCase();
    if(!q) return project.chapters;
    return project.chapters.filter(c =>
      (c.title||'').toLowerCase().includes(q) ||
      htmlToText(c.content||'').toLowerCase().includes(q)
    );
  }, [project.chapters, search]);

  const startRename = (ch) => { setEditingId(ch.id); setEditVal(ch.title||''); };
  const commitRename = () => {
    if(editingId && editVal.trim()) onRename(editingId, editVal.trim());
    setEditingId(null); setEditVal('');
  };

  const onDragStart = (id, e) => { setDragId(id); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain', id);}catch{} };
  const onDragOver = (id, e) => { e.preventDefault(); setOverId(id); };
  const onDrop = (targetId, e) => {
    e.preventDefault();
    if(!dragId || dragId===targetId) return;
    const arr = [...project.chapters];
    const srcIdx = arr.findIndex(c=>c.id===dragId);
    const tgtIdx = arr.findIndex(c=>c.id===targetId);
    if(srcIdx<0 || tgtIdx<0) return;
    const [moved] = arr.splice(srcIdx,1);
    arr.splice(tgtIdx,0,moved);
    onReorder(arr);
    setDragId(null); setOverId(null);
  };

  if(chapters.length===0){
    return <div className="sb-list empty-center"><div className="sb-empty">{search?t.noResults:t.noChapters}</div></div>;
  }

  return (
    <div className="sb-list">
      {chapters.map((ch, i) => {
        const isActive = ch.id===selectedId;
        const isEditing = ch.id===editingId;
        const origIdx = project.chapters.findIndex(c=>c.id===ch.id);
        return (
          <div key={ch.id}
            className={`li ${isActive?'active':''} ${dragId===ch.id?'dragging':''} ${overId===ch.id?'drag-over':''}`}
            draggable={!isEditing}
            onDragStart={e=>onDragStart(ch.id, e)}
            onDragOver={e=>onDragOver(ch.id, e)}
            onDrop={e=>onDrop(ch.id, e)}
            onDragEnd={()=>{setDragId(null);setOverId(null);}}
            onClick={()=>!isEditing && onSelect(ch.id)}
            onDoubleClick={()=>startRename(ch)}>
            <div className="li-grip"><Icon.Grip/></div>
            <div className="li-num">{origIdx+1}</div>
            <div className="li-main">
              {isEditing ? (
                <input autoFocus className="li-edit" value={editVal}
                  onChange={e=>setEditVal(e.target.value)}
                  onBlur={commitRename}
                  onKeyDown={e=>{ if(e.key==='Enter') commitRename(); if(e.key==='Escape'){setEditingId(null);} }}
                  onClick={e=>e.stopPropagation()}/>
              ) : (
                <>
                  <div className="li-name">{ch.title || t.chapter + ' ' + (origIdx+1)}</div>
                  <div className="li-sub">{ch.wc||0} {t.words}{ch.goal>0?` · ${Math.min(100,Math.round((ch.wc/ch.goal)*100))}%`:''}</div>
                  {ch.goal>0 && (
                    <div className="li-progress">
                      <div className={`li-progress-bar ${ch.wc>=ch.goal?'done':''}`}
                        style={{width:Math.min(100,Math.round((ch.wc/(ch.goal||1))*100))+'%'}}/>
                    </div>
                  )}
                </>
              )}
            </div>
            {!isEditing && (<>
              <div className={`li-status-dot ${ch.status||'draft'}`}
                title={(CH_STATUS_LABELS[lang]||CH_STATUS_LABELS.en)[ch.status||'draft']}
                onClick={e=>{ e.stopPropagation(); dispatch({type:'UPDATE_CHAPTER',id:ch.id,patch:{status:nextStatus(ch.status||'draft')}}); }}
                style={{cursor:'pointer'}}/>
              <button className="li-del" title={t.delete} onClick={e=>{
                e.stopPropagation(); onDelete(ch.id);
              }}><Icon.Trash/></button>
            </>)}
          </div>
        );
      })}
    </div>
  );
}
