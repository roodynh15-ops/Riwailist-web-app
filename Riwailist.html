        <div className="set-group">
          <div className="set-group-title">{t.editorSettings}</div>
          <div className="set-row">
            <div className="set-row-label">
              <div className="set-row-title">{t.spellcheck}</div>
            </div>
            <div className="set-row-control">
              <button className={`seg-btn ${tweaks.spellcheck?'on':''}`} onClick={()=>set({spellcheck:!tweaks.spellcheck})}>
                {tweaks.spellcheck?'ON':'OFF'}
              </button>
            </div>
          </div>
          <div className="set-row">
            <div className="set-row-label"><div className="set-row-title">{t.langSetting}</div></div>
            <div className="set-row-control">
              <div className="seg">
                <button className={`seg-btn ${lang==='en'?'on':''}`} onClick={()=>dispatch({type:'SET_LANG',lang:'en'})}>English</button>
                <button className={`seg-btn ${lang==='ar'?'on':''}`} onClick={()=>dispatch({type:'SET_LANG',lang:'ar'})}>العربية</button>
              </div>
            </div>
          </div>
        </div>

        <div className="set-group">
          <div className="set-group-title">{t.dataSettings}</div>
          <div className="set-row">
            <div className="set-row-label">
              <div className="set-row-title">{t.exportProj}</div>
              <div className="set-row-sub">{t.exportProjDesc}</div>
            </div>
            <div className="set-row-control">
              <button className="btn" onClick={exportProj}><Icon.Download/>JSON</button>
            </div>
          </div>
          <div className="set-row">
            <div className="set-row-label">
              <div className="set-row-title">{t.exportText}</div>
              <div className="set-row-sub">{t.exportTextDesc}</div>
            </div>
            <div className="set-row-control">
              <button className="btn" onClick={()=>setExportType('md')}>MD</button>
              <button className="btn" onClick={()=>setExportType('html')}>HTML</button>
              <button className="btn" onClick={()=>setExportType('txt')}>TXT</button>
            </div>
          </div>
          <div className="set-row">
            <div className="set-row-label">
              <div className="set-row-title">{t.importProj}</div>
              <div className="set-row-sub">{t.importProjDesc}</div>
            </div>
            <div className="set-row-control">
              <button className="btn" onClick={()=>fileRef.current?.click()}><Icon.Upload/>{t.import2}</button>
              <input ref={fileRef} type="file" accept=".json" style={{display:'none'}}
                onChange={e=>{importProj(e.target.files?.[0]); e.target.value='';}}/>
            </div>
          </div>
          <div className="set-row">
            <div className="set-row-label">
              <div className="set-row-title" style={{color:'var(--err)'}}>{t.resetProj}</div>
              <div className="set-row-sub">{t.resetProjDesc}</div>
            </div>
            <div className="set-row-control">
              <button className="btn btn-danger" onClick={()=>setConfirmReset(true)}><Icon.Trash/>{t.delete}</button>
            </div>
          </div>
        </div>

        <div className="set-group">
          <div className="set-group-title">{t.snapshots}</div>
          <div className="set-row" style={{alignItems:'flex-start'}}>
            <div className="set-row-label">
              <div className="set-row-title">{t.snapshots}</div>
              <div className="set-row-sub">{t.snapshotsDesc}</div>
            </div>
            <div className="set-row-control">
              <button className="btn" onClick={manualSnapshot}><Icon.Plus/>{t.snapshotManual}</button>
            </div>
          </div>
          {snapshots.length === 0 ? (
            <div className="snap-empty">{t.snapshotsEmpty}</div>
          ) : (
            <div className="snap-list">
              {snapshots.map((s, i) => {
                // Snapshots are sorted newest-first. Number them so the OLDEST
                // is #1 and newest is #N — feels natural ("my 3rd snapshot").
                const number = snapshots.length - i;
                const d = new Date(s.ts);
                const dateStr = d.toLocaleDateString(lang==='ar'?'ar':'en-GB', {year:'numeric', month:'short', day:'numeric'});
                const timeStr = d.toLocaleTimeString(lang==='ar'?'ar':'en-GB', {hour:'2-digit', minute:'2-digit'});
                const when = fmtRelative(s.ts, lang);
                const reasonTag = s.reason === 'manual' ? ' · ' + t.snapshotManual
                                : s.reason === 'pre-restore' ? ' · ⟲'
                                : '';
                return (
                  <div key={s.id} className="snap-row">
                    <div className="snap-ic" style={{fontSize:12,fontWeight:700}}>#{number}</div>
                    <div className="snap-body">
                      <div className="snap-title">
                        {dateStr} · {timeStr}
                        <span style={{color:'var(--txm)',fontWeight:400,marginInlineStart:8}}>({when})</span>
                        {reasonTag && <span style={{color:'var(--ac)',fontSize:10,marginInlineStart:6}}>{reasonTag}</span>}
                      </div>
                      <div className="snap-meta">{s.wordsTotal.toLocaleString()} {t.snapWords}</div>
                    </div>
                    <div className="snap-acts">
                      <button className="snap-btn" onClick={()=>handleRestoreSnap(s.id)}>{t.snapshotRestore}</button>
                      <button className="snap-btn danger" onClick={()=>handleDelSnap(s.id)}>{t.snapshotDel}</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      <Confirm open={confirmReset} onClose={()=>setConfirmReset(false)}
        onConfirm={()=>{ dispatch({type:'RESET_ALL'}); try{localStorage.removeItem(STORAGE_KEY);}catch{} push('Reset', 'info'); }}
        title={t.resetProj} body={t.confirmReset} confirmLabel={t.delete} danger t={t}/>
    </div>
  );
}

/* ▎ Command Palette */
function CommandPalette({open, onClose, state, dispatch, push, setSection, setSelChapterId, setSelCharId, setSelLocId, setSelEventId, setFocusMode, t, lang}){
  const [q, setQ] = useState('');
  const [idx, setIdx] = useState(0);
  const ref = useRef(null);
  useEffect(() => { if(open){ setQ(''); setIdx(0); setTimeout(()=>ref.current?.focus(), 40); } }, [open]);

  const proj = state.projects.find(p=>p.id===state.activeProjectId);
  const items = useMemo(() => {
    const list = [];
    // Navigation actions
    if(proj){
      list.push({g:t.cmdGroupNav, key:'nav-writing', title:t.navWriting, icon:'Pen', run:()=>{setSection('writing'); onClose();}});
      list.push({g:t.cmdGroupNav, key:'nav-cast', title:t.navCast, icon:'Users', run:()=>{setSection('cast'); onClose();}});
      list.push({g:t.cmdGroupNav, key:'nav-places', title:t.navPlaces, icon:'MapPin', run:()=>{setSection('places'); onClose();}});
      list.push({g:t.cmdGroupNav, key:'nav-timeline', title:t.navTimeline, icon:'Clock', run:()=>{setSection('timeline'); onClose();}});
      list.push({g:t.cmdGroupNav, key:'nav-blueprint', title:t.navBlueprint, icon:'Map', run:()=>{setSection('blueprint'); onClose();}});
      list.push({g:t.cmdGroupNav, key:'nav-notes', title:t.navNotes, icon:'FileText', run:()=>{setSection('notes'); onClose();}});
      list.push({g:t.cmdGroupNav, key:'nav-stats', title:t.navStats, icon:'BarChart', run:()=>{setSection('stats'); onClose();}});
      list.push({g:t.cmdGroupNav, key:'nav-settings', title:t.navSettings, icon:'Settings', run:()=>{setSection('settings'); onClose();}});
      // Actions
      list.push({g:t.cmdGroupAction, key:'act-new-ch', title:t.newChapter, icon:'Plus', kbd:'⌘N', run:()=>{
        const ch = makeChapter(proj.chapters.length+1, state.lang);
        dispatch({type:'ADD_CHAPTER', chapter: ch});
        setSelChapterId(ch.id); setSection('writing');
        push(t.toastChCreated,'success'); onClose();
      }});
      list.push({g:t.cmdGroupAction, key:'act-focus', title:t.focusMode, icon:'Expand', run:()=>{setFocusMode(true); onClose();}});
      list.push({g:t.cmdGroupAction, key:'act-home', title:t.backHome, icon:'Home', run:()=>{dispatch({type:'SET_VIEW',view:'home'}); onClose();}});
      // Entities
      (proj.chapters||[]).forEach(ch => list.push({g:t.chapters, key:'ch-'+ch.id, title:ch.title||t.chapter, sub:(ch.wc||0)+' '+t.words, icon:'Pen', run:()=>{setSection('writing'); setSelChapterId(ch.id); onClose();}}));
      (proj.characters||[]).forEach(c => list.push({g:t.characters, key:'c-'+c.id, title:c.name, sub:c.role, icon:'Users', run:()=>{setSection('cast'); setSelCharId(c.id); onClose();}}));
      (proj.locations||[]).forEach(l => list.push({g:t.locations, key:'l-'+l.id, title:l.name, sub:l.type, icon:'MapPin', run:()=>{setSection('places'); setSelLocId(l.id); onClose();}}));
      (proj.events||[]).forEach(ev => list.push({g:t.timeline, key:'e-'+ev.id, title:ev.title, sub:ev.date||'', icon:'Clock', run:()=>{setSection('timeline'); setSelEventId(ev.id); onClose();}}));
    }
    // Projects always listed
    state.projects.forEach(p => list.push({g:t.cmdGroupProj, key:'p-'+p.id, title:p.name, sub:p.emoji, icon:'Book', run:()=>{dispatch({type:'OPEN_PROJECT', id:p.id}); onClose();}}));
    return list;
  }, [proj, state.projects, state.lang, t]);

  const filtered = useMemo(() => {
    const query = q.trim().toLowerCase();
    if(!query) return items;
    return items.filter(it => (it.title||'').toLowerCase().includes(query) || (it.sub||'').toLowerCase().includes(query));
  }, [items, q]);

  useEffect(() => { setIdx(0); }, [q]);

  const onKey = (e) => {
    if(e.key==='ArrowDown'){ e.preventDefault(); setIdx(i => Math.min(filtered.length-1, i+1)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); setIdx(i => Math.max(0, i-1)); }
    else if(e.key==='Enter'){ e.preventDefault(); const it = filtered[idx]; if(it) it.run(); }
    else if(e.key==='Escape'){ e.preventDefault(); onClose(); }
  };

  if(!open) return null;

  // Group filtered by g
  const groups = [];
  let current = null;
  filtered.forEach((it, i) => {
    if(!current || current.g!==it.g){ current = {g: it.g, items: []}; groups.push(current); }
    current.items.push({...it, _idx: i});
  });

  return (
    <div className="cmdp-overlay" onClick={onClose}>
      <div className="cmdp" onClick={e=>e.stopPropagation()}>
        <div className="cmdp-head">
          <Icon.Search/>
          <input ref={ref} className="cmdp-input" placeholder={t.cmdPlaceholder}
            value={q} onChange={e=>setQ(e.target.value)} onKeyDown={onKey} dir={lang==='ar'?'rtl':'ltr'}/>
          <kbd className="cmdp-kbd">ESC</kbd>
        </div>
        <div className="cmdp-list">
          {filtered.length===0 ? (
            <div className="cmdp-empty">{t.noResults}</div>
          ) : groups.map(grp => (
            <div key={grp.g}>
              <div className="cmdp-group-label">{grp.g}</div>
              {grp.items.map(it => {
                const Ic = Icon[it.icon] || Icon.Info;
                return (
                  <div key={it.key} className={`cmdp-item ${it._idx===idx?'on':''}`}
                    onMouseEnter={()=>setIdx(it._idx)} onClick={it.run}>
                    <Ic/>
                    <div className="cmdp-item-body">
                      <div className="cmdp-item-title">{it.title}</div>
                      {it.sub && <div className="cmdp-item-sub">{it.sub}</div>}
                    </div>
                    {it.kbd && <kbd className="cmdp-item-kbd">{it.kbd}</kbd>}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ▎ App Root ──────────────────────────────────────────────────────────── */
function App(){
  const [state, dispatch] = useReducer(reducer, undefined, initialState);
  const [authUser, setAuthUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [authMountKey, setAuthMountKey] = useState(0);
  const lang = state.lang;
  const t = LANG[lang] || LANG.en;

  // Listen for Supabase auth state changes (token refresh, signout from another tab, etc.)
  useEffect(() => {
    const sb = getSupabase();
    if(!sb) { setAuthReady(true); return; }
    const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => {
      if(session?.user) { setAuthUser(session.user); setAuthReady(true); }
      else { setAuthUser(null); setAuthReady(true); }
    });
    return () => subscription.unsubscribe();
  }, []);

  const setLang = (l) => dispatch({type:'SET_LANG', lang: l});

  // Not ready yet (checking session) → AuthGate handles its own loading spinner
  if(!authReady || !authUser) {
    return (
      <AuthGate
        key={authMountKey}
        lang={lang}
        setLang={setLang}
        onAuth={(user) => { setAuthUser(user); setAuthReady(true); }}
      />
    );
  }

  return (
    <DialogProvider t={t} lang={lang}>
      <AppInner state={state} dispatch={dispatch} authUser={authUser} onSignOut={()=>{ setAuthUser(null); setAuthMountKey(k=>k+1); }}/>
    </DialogProvider>
  );
}

function AppInner({state, dispatch, authUser, onSignOut}){
  const [section, setSection] = useState('writing');
  const [selChapterId, setSelChapterId] = useState(null);
  const [selCharId, setSelCharId] = useState(null);
  const [selLocId, setSelLocId] = useState(null);
  const [selEventId, setSelEventId] = useState(null);
  const [focusMode, setFocusMode] = useState(false);
  const [cmdOpen, setCmdOpen] = useState(false);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [findOpen, setFindOpen] = useState(false);

  const saveStatus = useAutoSave(state);
  const toastPush = useContext(ToastCtx) || (() => {});
  const dialogs = useDialogs();
  const session = useSession(state);
  const sprint = useSprint(state, toastPush, LANG[state.lang] || LANG.en);

  const activeProj = state.projects.find(p => p.id === state.activeProjectId);
  const lang = state.lang;
  const t = LANG[lang] || LANG.en;

  // Apply theme, font vars, dir to root once per change
  useEffect(() => {
    const root = document.documentElement;
    THEMES.forEach(th => root.classList.remove('theme-'+th));
    root.classList.add('theme-'+state.tweaks.theme);
    root.dir = lang==='ar' ? 'rtl' : 'ltr';
    root.lang = lang;
    root.style.setProperty('--fi', state.tweaks.fontSize + 'px');
    root.style.setProperty('--lh', String(state.tweaks.lineHeight));
    // Custom accent color
    const customAc = state.tweaks.customAccent;
    if(customAc && /^#[0-9a-f]{6}$/i.test(customAc)){
      root.style.setProperty('--ac', customAc);
      root.style.setProperty('--ac-h', customAc);
      root.style.setProperty('--ac-d', customAc + '24');
      root.style.setProperty('--ac-b', customAc + '52');
    } else {
      root.style.removeProperty('--ac');
      root.style.removeProperty('--ac-h');
      root.style.removeProperty('--ac-d');
      root.style.removeProperty('--ac-b');
    }
    document.body.classList.remove('ff-serif','ff-sans','ff-mono');
  }, [state.tweaks.theme, state.tweaks.fontSize, state.tweaks.lineHeight,
      state.tweaks.customAccent, lang]);

  // Initialize selections when project opens or changes
  useEffect(() => {
    if(!activeProj){ setSelChapterId(null); setSelCharId(null); setSelLocId(null); setSelEventId(null); return; }
    // Chapter sync only applies to novels (screenplays don't have chapters)
    if(activeProj.kind !== 'screenplay'){
      if(!selChapterId && activeProj.chapters[0]) setSelChapterId(activeProj.chapters[0].id);
      if(selChapterId && !activeProj.chapters.find(c=>c.id===selChapterId)) setSelChapterId(activeProj.chapters[0]?.id || null);
    } else {
      if(selChapterId) setSelChapterId(null);
    }
    // Character / Location / Event sync works for both kinds
    if(selCharId && !(activeProj.characters||[]).find(c=>c.id===selCharId)) setSelCharId(null);
    if(selLocId && !(activeProj.locations||[]).find(l=>l.id===selLocId)) setSelLocId(null);
    if(selEventId && !(activeProj.events||[]).find(e=>e.id===selEventId)) setSelEventId(null);
  }, [activeProj, selChapterId, selCharId, selLocId, selEventId]);

  // Keyboard shortcuts
  const kbHandlers = useMemo(() => ({
    'escape': () => {
      if(findOpen){ setFindOpen(false); return; }
      if(cmdOpen){ setCmdOpen(false); return; }
      if(focusMode){ setFocusMode(false); return; }
    },
    'mod+k': () => setCmdOpen(o => !o),
    'mod+f': () => { if(activeProj) setFindOpen(o => !o); },
    'mod+s': () => { toastPush(t.toastSaved, 'success'); },
    'mod+shift+f': () => setFocusMode(f => !f),
    'mod+n': () => {
      if(!activeProj || activeProj.kind === 'screenplay') return;
      const ch = makeChapter(activeProj.chapters.length+1, lang);
      dispatch({type:'ADD_CHAPTER', chapter: ch});
      setSelChapterId(ch.id); setSection('writing');
      toastPush(t.toastChCreated,'success');
    },
    'mod+shift+n': () => dispatch({type:'SET_VIEW', view:'home'}),
  }), [cmdOpen, focusMode, findOpen, activeProj, lang, t, toastPush, dispatch]);
  useKeyboard(kbHandlers);

  // Sprint pill — shown whenever a sprint is active, across all views
  const sprintPill = sprint.active ? (
    <div className="sprint-pill">
      <span className="sprint-pill-time">{sprint.remaining}</span>
      {sprint.goal > 0 && (
        <span style={{fontSize:12,color:'var(--tx2)'}}>
          {sprint.wordsInSprint}/{sprint.goal} {t.words}
        </span>
      )}
      <div className="sprint-pill-prog"><div className="sprint-pill-prog-bar" style={{width: sprint.percent+'%'}}/></div>
      <button className="sprint-pill-stop" onClick={sprint.stop} title={t.sprintStop} aria-label={t.sprintStop}><Icon.X/></button>
    </div>
  ) : null;

  // Home view
  if(state.view === 'home' || !activeProj){
    return (
      <>
        <HomeScreen state={state} dispatch={dispatch} push={toastPush} t={t} lang={lang} authUser={authUser} onSignOut={onSignOut}/>
        {sprintPill}
        <CommandPalette open={cmdOpen} onClose={()=>setCmdOpen(false)}
          state={state} dispatch={dispatch} push={toastPush}
          setSection={setSection} setSelChapterId={setSelChapterId}
          setSelCharId={setSelCharId} setSelLocId={setSelLocId} setSelEventId={setSelEventId}
          setFocusMode={setFocusMode} t={t} lang={lang}/>
      </>
    );
  }

  // Is this project a screenplay?
  const isScreenplay = activeProj.kind === 'screenplay';

  // Jump-to-line handler used by ScreenplaySidebar when user clicks a scene
  const onJumpToLine = (idx) => {
    setTimeout(() => {
      const el = document.querySelectorAll('.sp-line')[idx];
      if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 50);
  };

  // Resolve selection for active section — safe for both kinds
  const selChapter = (activeProj.chapters||[]).find(c=>c.id===selChapterId);
  const selChar = (activeProj.characters||[]).find(c=>c.id===selCharId);
  const selLoc = (activeProj.locations||[]).find(l=>l.id===selLocId);

  const emptyState = (title, sub, iconName='Pen') => {
    const Ic = Icon[iconName] || Icon.Pen;
    return (
      <div className="ed-empty">
        <div className="ed-empty-icon"><Ic/></div>
        <div className="ed-empty-title">{title}</div>
        <div className="ed-empty-sub">{sub}</div>
      </div>
    );
  };

  let main;
  if(section === 'writing'){
    if(isScreenplay){
      main = <ScreenplayEditor project={activeProj} dispatch={dispatch}
        t={t} lang={lang} tweaks={state.tweaks}
        focusMode={focusMode} setFocusMode={setFocusMode} push={toastPush}/>;
    } else {
      main = selChapter
        ? <ChapterView project={activeProj} chapter={selChapter} dispatch={dispatch}
            t={t} lang={lang} tweaks={state.tweaks}
            setTweaks={p=>dispatch({type:'SET_TWEAKS', tweaks:p})}
            push={toastPush} focusMode={focusMode} setFocusMode={setFocusMode}/>
        : emptyState(t.emptyWritingTitle, t.emptyWritingSub, 'Pen');
    }
  } else if(section === 'cast'){
    main = selChar
      ? <CharacterView project={activeProj} char={selChar} dispatch={dispatch} t={t} lang={lang}/>
      : emptyState(t.characters, t.selectChar, 'Users');
  } else if(section === 'places'){
    main = selLoc
      ? <LocationView project={activeProj} loc={selLoc} dispatch={dispatch} t={t} lang={lang}/>
      : emptyState(t.locations, t.selectLoc, 'MapPin');
  } else if(section === 'timeline'){
    main = <TimelineView project={activeProj} eventId={selEventId} setEventId={setSelEventId}
      dispatch={dispatch} t={t} lang={lang}/>;
  } else if(section === 'blueprint'){
    main = <BlueprintView project={activeProj} dispatch={dispatch} t={t} lang={lang}/>;
  } else if(section === 'read'){
    main = <ReadingView project={activeProj} t={t} lang={lang}/>;
  } else if(section === 'notes'){
    main = <NotesView project={activeProj} dispatch={dispatch} t={t} lang={lang}/>;
  } else if(section === 'stats'){
    main = <StatsView project={activeProj} dispatch={dispatch} t={t} lang={lang} session={session} sprint={sprint}/>;
  } else if(section === 'settings'){
    main = <SettingsView state={state} dispatch={dispatch} push={toastPush}
      t={t} lang={lang} activeProj={activeProj}/>;
  }

  return (
    <>
      <div className="app">
        <Sidebar project={activeProj} section={section} setSection={setSection}
          t={t} lang={lang} dispatch={dispatch} push={toastPush}
          selChapterId={selChapterId} setSelChapterId={setSelChapterId}
          selCharId={selCharId} setSelCharId={setSelCharId}
          selLocId={selLocId} setSelLocId={setSelLocId}
          selEventId={selEventId} setSelEventId={setSelEventId}
          onCollapse={()=>setSidebarCollapsed(true)}
          collapsed={sidebarCollapsed}
          onJumpToLine={onJumpToLine}
          />
        <div className="main">{main}</div>
      </div>
      {sidebarCollapsed && !focusMode && (
        <button className="sidebar-fab" onClick={()=>setSidebarCollapsed(false)} title={t.showSidebar}>
          {lang==='ar' ? <Icon.ArrowLeft/> : <Icon.ArrowRight/>}
        </button>
      )}
      <CommandPalette open={cmdOpen} onClose={()=>setCmdOpen(false)}
        state={state} dispatch={dispatch} push={toastPush}
        setSection={setSection} setSelChapterId={setSelChapterId}
        setSelCharId={setSelCharId} setSelLocId={setSelLocId} setSelEventId={setSelEventId}
        setFocusMode={setFocusMode} t={t} lang={lang}/>
      <FindReplace open={findOpen} onClose={()=>setFindOpen(false)}
        activeProj={activeProj} dispatch={dispatch} t={t} lang={lang} push={toastPush}/>
      {sprintPill}
    </>
  );
}

/* ▎ Find & Replace ──────────────────────────────────────────────────────
   Finds matches inside the currently visible editor (contenteditable `.prose-ed`
   for novels, or the array of screenplay `textarea` inputs). For novels uses
   window.find() as a fallback plus a manual DOM-walk highlighter. For
   screenplays, iterates through the textareas. */
function FindReplace({open, onClose, activeProj, dispatch, t, lang, push}){
  const [findStr, setFindStr] = useState('');
  const [replaceStr, setReplaceStr] = useState('');
  const [caseSensitive, setCaseSensitive] = useState(false);
  const [wholeWord, setWholeWord] = useState(false);
  const findInputRef = useRef(null);
  const isScreenplay = activeProj?.kind === 'screenplay';

  useEffect(() => {
    if(open) setTimeout(()=>findInputRef.current?.focus(), 40);
  }, [open]);

  const buildRegex = () => {
    if(!findStr) return null;
    const escaped = findStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const pattern = wholeWord ? `\\b${escaped}\\b` : escaped;
    try { return new RegExp(pattern, caseSensitive ? 'g' : 'gi'); }
    catch { return null; }
  };

  // Count matches for UX feedback — build a fresh regex per call to avoid lastIndex drift
  const matchCount = useMemo(() => {
    if(!activeProj || !findStr) return 0;
    const re = buildRegex();
    if(!re) return 0;
    let count = 0;
    if(isScreenplay){
      (activeProj.lines||[]).forEach(l => {
        const matches = (l.text||'').match(re);
        if(matches) count += matches.length;
      });
    } else {
      (activeProj.chapters||[]).forEach(c => {
        const text = htmlToText(c.content||'');
        const matches = text.match(re);
        if(matches) count += matches.length;
      });
    }
    return count;
  }, [findStr, caseSensitive, wholeWord, activeProj, isScreenplay]);

  const findNext = () => {
    if(!findStr) return;
    // Use the CSS Custom Highlight API if available (Chrome 105+, Firefox 119+)
    // otherwise fall back to window.find (deprecated but still works widely)
    try {
      if(window.find){
        window.find(findStr, caseSensitive, false, true /* wrap */, wholeWord, false, false);
      }
    } catch(e){}
  };

  const doReplaceAll = () => {
    if(!findStr || !activeProj) return;
    const re = buildRegex();
    if(!re) return;
    let total = 0;
    if(isScreenplay){
      const newLines = (activeProj.lines||[]).map(l => {
        const text = l.text || '';
        if(!re.test(text)) { re.lastIndex = 0; return l; }
        re.lastIndex = 0;
        const nt = text.replace(re, () => { total++; return replaceStr; });
        return {...l, text: nt};
      });
      if(total > 0) dispatch({type:'UPDATE_PROJECT', patch:{lines: newLines}});
    } else {
      const newChapters = (activeProj.chapters||[]).map(c => {
        // Replace inside text nodes of the HTML content while preserving tags.
        const html = c.content || '';
        if(!html) return c;
        const div = document.createElement('div');
        div.innerHTML = html;
        const walk = (node) => {
          if(node.nodeType === 3){ // text node
            const txt = node.nodeValue || '';
            re.lastIndex = 0;
            if(re.test(txt)){
              re.lastIndex = 0;
              const nt = txt.replace(re, () => { total++; return replaceStr; });
              node.nodeValue = nt;
            }
          } else if(node.nodeType === 1){
            [...node.childNodes].forEach(walk);
          }
        };
        [...div.childNodes].forEach(walk);
        const newContent = div.innerHTML;
        if(newContent === html) return c;
        const newWc = countWords(newContent);
        return {...c, content: newContent, wc: newWc};
      });
      if(total > 0){
        newChapters.forEach(ch => {
          dispatch({type:'UPDATE_CHAPTER', id: ch.id, patch: {content: ch.content, wc: ch.wc}});
        });
      }
    }
    const msg = total > 0
      ? (t.replacedCount||'Replaced {n}').replace('{n}', total)
      : (t.findNoMatches || 'No matches');
    push(msg, total > 0 ? 'success' : 'info');
  };

  if(!open) return null;

  return (
    <div className="fr-panel">
      <div className="fr-row">
        <div style={{flex:1,fontSize:12.5,fontWeight:600,color:'var(--tx)'}}>{t.findReplace}</div>
        <button className="fr-close" onClick={onClose}><Icon.X/></button>
      </div>
      <div className="fr-row">
        <input ref={findInputRef} className="fr-inp" placeholder={t.findText}
          value={findStr} onChange={e=>setFindStr(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter') findNext(); if(e.key==='Escape') onClose(); }}
          dir={lang==='ar'?'rtl':'ltr'}/>
        <button className="fr-btn" onClick={findNext} title={t.findNext}>↓</button>
      </div>
      <div className="fr-row">
        <input className="fr-inp" placeholder={t.replaceText}
          value={replaceStr} onChange={e=>setReplaceStr(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Escape') onClose(); }}
          dir={lang==='ar'?'rtl':'ltr'}/>
        <button className="fr-btn primary" onClick={doReplaceAll}>{t.replaceAll}</button>
      </div>
      <div className="fr-row">
        <label className={`fr-toggle ${caseSensitive?'on':''}`}>
          <input type="checkbox" checked={caseSensitive} onChange={e=>setCaseSensitive(e.target.checked)}/>
          <span>Aa</span>
        </label>
        <label className={`fr-toggle ${wholeWord?'on':''}`}>
          <input type="checkbox" checked={wholeWord} onChange={e=>setWholeWord(e.target.checked)}/>
          <span>W</span>
        </label>
        <span className="fr-info">
          {findStr ? (matchCount > 0 ? `${matchCount} ${matchCount===1?t.findMatch:t.findMatches}` : t.findNoMatches) : ''}
        </span>
      </div>
    </div>
  );
}

/* ▎ Error Boundary ──────────────────────────────────────────────────────
   Catches unhandled render errors and shows a friendly recovery screen
   with a link to reset / download a backup so the user never sees a
   blank-white "app crashed" state. */
class ErrorBoundary extends React.Component {
  constructor(props){
    super(props);
    this.state = { hasError: false, err: null };
  }
  static getDerivedStateFromError(err){
    return { hasError: true, err };
  }
  componentDidCatch(err, info){
    // Log so it appears in the console for diagnosis.
    console.error('App crashed:', err, info);
  }
  downloadBackup(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){ alert('No saved data to back up.'); return; }
      const blob = new Blob([raw], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement('a'), {
        href: url,
        download: `riwailist-emergency-backup-${new Date().toISOString().slice(0,10)}.json`,
        style: 'display:none',
      });
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1500);
    } catch(e){ alert('Backup failed: ' + e.message); }
  }
  resetApp(){
    if(!confirm('This will erase ALL data and restart the app. Continue?')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
    window.location.reload();
  }
  render(){
    if(this.state.hasError){
      const msg = this.state.err?.message || String(this.state.err||'Unknown error');
      return (
        <div style={{
          maxWidth:600, margin:'80px auto', padding:'32px',
          fontFamily:'system-ui,-apple-system,sans-serif',
          color:'#e0d8c8', background:'#1f2026',
          border:'1px solid #3a3a42', borderRadius:'12px', lineHeight:1.7
        }}>
          <h2 style={{fontFamily:'Georgia,serif',margin:'0 0 16px',color:'#c49a5a'}}>⚠ Something went wrong</h2>
          <p style={{margin:'0 0 12px'}}>The app encountered an unexpected error. Your work is still saved — the recovery options below are safe to use.</p>
          <pre style={{background:'#0f1014',padding:'12px',borderRadius:'6px',overflow:'auto',fontSize:'12px',color:'#b09a75',margin:'16px 0'}}>{msg}</pre>
          <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
            <button onClick={()=>window.location.reload()} style={{
              padding:'9px 16px',background:'#c49a5a',color:'#1a1a1f',border:'none',
              borderRadius:'8px',fontWeight:600,cursor:'pointer',fontSize:'13px'
            }}>Reload the app</button>
            <button onClick={()=>this.downloadBackup()} style={{
              padding:'9px 16px',background:'transparent',color:'#e0d8c8',
              border:'1px solid #3a3a42',borderRadius:'8px',cursor:'pointer',fontSize:'13px'
            }}>Download backup (JSON)</button>
            <button onClick={()=>this.resetApp()} style={{
              padding:'9px 16px',background:'transparent',color:'#b35c5c',
              border:'1px solid #5a3030',borderRadius:'8px',cursor:'pointer',fontSize:'13px'
            }}>Reset all data</button>
          </div>
          <p style={{margin:'20px 0 0',fontSize:'11px',color:'#8a8077'}}>Tip: download a backup first, then reload. If reload keeps failing, reset.</p>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ▎ Mount ────────────────────────────────────────────────────────────── */
const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(
  <ErrorBoundary>
    <ToastProvider>
      <App/>
    </ToastProvider>
  </ErrorBoundary>
);
</script></body></html>
