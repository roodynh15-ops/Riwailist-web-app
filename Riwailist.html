/* ═══════════════════════════════════════════════════════════════════════════
   SCREENPLAY MODE — professional American screenplay format
   ───────────────────────────────────────────────────────────────────────────
   Key concept: each line has a `type` (6 element types). The editor is a
   list of typed lines, NOT contenteditable HTML. This is the approach used
   by Fountain / Final Draft / Highland.
═══════════════════════════════════════════════════════════════════════════ */

const SP_ELEMENTS = ['scene', 'action', 'character', 'paren', 'dialogue', 'transition'];
const SP_NEXT = {
  scene: 'action',
  action: 'action',
  character: 'dialogue',
  paren: 'dialogue',
  dialogue: 'action',
  transition: 'scene',
};
const SP_TAB_CYCLE = {
  action: 'character',
  character: 'action',
  dialogue: 'paren',
  paren: 'dialogue',
  scene: 'action',
  transition: 'scene',
};
const SP_UPPER = new Set(['scene', 'character', 'transition']);

const makeSpLine = (type='action', text='') => ({
  id: uid('sl'),
  type,
  text: SP_UPPER.has(type) ? text.toUpperCase() : text,
});

const makeScreenplay = (name='Untitled Screenplay', emoji='🎬', lang='en') => ({
  id: uid('proj'),
  kind: 'screenplay',
  name, emoji,
  genre: '',
  createdAt: new Date().toISOString(),
  updatedAt: new Date().toISOString(),
  // Screenplay-specific data
  titlePage: { title: name, author: '', draftDate: '', contact: '' },
  lines: [
    makeSpLine('scene', ''),
  ],
  // Re-used structures for flexibility (characters, notes, etc.)
  characters: [],
  locations: [],
  events: [],
  notes: '',
  goal: { daily: 3, total: 110 }, // pages
  streak: { current: 0, longest: 0, lastDay: null, daily: {} },
  language: lang,
});

/* Screenplay — count pages (roughly 55 lines per page, Courier 12pt) */
const spPageCount = (lines) => Math.max(1, Math.ceil(lines.length / 55));

/* Screenplay — extract unique character names (in order of appearance) */
const spGetCharacterNames = (lines) => {
  const seen = new Set();
  const out = [];
  for(const l of lines){
    if(l.type === 'character' && l.text.trim()){
      // Strip parentheticals like (V.O.) or (CONT'D)
      const name = l.text.replace(/\s*\([^)]*\)\s*/g, '').trim().toUpperCase();
      if(name && !seen.has(name)){ seen.add(name); out.push(name); }
    }
  }
  return out;
};

/* Screenplay — extract unique locations from scene headings */
const spGetLocations = (lines) => {
  const seen = new Set();
  const out = [];
  for(const l of lines){
    if(l.type === 'scene' && l.text.trim()){
      // Format: "INT. COFFEE SHOP - DAY" → extract "COFFEE SHOP"
      const m = l.text.match(/^(INT\.?|EXT\.?|INT\.?\/EXT\.?|I\/E\.?)\s+(.+?)(?:\s+-\s+|\s+–\s+|$)/i);
      if(m && m[2]){
        const loc = m[2].trim().toUpperCase();
        if(loc && !seen.has(loc)){ seen.add(loc); out.push(loc); }
      }
    }
  }
  return out;
};

/* Screenplay — convert lines to plain-text (Fountain-ish) format for export.
   If the project has a titlePage with metadata, render it at the top. */
const spLinesToText = (lines, project) => {
  // Support both old call signature (title string) and new (project)
  const tp = (typeof project === 'object' && project) ? (project.titlePage || {title: project.name}) : {title: project};
  const WIDTH = 60;
  const pad = (s) => {
    const diff = Math.max(0, WIDTH - s.length);
    const left = Math.floor(diff/2);
    return ' '.repeat(left) + s + ' '.repeat(diff-left);
  };
  let out = '';
  // Title page block (if populated)
  if(tp && (tp.title || tp.author || tp.draftDate || tp.contact)){
    out += '\n\n\n\n\n';
    if(tp.title) out += pad(tp.title.toUpperCase()) + '\n\n\n';
    if(tp.author) out += pad('by') + '\n\n' + pad(tp.author) + '\n\n\n\n';
    if(tp.draftDate) out += pad(tp.draftDate) + '\n';
    if(tp.contact){
      out += '\n\n\n';
      tp.contact.split('\n').forEach(line => { out += pad(line) + '\n'; });
    }
    out += '\n\n\n\n═══════════════════════════════════════════════════════\n\n';
  }
  let prevType = null;
  for(const l of lines){
    const text = (l.text || '').trim();
    if(!text){ out += '\n'; continue; }
    const needsBlank = (
      (l.type === 'scene' && prevType !== null) ||
      (l.type === 'character' && prevType !== null && prevType !== 'character' && prevType !== 'paren') ||
      (l.type === 'transition')
    );
    if(needsBlank) out += '\n';
    if(l.type === 'scene') out += text.toUpperCase() + '\n';
    else if(l.type === 'action') out += text + '\n';
    else if(l.type === 'character') out += '                    ' + text.toUpperCase() + '\n';
    else if(l.type === 'paren') out += '              ' + (text.startsWith('(') ? text : '('+text+')') + '\n';
    else if(l.type === 'dialogue') out += '          ' + text + '\n';
    else if(l.type === 'transition') out += '                                        ' + text.toUpperCase() + '\n';
    prevType = l.type;
  }
  return out;
};

/* Screenplay line reducer cases */
const spUpdateLines = (proj, newLines) => ({ ...proj, lines: newLines });

/* ▎ Screenplay Line — memo'd to prevent re-rendering every line on each keystroke.
   Without this, a 50-page script (2750+ lines) becomes unusably slow because
   every single line would re-render every time any line changes. */
const SpLine = memo(function SpLine({line, idx, isActive, t, lang, spellcheck, onInputRef,
  onFocus, onChange, onKeyDown, suggestions, onPickSuggestion}){
  const textareaRef = useRef(null);
  const cls = `sp-line sp-${line.type} ${isActive?'active':''}`;

  // Auto-grow on mount and when text changes externally (snapshot restore, etc.)
  useEffect(() => {
    const el = textareaRef.current;
    if(!el) return;
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }, [line.text]);

  const setRef = useCallback((el) => {
    textareaRef.current = el;
    // Parent passes a callback that accepts the DOM element directly
    if(typeof onInputRef === 'function') onInputRef(el);
  }, [onInputRef]);

  return (
    <div className={cls}>
      <div className="sp-type-label">{t['sp_' + line.type] || line.type}</div>
      <textarea
        ref={setRef}
        className="sp-input"
        value={line.text}
        rows={1}
        spellCheck={spellcheck}
        dir={lang==='ar' ? 'rtl' : 'ltr'}
        onFocus={onFocus}
        onChange={e => {
          onChange(idx, e.target.value);
          // Auto-grow textarea
          e.target.style.height = 'auto';
          e.target.style.height = e.target.scrollHeight + 'px';
        }}
        onKeyDown={e => onKeyDown(idx, e)}
      />
      {isActive && suggestions && (
        <div className="sp-suggest">
          {suggestions.items.map((it, i) => (
            <div key={it} className={`sp-suggest-item ${i===suggestions.selected?'on':''}`}
              onMouseDown={e=>{e.preventDefault(); onPickSuggestion(idx, i);}}>
              {it}
            </div>
          ))}
          <div className="sp-suggest-hint">{t.spSuggestHint}</div>
        </div>
      )}
    </div>
  );
});

/* ▎ Screenplay Editor ─────────────────────────────────────────────────── */
function ScreenplayEditor({project, dispatch, t, lang, tweaks, focusMode, setFocusMode, push}){
  const lines = project.lines || [];
  // Selected line index & caret position are kept in refs for stability
  const [activeIdx, setActiveIdx] = useState(0);
  const [suggestions, setSuggestions] = useState(null); // { items, selected }
  const [saveStatus, setSaveStatus] = useState('saved');
  const [titlePageOpen, setTitlePageOpen] = useState(false);
  const inputRefs = useRef({});
  const wrapperRef = useRef(null);
  const saveTimerRef = useRef(null);

  // Characters & locations for autocomplete
  const knownCharacters = useMemo(() => spGetCharacterNames(lines), [lines]);
  const knownLocations = useMemo(() => spGetLocations(lines), [lines]);

  const pageCount = spPageCount(lines);

  const updateLines = (newLines) => {
    setSaveStatus('saving');
    if(saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(()=>setSaveStatus('saved'), 700);
    dispatch({ type: 'UPDATE_PROJECT', patch: { lines: newLines } });
  };
  useEffect(() => () => { if(saveTimerRef.current) clearTimeout(saveTimerRef.current); }, []);

  const patchLine = (idx, patch) => {
    const next = lines.map((l,i) => i===idx ? {...l, ...patch} : l);
    updateLines(next);
  };

  const setLineType = (idx, newType) => {
    const line = lines[idx];
    if(!line) return;
    let newText = line.text || '';
    if(SP_UPPER.has(newType)) newText = newText.toUpperCase();
    if(newType === 'paren' && newText.trim() && !newText.trim().startsWith('('))
      newText = '(' + newText.trim() + ')';
    patchLine(idx, { type: newType, text: newText });
  };

  const insertLineAfter = (idx, type='action', text='') => {
    const newLine = makeSpLine(type, text);
    const next = [...lines.slice(0,idx+1), newLine, ...lines.slice(idx+1)];
    updateLines(next);
    setTimeout(() => {
      setActiveIdx(idx + 1);
      inputRefs.current[newLine.id]?.focus();
    }, 10);
    return newLine;
  };

  const deleteLine = (idx) => {
    if(lines.length <= 1) return;
    const next = lines.filter((_,i)=>i!==idx);
    updateLines(next);
    setTimeout(() => {
      const newIdx = Math.max(0, idx - 1);
      setActiveIdx(newIdx);
      inputRefs.current[next[newIdx]?.id]?.focus();
    }, 10);
  };

  const onLineChange = (idx, rawText) => {
    const line = lines[idx];
    if(!line) return;
    let text = rawText;

    // Auto-uppercase for scene/character/transition
    if(SP_UPPER.has(line.type)) text = text.toUpperCase();

    // Auto-detect scene heading when user types INT. / EXT. at start of an action line
    if(line.type === 'action'){
      const upper = text.toUpperCase();
      if(/^(INT\.|EXT\.|INT\/EXT\.|I\/E\.)\s/.test(upper)){
        patchLine(idx, { type: 'scene', text: upper });
        return;
      }
    }

    patchLine(idx, { text });

    // Suggestions
    if(line.type === 'scene' && text.length >= 2){
      // Match typed against known locations
      const typed = text.toUpperCase();
      // Strip INT./EXT. prefix to match location part
      const locPart = typed.replace(/^(INT\.?|EXT\.?|INT\.?\/EXT\.?|I\/E\.?)\s*/, '');
      const matches = knownLocations.filter(loc => loc.startsWith(locPart) && locPart.length >= 1 && loc !== locPart);
      if(matches.length) setSuggestions({ items: matches.slice(0,5), selected: 0, kind: 'location', prefix: typed.replace(locPart, '') });
      else setSuggestions(null);
    } else if(line.type === 'character' && text.length >= 1){
      const typed = text.toUpperCase();
      const matches = knownCharacters.filter(c => c.startsWith(typed) && c !== typed);
      if(matches.length) setSuggestions({ items: matches.slice(0,5), selected: 0, kind: 'character' });
      else setSuggestions(null);
    } else {
      setSuggestions(null);
    }
  };

  const acceptSuggestion = (idx) => {
    if(!suggestions) return;
    const pick = suggestions.items[suggestions.selected];
    if(!pick) return;
    const line = lines[idx];
    let newText = pick;
    if(suggestions.kind === 'location') newText = (suggestions.prefix || 'INT. ') + pick;
    if(suggestions.kind === 'character') newText = pick;
    patchLine(idx, { text: newText });
    setSuggestions(null);
  };

  const onLineKeyDown = (idx, e) => {
    const line = lines[idx];
    if(!line) return;

    // Suggestion navigation
    if(suggestions){
      if(e.key === 'ArrowDown'){ e.preventDefault(); setSuggestions(s => ({...s, selected: Math.min(s.items.length-1, s.selected+1)})); return; }
      if(e.key === 'ArrowUp'){ e.preventDefault(); setSuggestions(s => ({...s, selected: Math.max(0, s.selected-1)})); return; }
      if(e.key === 'Tab' || (e.key === 'Enter' && e.shiftKey===false && suggestions)){
        e.preventDefault();
        acceptSuggestion(idx);
        return;
      }
      if(e.key === 'Escape'){ e.preventDefault(); setSuggestions(null); return; }
    }

    // Tab: cycle element type (only when line is empty OR at start)
    if(e.key === 'Tab'){
      e.preventDefault();
      const nextType = SP_TAB_CYCLE[line.type] || 'action';
      setLineType(idx, nextType);
      return;
    }

    // Enter: create next line with appropriate type
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      // If current line is empty and type is not action, convert to action
      if(!line.text.trim() && line.type !== 'action'){
        setLineType(idx, 'action');
        return;
      }
      const nextType = SP_NEXT[line.type] || 'action';
      insertLineAfter(idx, nextType);
      return;
    }

    // Backspace on empty line: delete and focus previous
    if(e.key === 'Backspace' && !line.text && idx > 0){
      e.preventDefault();
      deleteLine(idx);
      return;
    }

    // Arrow up/down: move between lines
    if(e.key === 'ArrowUp' && idx > 0){
      e.preventDefault();
      setActiveIdx(idx - 1);
      inputRefs.current[lines[idx-1].id]?.focus();
      return;
    }
    if(e.key === 'ArrowDown' && idx < lines.length - 1){
      e.preventDefault();
      setActiveIdx(idx + 1);
      inputRefs.current[lines[idx+1].id]?.focus();
      return;
    }
  };

  const onManualSave = () => { push(t.toastSaved, 'success'); setSaveStatus('saved'); };

  const body = (
    <>
      {/* Screenplay-specific toolbar */}
      <div className="toolbar" onMouseDown={e=>e.preventDefault()}>
        <div className="tb-group">
          <button className="tb-btn" title={t.spSceneHeading} onClick={()=>setLineType(activeIdx, 'scene')}>INT/EXT</button>
          <button className="tb-btn" title={t.spAction} onClick={()=>setLineType(activeIdx, 'action')}>{t.spAction}</button>
          <button className="tb-btn" title={t.spCharacter} onClick={()=>setLineType(activeIdx, 'character')}>{t.spCharacter}</button>
          <button className="tb-btn" title={t.spParen} onClick={()=>setLineType(activeIdx, 'paren')}>( )</button>
          <button className="tb-btn" title={t.spDialogue} onClick={()=>setLineType(activeIdx, 'dialogue')}>{t.spDialogue}</button>
          <button className="tb-btn" title={t.spTransition} onClick={()=>setLineType(activeIdx, 'transition')}>{t.spTransition}</button>
        </div>
        <div className="tb-sep"/>
        <button className="tb-btn" title={t.editTitlePage} onClick={()=>setTitlePageOpen(true)}>📄 {t.titlePage}</button>
        <div className="tb-sep"/>
        <button className={`tb-btn ${focusMode?'on':''}`} title={t.focusMode} onClick={()=>setFocusMode(!focusMode)}><Icon.Expand/></button>
        <div className="tb-space"/>
        <span className="ch-chip"><Icon.FileText/> {t.spPages}: {pageCount}</span>
        <div className="tb-sep"/>
        <span className="ch-chip"><Icon.Users/> {knownCharacters.length}</span>
        <div className="tb-sep"/>
        <div className="save-ind" onClick={onManualSave}>
          <span className={`save-dot ${saveStatus}`}/>
          <span>{saveStatus==='saving'?t.saving:t.saved}</span>
        </div>
      </div>

      <div className="ed-body">
        <div className="ed-scroll">
          <div className="sp-page" ref={wrapperRef}>
            {lines.map((line, idx) => (
              <SpLine key={line.id}
                line={line} idx={idx}
                isActive={idx === activeIdx}
                t={t} lang={lang} spellcheck={tweaks.spellcheck}
                onInputRef={el => { if(el) inputRefs.current[line.id] = el; }}
                onFocus={() => setActiveIdx(idx)}
                onChange={onLineChange}
                onKeyDown={onLineKeyDown}
                suggestions={idx === activeIdx ? suggestions : null}
                onPickSuggestion={(i, si) => { setSuggestions(s => s ? {...s, selected: si} : s); acceptSuggestion(i); }}
              />
            ))}
            <button className="sp-add-line" onClick={()=>{
              const last = lines[lines.length-1];
              const nextType = last ? (SP_NEXT[last.type] || 'action') : 'action';
              insertLineAfter(lines.length-1, nextType);
            }}>+ {t.spAddLine}</button>
          </div>
        </div>
      </div>
    </>
  );

  const tp = project.titlePage || {};
  const updateTitlePage = (patch) => {
    dispatch({ type: 'UPDATE_PROJECT', patch: { titlePage: { ...tp, ...patch } } });
  };
  const titlePageModal = (
    <Modal open={titlePageOpen} onClose={()=>setTitlePageOpen(false)}>
      <div className="modal-head">
        <div className="modal-title">{t.titlePage}</div>

      </div>
      <div className="modal-body">

          <label className="fl">{t.titlePageTitle}</label>
          <input className="fi-inp" value={tp.title||''} onChange={e=>updateTitlePage({title:e.target.value})}/>
        </div>
        <div className="fg">

          <input className="fi-inp" value={tp.draftDate||''} onChange={e=>updateTitlePage({draftDate:e.target.value})} placeholder="e.g., Draft 1 — April 2026"/>

        {body}
        {titlePageModal}
      </div>
    );
  }
  return <div className="ed-wrap sp-wrap">{body}{titlePageModal}</div>;
}

/* ▎ Screenplay Sidebar — scene list with synopses */
function ScreenplaySidebar({project, activeIdx, onJumpToLine, t, lang, dispatch}){
  const scenes = useMemo(() => {
    const out = [];
    const linesArr = project.lines || [];
    linesArr.forEach((l, i) => {
      if(l.type === 'scene' && l.text.trim()){
        // count how many lines belong to this scene (until next scene)
        let sceneLen = 0;
        for(let j=i+1; j<linesArr.length; j++){
          if(linesArr[j].type === 'scene') break;
          sceneLen++;
        }
        // ≈ 1 scene-line ≈ 1 page-line; 55 lines = 1 minute
        const mins = Math.max(1, Math.round(sceneLen / 8));
        out.push({ idx: i, text: l.text, num: out.length + 1, synopsis: l.synopsis || '', mins });
      }
    });
    return out;
  }, [project.lines]);

  const updateSynopsis = (idx, synopsis) => {
    const newLines = project.lines.map((l, i) => i === idx ? {...l, synopsis} : l);
    dispatch({ type: 'UPDATE_PROJECT', patch: { lines: newLines } });
  };

  if(scenes.length === 0){
    return <div className="sb-list empty-center"><div className="sb-empty">{t.spNoScenes}</div></div>;
  }

  return (
    <div className="sb-list">
      {scenes.map(s => (
        <div key={s.idx} className="li sp-scene-row" onClick={()=>onJumpToLine(s.idx)}>
          <div className="li-num">{s.num}</div>
          <div className="li-main">
            <div className="li-name">{s.text}</div>
            <input className="sp-scene-syn"
              type="text"
              placeholder={t.sceneSynopsisPh}
              value={s.synopsis}
              onClick={e=>e.stopPropagation()}
              onChange={e=>updateSynopsis(s.idx, e.target.value)}/>
            <div className="li-sub sp-scene-min">≈ {s.mins}{t.min}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ▎ Pixel Icon Editor & Display ─────────────────────────────────────────
   Renders a project's custom 8×8 pixel icon (or nothing if absent).
   Storage format: 64-char string of digits 0-6 mapped to PIXEL_PALETTE. */
function PixelIconDisplay({pixelIcon, size=28, className=''}){
  const pixels = (pixelIcon && pixelIcon.length === PIXEL_SIZE*PIXEL_SIZE) ? pixelIcon : EMPTY_PIXEL_ICON;
  const cellSize = size / PIXEL_SIZE;
  const cells = [];
  for(let i=0;i<PIXEL_SIZE*PIXEL_SIZE;i++){
    const colorIdx = parseInt(pixels[i], 10);
    if(colorIdx > 0){
      const x = (i % PIXEL_SIZE) * cellSize;
      const y = Math.floor(i / PIXEL_SIZE) * cellSize;
      cells.push(<rect key={i} x={x} y={y} width={cellSize+0.5} height={cellSize+0.5} fill={PIXEL_PALETTE[colorIdx]}/>);
    }
  }
  return (
    <svg className={className} width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
      {cells}
    </svg>
  );
}

function PixelIconEditor({value, onChange, t, lang}){
  const [selectedColor, setSelectedColor] = useState(1);
  const [isDrawing, setIsDrawing] = useState(false);
  const pixels = (value && value.length === PIXEL_SIZE*PIXEL_SIZE) ? value : EMPTY_PIXEL_ICON;

  const paint = (idx) => {
    const arr = pixels.split('');
    arr[idx] = String(selectedColor);
    onChange(arr.join(''));
  };
  const clear = () => onChange(EMPTY_PIXEL_ICON);

  return (
    <div className="pix-editor">
      <div className="pix-grid"
        onMouseLeave={()=>setIsDrawing(false)}
        onMouseUp={()=>setIsDrawing(false)}>
        {Array.from({length: PIXEL_SIZE*PIXEL_SIZE}).map((_, i) => {
          const colorIdx = parseInt(pixels[i], 10);
          const bg = colorIdx > 0 ? PIXEL_PALETTE[colorIdx] : undefined;
          return (
            <div key={i}
              className={`pix-cell ${colorIdx>0?'filled':''}`}
              style={bg ? {background: bg} : {}}
              onMouseDown={(e)=>{e.preventDefault(); setIsDrawing(true); paint(i);}}
              onMouseEnter={()=>{ if(isDrawing) paint(i); }}
              onTouchStart={(e)=>{e.preventDefault(); paint(i);}}
              onTouchMove={(e)=>{
                e.preventDefault();
                const touch = e.touches[0];
                if(!touch) return;
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                const rawIdx = el && el.dataset.pixIdx;
                if(rawIdx != null && rawIdx !== ''){
                  paint(parseInt(rawIdx, 10));
                }
              }}
              data-pix-idx={i}
            />
          );
        })}
      </div>
      <div className="pix-side">
        <div className="pix-palette">
          <button className={`pix-swatch eraser ${selectedColor===0?'on':''}`}
            onClick={()=>setSelectedColor(0)} title={t.pixelEraser}/>
          {PIXEL_PALETTE.slice(1).map((color, i) => (
            <button key={i+1}
              className={`pix-swatch ${selectedColor===i+1?'on':''}`}
              style={{background: color}}
              onClick={()=>setSelectedColor(i+1)}/>
          ))}
        </div>
        <div className="pix-hint">{t.pixelDesc}</div>
        <div className="pix-tools">
          <button className="pix-tool-btn" onClick={clear}>{t.pixelClear}</button>
        </div>
        <div className="pix-preview">
          <span className="pix-preview-lbl">{t.appearance}:</span>
          <div className="pix-preview-canvas"><PixelIconDisplay pixelIcon={pixels} size={48}/></div>
          <div className="pix-preview-small"><PixelIconDisplay pixelIcon={pixels} size={28}/></div>
        </div>
      </div>
    </div>
  );
}

/* ▎ Home Screen ──────────────────────────────────────────────────────── */
function HomeScreen({state, dispatch, push, t, lang, authUser, onSignOut}){
  const [creating, setCreating] = useState(false);
  const [newName, setNewName] = useState('');
  const [newEmoji, setNewEmoji] = useState('📖');
  const [newKind, setNewKind] = useState('novel'); // 'novel' | 'screenplay'
  const [kindPickerStep, setKindPickerStep] = useState(true); // show kind picker first, then name/emoji
  const [iconMode, setIconMode] = useState('emoji'); // 'emoji' | 'pixel'
  const [newPixelIcon, setNewPixelIcon] = useState(EMPTY_PIXEL_ICON);
  const [menuFor, setMenuFor] = useState(null);
  const [syncOpen, setSyncOpen] = useState(false);
  const fileRef = useRef(null);
  const dialogs = useDialogs();

  const openCreate = () => {
    setKindPickerStep(true);
    setNewKind('novel');
    setNewName('');
    setNewEmoji('📖');
    setNewPixelIcon(EMPTY_PIXEL_ICON);
    setIconMode('emoji');
    setCreating(true);
  };
  const pickKind = (kind) => {
    setNewKind(kind);
    if(kind === 'screenplay'){
      setNewName(lang==='ar'?'سيناريو جديد':'New Screenplay');
      setNewEmoji('🎬');
    } else {
      setNewName(lang==='ar'?'روايتي الجديدة':'My New Novel');
      setNewEmoji('📖');
    }
    setKindPickerStep(false);
  };
  const confirmCreate = () => {
    if(!newName.trim()) return;
    let p;
    if(newKind === 'screenplay'){
      p = makeScreenplay(newName.trim(), newEmoji, lang);
    } else {
      p = makeProject(newName.trim(), newEmoji, lang);
      p.chapters.push(makeChapter(1, lang));
    }
    // Attach pixel icon if user drew one
    if(iconMode === 'pixel' && newPixelIcon !== EMPTY_PIXEL_ICON){
      p.pixelIcon = newPixelIcon;
    }
    dispatch({type:'CREATE_PROJECT', project: p});
    push(t.toastProjCreated, 'success');
    setCreating(false);
  };

  const totalWords = state.projects.reduce((s,p)=>{
    if(p.kind === 'screenplay') return s + (p.lines||[]).reduce((ss,l)=>ss+countWords(l.text||''), 0);
    return s + (p.chapters||[]).reduce((ss,c)=>ss+(c.wc||0),0);
  }, 0);
  const totalChars = state.projects.reduce((s,p)=>s+(p.characters||[]).length, 0);
  const maxStreak = state.projects.reduce((m,p)=>Math.max(m, p.streak?.current||0), 0);

  const exportAll = () => {
    const blob = {version: SCHEMA_VERSION, exported: new Date().toISOString(), projects: state.projects};
    downloadFile(`riwailist-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(blob, null, 2), 'application/json');
    push(t.toastExported, 'success');
  };
  const importFile = (f) => {
    if(!f) return;
    const r = new FileReader();
    r.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if(data.projects && Array.isArray(data.projects)){
          data.projects.forEach(p => {
            // Ensure sanitized content on import
            p.chapters = (p.chapters||[]).map(c => ({...c, content: sanitizeHTML(c.content||'')}));
            p.blueprint = {
              plot: sanitizeHTML(p.blueprint?.plot||''),
              world: sanitizeHTML(p.blueprint?.world||''),
              themes: sanitizeHTML(p.blueprint?.themes||''),
            };
            p.notes = sanitizeHTML(p.notes||'');
            p.id = uid('proj'); // avoid collision
            dispatch({type:'CREATE_PROJECT', project: p});
          });
          push(t.toastImported, 'success');
          dispatch({type:'SET_VIEW', view:'home'}); // stay on home after multi-import
        } else if(data.id && data.chapters){
          // single project
          data.chapters = data.chapters.map(c=>({...c, content: sanitizeHTML(c.content||'')}));
          data.id = uid('proj');
          dispatch({type:'CREATE_PROJECT', project: data});
          push(t.toastImported, 'success');
        } else push(t.toastImportErr, 'error');
      } catch { push(t.toastImportErr, 'error'); }
    };
    r.readAsText(f);
  };

  const deleteProj = async (id) => {
    const ok = await dialogs.confirm({
      title: t.deleteProj,
      body: t.confirmDelProj,
      confirmLabel: t.delete,
      danger: true,
    });
    if(ok){
      dispatch({type:'DELETE_PROJECT', id});
      push(t.toastProjDeleted, 'info');
    }
    setMenuFor(null);
  };

  const toggleLang = () => dispatch({type:'SET_LANG', lang: lang==='ar'?'en':'ar'});

          <button className="pill" onClick={()=>fileRef.current?.click()} title={t.importBackup}><Icon.Upload/>{t.importBackup}</button>
          {state.projects.length>0 && <button className="pill" onClick={exportAll} title={t.exportAll}><Icon.Download/>{t.exportAll}</button>}
          <button className="pill" onClick={toggleLang}><Icon.Globe/>{t.langSwitch}</button>
          <input ref={fileRef} type="file" accept=".json,application/json" style={{display:'none'}}
            onChange={e=>{importFile(e.target.files?.[0]); e.target.value='';}}/>
        </div>
      </div>

      <div className="home-container">
        <div className="home-hero">
          <div className="home-hero-eyebrow">{t.appName} · {t.appSub}</div>
          <h1 className="home-hero-title">{t.welcomeTitle}</h1>
          <p className="home-hero-sub">{t.welcomeSub}</p>
        </div>

        {state.projects.length > 0 && (
          <div className="home-stats">
            <div className="home-stat"><div className="home-stat-v">{state.projects.length}</div><div className="home-stat-l">{t.statProjects}</div></div>
            <div className="home-stat"><div className="home-stat-v">{totalWords.toLocaleString()}</div><div className="home-stat-l">{t.statWords}</div></div>
            <div className="home-stat"><div className="home-stat-v">{totalChars}</div><div className="home-stat-l">{t.statCharacters}</div></div>
            <div className="home-stat"><div className="home-stat-v">{maxStreak}</div><div className="home-stat-l">{t.statStreak}</div></div>

            <div style={{fontSize:11,color:'var(--txm)',marginTop:2}}>{t.newProjectDesc}</div>
          </div>

            const isScreenplay = p.kind === 'screenplay';
            const wc = isScreenplay
              ? (p.lines||[]).reduce((s,l)=>s+countWords(l.text||''), 0)
              : (p.chapters||[]).reduce((s,c)=>s+(c.wc||0),0);
            const secondary = isScreenplay
              ? { label: t.spPages, value: spPageCount(p.lines||[]) }
              : { label: t.projChapters, value: (p.chapters||[]).length };
            return (
              <div key={p.id} className="proj-card" style={{animationDelay:(i*40)+'ms'}} onClick={()=>dispatch({type:'OPEN_PROJECT', id:p.id})}>
                <div className="proj-card-top">
                  <div className="proj-card-emoji">
                    {p.pixelIcon ? <PixelIconDisplay pixelIcon={p.pixelIcon} size={30}/> : (p.emoji||(isScreenplay?'🎬':'📖'))}
                  </div>
                  <button className="proj-card-menu" onClick={e=>{e.stopPropagation(); deleteProj(p.id);}} title={t.deleteProj}>

                </div>
                <div className="proj-card-name">{p.name}</div>
                <div className="proj-card-meta">
                  <span><b>{wc.toLocaleString()}</b> {t.projWords}</span>
                  <span className="proj-card-meta-dot"/>

                  {(p.characters||[]).length>0 && <><span className="proj-card-meta-dot"/><span><b>{p.characters.length}</b> {t.projChars}</span></>}

    </div>

    if(ok){ dispatch({type:'DELETE_CHAPTER', id}); if(selChapterId===id) setSelChapterId(null); }
  };
  const onDeleteChar = async id => {
    const ok = await dialogs.confirm({title: t.delete, body: t.confirmDelChar, confirmLabel: t.delete, danger: true});
    if(ok){ dispatch({type:'DELETE_CHAR', id}); if(selCharId===id) setSelCharId(null); }
  };
  const onDeleteLoc = async id => {
    const ok = await dialogs.confirm({title: t.delete, body: t.confirmDelLoc, confirmLabel: t.delete, danger: true});
    if(ok){ dispatch({type:'DELETE_LOC', id}); if(selLocId===id) setSelLocId(null); }
  };
  const onDeleteEvent = async id => {
    const ok = await dialogs.confirm({title: t.delete, body: t.confirmDelEvent, confirmLabel: t.delete, danger: true});
    if(ok){ dispatch({type:'DELETE_EVENT', id}); if(selEventId===id) setSelEventId(null); }
  };

  // Word count & page count — handle both kinds
  const wc = isScreenplay
    ? (project.lines||[]).reduce((s,l)=>s+countWords(l.text||''), 0)
    : (project.chapters||[]).reduce((s,c)=>s+(c.wc||0),0);
  const pageCount = isScreenplay ? spPageCount(project.lines||[]) : 0;

  const addChapter = () => {
    if(isScreenplay){
      // For screenplays, adding a "chapter" means adding a new scene heading
      const newLine = { id: uid('sl'), type: 'scene', text: '' };
      const newLines = [...(project.lines||[]), newLine];
      dispatch({ type: 'UPDATE_PROJECT', patch: { lines: newLines } });
      // Jump to the new scene
      setTimeout(() => {
        if(onJumpToLine) onJumpToLine(newLines.length - 1);
      }, 50);
      return;
    }
    const ch = makeChapter(project.chapters.length+1, lang);
    dispatch({type:'ADD_CHAPTER', chapter: ch});
    setSelChapterId(ch.id);
    push(t.toastChCreated, 'success');
  };
  const addChar = () => {
    const c = makeCharacter(lang);
    dispatch({type:'ADD_CHAR', character: c});
    setSelCharId(c.id);
  };
  const addLoc = () => {
    const l = makeLocation(lang);
    dispatch({type:'ADD_LOC', location: l});
    setSelLocId(l.id);
  };
  const addEvent = () => {
    const ev = makeEvent(lang);
    ev.order = (project.events||[]).length;
    dispatch({type:'ADD_EVENT', event: ev});
    setSelEventId(ev.id);
  };

  // Base nav — screenplays skip "blueprint" (it's novel-specific plot/world/themes)
  const NAV_FULL = [
    {key:'writing', icon:'Pen', label: isScreenplay ? t.spScenes : t.navWriting},
    {key:'read', icon:'Book', label: t.readingMode||'Read'},
    {key:'cast', icon:'Users', label:t.navCast},
    {key:'places', icon:'MapPin', label:t.navPlaces},
    {key:'timeline', icon:'Clock', label:t.navTimeline},
    {key:'blueprint', icon:'Map', label:t.navBlueprint},
    {key:'notes', icon:'FileText', label:t.navNotes},
    {key:'stats', icon:'BarChart', label:t.navStats},
    {key:'settings', icon:'Settings', label:t.navSettings},
  ];
  const NAV = isScreenplay ? NAV_FULL.filter(n => n.key !== 'blueprint' && n.key !== 'read') : NAV_FULL;

  const goHome = () => dispatch({type:'SET_VIEW', view:'home'});

  return (
    <div className={`sidebar ${collapsed?'collapsed':''}`}>
      <div className="sb-head">
        <div className="sb-head-brand" onClick={goHome} title={t.backHome}>
          <div className="logo-badge">{project.pixelIcon ? <PixelIconDisplay pixelIcon={project.pixelIcon} size={24}/> : 'R'}</div>
          <div style={{minWidth:0,flex:1}}>
            <div className="logo-text">{!project.pixelIcon ? (project.emoji + ' ') : ''}{project.name}</div>
            <div className="logo-sub">
              {isScreenplay
                ? `${pageCount} ${t.spPages} · ${wc.toLocaleString()} ${t.projWords}`
                : `${(project.chapters||[]).length} ${t.projChapters} · ${wc.toLocaleString()} ${t.projWords}`}
            </div>
          </div>
        </div>
        <button className="sb-icon-btn" onClick={onCollapse} title={t.hideSidebar} aria-label={t.hideSidebar}>
          {lang==='ar' ? <Icon.ArrowRight/> : <Icon.ArrowLeft/>}
        </button>
      </div>

      <div className="sb-nav" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        {NAV.slice(0, 4).map(n => {
          const Ic = Icon[n.icon];
          return (
            <button key={n.key} className={`nav-btn ${section===n.key?'active':''}`} onClick={()=>setSection(n.key)} title={n.label}>
              <Ic/><span>{n.label}</span>
            </button>
          );
        })}
      </div>
      {NAV.length > 4 && (
        <div className="sb-nav" style={{gridTemplateColumns:`repeat(${Math.max(NAV.length-4, 3)},1fr)`,paddingTop:0}}>
          {NAV.slice(4).map(n => {
            const Ic = Icon[n.icon];
            return (
              <button key={n.key} className={`nav-btn ${section===n.key?'active':''}`} onClick={()=>setSection(n.key)} title={n.label}>
                <Ic/><span>{n.label}</span>
              </button>
            );
          })}
        </div>
      )}

      {(section==='writing' || section==='cast' || section==='places' || section==='timeline') && (
        <>
          {!(isScreenplay && section==='writing') && (
            <div className="sb-search">
              <div className="search-wrap">
                <span style={{position:'absolute',insetInlineStart:10,top:'50%',transform:'translateY(-50%)',width:13,height:13,color:'var(--txm)',pointerEvents:'none',display:'flex'}}><Icon.Search/></span>
                <input className="search-input" placeholder={
                  section==='writing'?t.findChapter:
                  section==='cast'?t.findChar:
                  section==='places'?t.findLocation:t.findEvent
                } value={search} onChange={e=>setSearch(e.target.value)} dir={lang==='ar'?'rtl':'ltr'}/>
              </div>
            </div>
          )}
          <div className="sb-sec-head">
            <div className="sec-lbl">{
              section==='writing' ? (isScreenplay ? t.spScenes : t.chapters) :
              section==='cast' ? t.characters :
              section==='places' ? t.locations : t.timeline
            }</div>
            {section==='writing' && !isScreenplay && (
              <div className="sb-view-toggle">
                <button className={`sb-view-btn ${!corkMode?'active':''}`} title={t.listView||'List'} onClick={()=>setCorkMode(false)}>
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6"><line x1="4" y1="4" x2="13" y2="4"/><line x1="4" y1="8" x2="13" y2="8"/><line x1="4" y1="12" x2="13" y2="12"/><circle cx="2" cy="4" r=".8" fill="currentColor" stroke="none"/><circle cx="2" cy="8" r=".8" fill="currentColor" stroke="none"/><circle cx="2" cy="12" r=".8" fill="currentColor" stroke="none"/></svg>
                </button>
                <button className={`sb-view-btn ${corkMode?'active':''}`} title={t.corkboard||'Corkboard'} onClick={()=>setCorkMode(true)}>
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6"><rect x="2" y="2" width="5" height="6" rx="1"/><rect x="9" y="2" width="5" height="6" rx="1"/><rect x="2" y="10" width="5" height="4" rx="1"/><rect x="9" y="10" width="5" height="4" rx="1"/></svg>
                </button>
              </div>
            )}
            <button className="add-btn" onClick={
              section==='writing'?addChapter:
              section==='cast'?addChar:
              section==='places'?addLoc:addEvent
            } title={
              section==='writing' ? (isScreenplay ? t.spSceneHeading : t.newChapter) :
              section==='cast' ? t.characters :
              section==='places' ? t.locations : t.timeline
            }><Icon.Plus/></button>
          </div>
          {section==='writing' && !isScreenplay && !corkMode && <ChapterList project={project} selectedId={selChapterId} onSelect={setSelChapterId}
            onAdd={addChapter}
            onDelete={onDeleteChapter}
            onRename={(id, title) => dispatch({type:'UPDATE_CHAPTER', id, patch:{title}})}
            onReorder={chapters => dispatch({type:'REORDER_CHAPTERS', chapters})}
            onDuplicate={id => dispatch({type:'DUPLICATE_CHAPTER', id})}
            t={t} lang={lang} search={search} dispatch={dispatch} push={push}/>}
          {section==='writing' && !isScreenplay && corkMode && <CorkboardView project={project} selectedId={selChapterId} onSelect={(id)=>{setSelChapterId(id);setCorkMode(false);}} dispatch={dispatch} t={t} lang={lang}/>}
          {section==='writing' && isScreenplay && <ScreenplaySidebar project={project} activeIdx={0}
            onJumpToLine={onJumpToLine} t={t} lang={lang} dispatch={dispatch}/>}
          {section==='cast' && <CharacterList project={project} selectedId={selCharId} onSelect={setSelCharId}
            onDelete={onDeleteChar}
            t={t} lang={lang} search={search}/>}
          {section==='places' && <LocationList project={project} selectedId={selLocId} onSelect={setSelLocId}
            onDelete={onDeleteLoc}
            t={t} lang={lang} search={search}/>}
          {section==='timeline' && <EventList project={project} selectedId={selEventId} onSelect={setSelEventId}
            onDelete={onDeleteEvent}
            t={t} lang={lang} search={search}/>}
        </>
      )}
      {(section==='blueprint' || section==='notes' || section==='stats' || section==='settings') && (
        <div style={{flex:1}}/>
      )}

      <div className="sb-foot">
        <button className="foot-home-btn" onClick={goHome} title={t.backHome}>
          <Icon.Home/>
          <span>{t.home || 'Home'}</span>
        </button>
        <div className="foot-stat">
          <strong>{wc.toLocaleString()}</strong> {t.projWords}
          {isScreenplay && <><br/><strong>{pageCount}</strong> {t.spPages}</>}
        </div>
        <button className="foot-lang" onClick={async ()=>{
          const data = isScreenplay
            ? ('\uFEFF' + spLinesToText(project.lines||[], project))
            : buildNovelTxt(project, lang);
          const fileName = `${slug(project.name)}.txt`;
          const result = await saveFileWithPicker(fileName, data);
          if(result === 'saved') push(t.toastExported, 'success');
          else if(result === 'error') push(t.toastImportErr, 'error');
        }} title={t.exportText} style={{padding:'0 10px'}}>
          📄 TXT
        </button>
        <button className="foot-lang" onClick={()=>dispatch({type:'SET_LANG', lang: lang==='ar'?'en':'ar'})}>{t.langSwitch}</button>
      </div>
    </div>
  );
}

/* ▎ Chapter View — the main writing surface */
function ChapterView({project, chapter, dispatch, t, lang, tweaks, setTweaks, push, focusMode, setFocusMode}){
  const [saveStatus, setSaveStatus] = useState('saved');
  const dialogs = useDialogs();
  const saveTimerRef = useRef(null);

  const patch = (p) => dispatch({type:'UPDATE_CHAPTER', id: chapter.id, patch: p});
  const onTitleChange = (e) => patch({title: e.target.value});
  const onContent = (html) => {
    setSaveStatus('saving');
    if(saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(()=>setSaveStatus('saved'), 900);
    const wc = countWords(html);
    patch({content: html, wc});
  };
  useEffect(() => () => { if(saveTimerRef.current) clearTimeout(saveTimerRef.current); }, []);

  const onManualSave = () => {
    push(t.toastSaved, 'success');
    setSaveStatus('saved');
  };

  const ttlDir = chapter.dir || (lang==='ar'?'rtl':'ltr');
  const pct = chapter.goal>0 ? Math.min(100, Math.round((chapter.wc/chapter.goal)*100)) : 0;
  const readingTime = Math.max(1, Math.round(chapter.wc/220));

  const setGoal = async () => {
    const v = await dialogs.prompt({
      title: t.goalFor,
      defaultValue: String(chapter.goal||0),
      inputType: 'number',
    });
    if(v !== null) patch({goal: v});
  };

  const body = (
    <>
      <Toolbar chapter={chapter} onChapterPatch={patch} tweaks={tweaks} setTweaks={setTweaks}
        focusMode={focusMode} setFocusMode={setFocusMode}
        saveStatus={saveStatus} t={t} lang={lang} onManualSave={onManualSave}/>
      <div className="ed-body">
        <div className="ed-scroll">
          <div className="ed-col">
            <div className="ch-header">
              <span className="ch-chip"><Icon.FileText/> {chapter.wc||0} {t.words}</span>
              <span className="ch-chip"><Icon.Clock/> {readingTime} {t.min}</span>
              <span className={`ch-chip ch-chip-goal ${chapter.goal>0 && chapter.wc>=chapter.goal?'done':''}`} onClick={setGoal}>
                <Icon.Target/> {chapter.goal>0 ? `${chapter.wc}/${chapter.goal} (${pct}%)` : t.setGoal}
              </span>
              <span className={`ch-status ${chapter.status||'draft'}`}
                onClick={()=>patch({status:nextStatus(chapter.status||'draft')})}
                title="Click to change status">
                {(CH_STATUS_LABELS[lang]||CH_STATUS_LABELS.en)[chapter.status||'draft']}
              </span>
            </div>
            <input className="ch-title" value={chapter.title||''} onChange={onTitleChange}
              placeholder={t.chTitle} dir={ttlDir} spellCheck={tweaks.spellcheck}/>
            <RichEditor id={chapter.id} html={chapter.content||''} onChange={onContent}
              dir={ttlDir} placeholder={t.beginStory} className="prose-ed" spellcheck={tweaks.spellcheck}/>
          </div>
        </div>
      </div>
      {chapter.goal>0 && (
        <div className="ed-foot">
          <span><b>{chapter.wc||0}</b> / {chapter.goal} {t.words}</span>
          <div className="ed-foot-prog"><div className="ed-foot-prog-bar" style={{width:pct+'%',background:pct>=100?'var(--ok)':'var(--ac)'}}/></div>
          <span>{pct}%</span>
        </div>
      )}
    </>
  );

  if(focusMode){
    return (
      <div className="focus-overlay">
        <button className="focus-exit" onClick={()=>setFocusMode(false)}><Icon.Shrink/> {t.exitFocus} · ESC</button>
        {body}
      </div>
    );
  }
  return <div className="ed-wrap">{body}</div>;
}

/* ▎ Character View — detail form */
function CharacterView({project, char, dispatch, t, lang}){
  const patch = (p) => dispatch({type:'UPDATE_CHAR', id: char.id, patch: p});
  const [newTag, setNewTag] = useState('');
  const [newTrait, setNewTrait] = useState('');
  const [addingRel, setAddingRel] = useState(false);
  const [relChar, setRelChar] = useState('');
  const [relType, setRelType] = useState('');

  const addTag = () => { if(newTag.trim()) { patch({tags:[...(char.tags||[]), newTag.trim()]}); setNewTag(''); } };
  const delTag = (i) => patch({tags: (char.tags||[]).filter((_,x)=>x!==i)});
  const addTrait = () => { if(newTrait.trim()) { patch({traits:[...(char.traits||[]), newTrait.trim()]}); setNewTrait(''); } };
  const delTrait = (i) => patch({traits: (char.traits||[]).filter((_,x)=>x!==i)});
  const addRel = () => {
    if(!relChar || !relType.trim()) return;
    patch({relations: [...(char.relations||[]), {id: uid('rel'), charId: relChar, type: relType.trim()}]});
    setRelChar(''); setRelType(''); setAddingRel(false);
  };
  const delRel = (id) => patch({relations: (char.relations||[]).filter(r=>r.id!==id)});

  const otherChars = (project.characters||[]).filter(c=>c.id!==char.id);

  // Count how many times the character's name appears in the work
  // (chapter content for novels, or line text for screenplays)
  const mentions = useMemo(() => {
    if(!char.name || !char.name.trim()) return { total: 0, chapters: 0 };
    const name = char.name.trim();
    const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`\\b${escaped}\\b`, 'gi');
    let total = 0;
    let chaptersHit = 0;
    if(project.kind === 'screenplay'){
      // Count mentions within the full lines array (single "unit")
      const allText = (project.lines||[]).map(l => l.text||'').join('\n');
      const m = allText.match(re);
      if(m){ total = m.length; chaptersHit = total > 0 ? 1 : 0; }
    } else {
      (project.chapters||[]).forEach(ch => {
        const text = htmlToText(ch.content||'');
        const m = text.match(re);
        if(m && m.length > 0){ total += m.length; chaptersHit++; }
      });
    }
    return { total, chapters: chaptersHit };
  }, [char.name, project.chapters, project.lines, project.kind]);

  return (
    <div className="detail-main">
      <div className="detail-form">
        <div className="detail-head">
          <div className="avatar-xl" style={{background:char.color||CHAR_COLORS[0]}}>{initials(char.name)}</div>
          <div className="detail-head-info" style={{flex:1}}>
            <input className="detail-title" value={char.name||''} onChange={e=>patch({name:e.target.value})}
              placeholder={t.charNamePh} dir={lang==='ar'?'rtl':'ltr'}/>
            <div className="meta">
              {char.role} {char.age?`· ${char.age}`:''}
              {mentions.total > 0 && (
                <>
                  {' · '}
                  <span style={{color:'var(--ac)'}}>🔍 {mentions.total} {t.mentions}</span>
                  {' '}
                  <span style={{color:'var(--txm)'}}>{(t.mentionsInCh||'in {n} chapters').replace('{n}', mentions.chapters)}</span>
                </>
              )}
            </div>
          </div>
        </div>
        <div className="form-grid">
          <div className="fg">
            <label className="fl">{t.role}</label>
            <select className="fi-sel" value={char.role} onChange={e=>patch({role:e.target.value})}>
              {t.roles.map(r=><option key={r}>{r}</option>)}
            </select>
          </div>
          <div className="fg">
            <label className="fl">{t.age}</label>
            <input className="fi-inp" value={char.age||''} onChange={e=>patch({age:e.target.value})}
              placeholder={t.agePh} dir={lang==='ar'?'rtl':'ltr'}/>
          </div>
          <div className="fg full">
            <label className="fl">{t.color}</label>
            <div className="color-row">
              {CHAR_COLORS.map(c => (
                <button key={c} className={`color-dot ${char.color===c?'on':''}`} style={{background:c}} onClick={()=>patch({color:c})}/>
              ))}
            </div>
          </div>
          <div className="fg full">
            <label className="fl">{t.arc}</label>
            <RichEditor id={char.id+'-arc'} html={char.arc||''} onChange={v=>patch({arc:v})}
              dir={lang==='ar'?'rtl':'ltr'} placeholder={t.arcPh} className="arc-ed"/>
          </div>
          <div className="fg full">
            <label className="fl">{t.goals}</label>
            <textarea className="fi-ta" value={char.goals||''} onChange={e=>patch({goals:e.target.value})}
              placeholder={t.goalsPh} dir={lang==='ar'?'rtl':'ltr'} rows={3}/>
          </div>
          <div className="fg full">
            <label className="fl">{t.notes}</label>
            <textarea className="fi-ta" value={char.notes||''} onChange={e=>patch({notes:e.target.value})}
              placeholder={t.notesPh} dir={lang==='ar'?'rtl':'ltr'} rows={4}/>
          </div>
          <div className="fg full">
            <label className="fl">{t.traits}</label>
            <div className="tag-row">
              {(char.traits||[]).map((tr,i)=>(
                <span key={i} className="tag">{tr}<button className="tag-remove" onClick={()=>delTrait(i)}><Icon.X/></button></span>
              ))}
              <input className="fi-inp" style={{width:180,height:24,fontSize:11,padding:'2px 8px'}} value={newTrait}
                onChange={e=>setNewTrait(e.target.value)} placeholder={t.traitsPh}
                onKeyDown={e=>{ if(e.key==='Enter') addTrait(); }}/>
            </div>
          </div>
          <div className="fg full">
            <label className="fl">{t.tags}</label>
            <div className="tag-row">
              {(char.tags||[]).map((tg,i)=>(
                <span key={i} className="tag">{tg}<button className="tag-remove" onClick={()=>delTag(i)}><Icon.X/></button></span>
              ))}
              <input className="fi-inp" style={{width:140,height:24,fontSize:11,padding:'2px 8px'}} value={newTag}
                onChange={e=>setNewTag(e.target.value)} placeholder={t.addTag}
                onKeyDown={e=>{ if(e.key==='Enter') addTag(); }}/>
            </div>
          </div>
          <div className="fg full">
            <label className="fl">{t.relationships}</label>
            <div className="rel-list">
              {(char.relations||[]).map(r => {
                const other = project.characters.find(c=>c.id===r.charId);
                if(!other) return null;
                return (
                  <div key={r.id} className="rel-item">
                    <div className="rel-item-avatar" style={{background:other.color||CHAR_COLORS[0]}}>{initials(other.name)}</div>
                    <div className="rel-item-name">{other.name}</div>
                    <div className="rel-item-sel" style={{color:'var(--tx2)',fontSize:12.5}}>— {r.type}</div>
                    <button className="rel-item-del" onClick={()=>delRel(r.id)}><Icon.X/></button>
                  </div>
                );
              })}
              {otherChars.length>0 && (
                addingRel ? (
                  <div className="rel-add">
                    <select className="fi-sel" value={relChar} onChange={e=>setRelChar(e.target.value)} style={{flex:1}}>
                      <option value="">—</option>
                      {otherChars.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                    <input className="fi-inp" value={relType} onChange={e=>setRelType(e.target.value)}
                      placeholder={t.relPh} style={{flex:1}} dir={lang==='ar'?'rtl':'ltr'}/>
                    <button className="btn btn-primary" onClick={addRel}>{t.create}</button>
                    <button className="btn btn-ghost" onClick={()=>setAddingRel(false)}>{t.cancel}</button>
                  </div>
                ) : (
                  <button className="tag-add" onClick={()=>setAddingRel(true)}>+ {t.addRelation}</button>
                )
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ▎ Timeline View */
function TimelineView({project, eventId, setEventId, dispatch, t, lang}){
  const event = project.events.find(e=>e.id===eventId);
  const patch = (p) => event && dispatch({type:'UPDATE_EVENT', id: event.id, patch: p});

  if(!event){
    const sorted = [...project.events].sort((a,b)=>(a.order||0)-(b.order||0));
    return (
      <div className="timeline-wrap">
        <div className="stats-head">
          <div className="stats-title">{t.timeline}</div>
          <div className="stats-sub" style={{marginTop:6}}>{sorted.length} {sorted.length===1?t.word:t.words}</div>
        </div>
        {sorted.length===0 ? (
          <div className="ed-empty" style={{minHeight:200}}>
            <div className="ed-empty-icon"><Icon.Clock/></div>
            <div className="ed-empty-title">{t.selectEvent}</div>
          </div>
        ) : sorted.map((ev,i)=>(
          <div key={ev.id} className="tl-item" onClick={()=>setEventId(ev.id)} style={{animationDelay:(i*25)+'ms'}}>
            <div className="tl-bullet">{i+1}</div>
            <div className="tl-body">
              <div className="tl-title">{ev.title}</div>
              <div className="tl-meta">
                {ev.date && <span>📅 {ev.date}</span>}
                <span style={{color:ev.importance==='high'?'var(--ac)':ev.importance==='medium'?'var(--tx2)':'var(--txm)'}}>
                  ● {ev.importance==='high'?t.evImpHigh:ev.importance==='medium'?t.evImpMed:t.evImpLow}
                </span>
                {ev.chapterId && (()=>{const ch=(project.chapters||[]).find(c=>c.id===ev.chapterId); return ch?<span>→ {ch.title}</span>:null;})()}
              </div>
              {ev.description && <div className="tl-desc">{ev.description.slice(0,180)}{ev.description.length>180?'…':''}</div>}
            </div>
          </div>
        ))}
      </div>
    );
  }

  return (
    <div className="detail-main">
      <div className="detail-form">
        <input className="detail-title" value={event.title||''} onChange={e=>patch({title:e.target.value})}
          placeholder={t.eventNamePh} dir={lang==='ar'?'rtl':'ltr'}/>
        <div className="form-grid">
          <div className="fg">
            <label className="fl">{t.eventDate}</label>
            <input className="fi-inp" value={event.date||''} onChange={e=>patch({date:e.target.value})}
              placeholder={t.eventDateSub} dir={lang==='ar'?'rtl':'ltr'}/>
          </div>
          <div className="fg">
            <label className="fl">{t.eventImportance}</label>
            <select className="fi-sel" value={event.importance||'medium'} onChange={e=>patch({importance:e.target.value})}>
              <option value="low">{t.evImpLow}</option>
              <option value="medium">{t.evImpMed}</option>
              <option value="high">{t.evImpHigh}</option>
            </select>
          </div>
          <div className="fg full">
            <label className="fl">{t.eventInCh}</label>
            <select className="fi-sel" value={event.chapterId||''} onChange={e=>patch({chapterId:e.target.value||null})}>
              <option value="">{t.linkNone}</option>
              {(project.chapters||[]).map(c=><option key={c.id} value={c.id}>{c.title}</option>)}
            </select>
          </div>
          <div className="fg full">
            <label className="fl">{t.eventDesc}</label>
            <textarea className="fi-ta" value={event.description||''} onChange={e=>patch({description:e.target.value})}
              placeholder={t.eventDescPh} dir={lang==='ar'?'rtl':'ltr'} rows={8}/>
          </div>
          <div className="fg full">
            <button className="btn btn-ghost" onClick={()=>setEventId(null)}>← {t.timeline}</button>
          </div>

      </div>

  );
}

/* ▎ Stats View */
function StatsView({project, dispatch, t, lang, session, sprint}){
  const isScreenplay = project.kind === 'screenplay';
  // For screenplays, "total words" comes from the lines; for novels, from chapters
  const totalWords = isScreenplay
    ? (project.lines||[]).reduce((s,l)=>s+countWords(l.text||''), 0)
    : (project.chapters||[]).reduce((s,c)=>s+(c.wc||0),0);
  const readingTime = Math.max(1, Math.round(totalWords/220));
  const pageCount = isScreenplay ? spPageCount(project.lines||[]) : 0;
  const today = todayKey();
  const daily = project.streak?.daily||{};
  const todayW = daily[today]||0;
  let weekW = 0;
  for(let i=0;i<7;i++) weekW += daily[daysAgoKey(i)]||0;
  const dialogs = useDialogs();

  // Sprint setup dialog (custom small modal)
  const [sprintSetupOpen, setSprintSetupOpen] = useState(false);
  const [sprintMinutes, setSprintMinutes] = useState(25);
  const [sprintGoal, setSprintGoal] = useState(500);
  const startSprint = () => {
    if(sprint) sprint.start(sprintMinutes, sprintGoal);
    setSprintSetupOpen(false);
  };

  const dailyGoal = project.goal?.daily||500;
  const totalTarget = project.goal?.total||80000;
  const todayPct = Math.min(100, Math.round((todayW/dailyGoal)*100));
  const totalPct = Math.min(100, Math.round((totalWords/totalTarget)*100));

  const setDaily = async () => {
    const v = await dialogs.prompt({
      title: t.dailyGoal,
      body: t.dailyGoalDesc,
      defaultValue: String(dailyGoal),
      inputType: 'number',
    });
    if(v !== null) dispatch({type:'UPDATE_GOAL', goal:{daily:v}});
  };
  const setTotal = async () => {
    const v = await dialogs.prompt({
      title: t.totalTarget,
      body: t.targetDesc,
      defaultValue: String(totalTarget),
      inputType: 'number',
    });
    if(v !== null) dispatch({type:'UPDATE_GOAL', goal:{total:v}});
  };

  // Last 30 days grid
  // Full year heatmap (365 days)
  const heatmapDays = [];
  for(let i=364;i>=0;i--){
    const k = daysAgoKey(i);
    const w = daily[k]||0;
    const d = new Date(); d.setDate(d.getDate()-i);
    heatmapDays.push({k, w, date:d, isToday:i===0, month:d.getMonth(), day:d.getDay()});
  }
  const maxDaily = Math.max(1, ...heatmapDays.map(d=>d.w));

  // Group into weeks (columns of 7)
  const heatmapWeeks = [];
  let week = [];
  // Pad start to align with day of week
  const firstDay = heatmapDays[0].date.getDay();
  for(let p=0;p<firstDay;p++) week.push(null);
  heatmapDays.forEach((d,i)=>{
    week.push(d);
    if(week.length===7){ heatmapWeeks.push(week); week=[]; }
  });
  if(week.length) heatmapWeeks.push(week);

  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTH_NAMES_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const mnames = lang==='ar' ? MONTH_NAMES_AR : MONTH_NAMES;

  const getLevel = (w) => {
    if(w===0) return '';
    const pct = w / maxDaily;
    if(pct<0.25) return 'l1';
    if(pct<0.5) return 'l2';
    if(pct<0.75) return 'l3';
    return 'l4';
  };

  // Last 30 still for backwards compat
  const last30 = [];
  for(let i=29;i>=0;i--){
    const k = daysAgoKey(i);
    const w = daily[k]||0;
    const d2 = new Date(); d2.setDate(d2.getDate()-i);
    last30.push({k, w, day:d2.getDate(), isToday:i===0});
  }

  return (
    <div className="stats-wrap">
      <div className="stats-container">
        <div className="stats-head">
          <div className="stats-title">{t.statsTitle}</div>
          <div className="stats-sub">{t.statsSub}</div>
        </div>
        <div className="stats-grid">
          <div className="stat-card">
            <div className="stat-card-l">{t.totalWords}</div>
            <div className="stat-card-v">{totalWords.toLocaleString()}</div>
            <div className="stat-card-hint">
              {isScreenplay
                ? `${pageCount} ${t.spPages}`
                : `${(project.chapters||[]).length} ${t.projChapters}`}
            </div>
          </div>
          <div className="stat-card">
            <div className="stat-card-l">{t.readingTime}</div>
            <div className="stat-card-v">{readingTime}<span style={{fontSize:15,color:'var(--txm)',marginInlineStart:4}}>{t.min}</span></div>
            <div className="stat-card-hint">≈ 220 wpm</div>
          </div>
          <div className="stat-card">
            <div className="stat-card-l">{t.today}</div>
            <div className="stat-card-v" style={{color:todayW>=dailyGoal?'var(--ok)':'var(--tx)'}}>{todayW.toLocaleString()}</div>
            <div className="stat-card-hint">/ {dailyGoal} ({todayPct}%)</div>
          </div>
          <div className="stat-card">
            <div className="stat-card-l">{t.thisWeek}</div>
            <div className="stat-card-v">{weekW.toLocaleString()}</div>
            <div className="stat-card-hint">{Math.round(weekW/7)} / {t.daysUnit}</div>
          </div>
          <div className="stat-card">
            <div className="stat-card-l">{t.streak}</div>
            <div className="stat-card-v" style={{color:'var(--ac)'}}>{project.streak?.current||0}<span style={{fontSize:13,color:'var(--txm)',marginInlineStart:4}}>{t.daysUnit}</span></div>
            <div className="stat-card-hint">🔥 {t.longestStreak}: {project.streak?.longest||0}</div>
          </div>
          <div className="stat-card">
            <div className="stat-card-l">{t.statCharacters}</div>
            <div className="stat-card-v">{(project.characters||[]).length}</div>
            <div className="stat-card-hint">{(project.locations||[]).length} {t.locations.toLowerCase()}</div>
          </div>
        </div>

        {session && (
          <div className="session-card">
            <div className="session-stat">
              <div className="session-stat-v">{session.startTimeStr}</div>
              <div className="session-stat-l">{t.sessionStart}</div>
            </div>
            <div className="session-stat">
              <div className="session-stat-v">{session.elapsedMin}{t.min}</div>
              <div className="session-stat-l">{t.sessionDuration}</div>
            </div>
            <div className="session-stat">
              <div className="session-stat-v">{session.wordsAdded.toLocaleString()}</div>
              <div className="session-stat-l">{t.sessionWordsAdded}</div>
            </div>
            <div className="session-stat">
              <div className="session-stat-v">{session.wpm}</div>
              <div className="session-stat-l">{t.sessionWPM}</div>
            </div>
            {sprint && !sprint.active && (
              <button className="btn btn-primary" style={{marginInlineStart:'auto'}}
                onClick={()=>setSprintSetupOpen(true)}>⏱ {t.sprintStart}</button>
            )}
            {sprint && sprint.active && (
              <button className="btn btn-danger" style={{marginInlineStart:'auto'}}
                onClick={sprint.stop}>⏹ {t.sprintStop}</button>
            )}
          </div>
        )}

        <div className="goal-card">
          <div className="goal-card-head">
            <div className="goal-card-title">{t.dailyGoal}</div>
            <button className="btn btn-ghost" onClick={setDaily}>{t.rename}</button>
          </div>
          <div className="goal-row">
            <span className="goal-lbl">{t.today}</span>
            <span className="goal-num">{todayW.toLocaleString()}</span>
            <span style={{color:'var(--txm)'}}>/</span>
            <span className="goal-num">{dailyGoal.toLocaleString()}</span>
            <span className="goal-pct">{todayPct}%</span>
          </div>
          <div className="goal-bar"><div className={`goal-bar-fill ${todayW>=dailyGoal?'done':''}`} style={{width:todayPct+'%'}}/></div>
        </div>

        <div className="goal-card">
          <div className="goal-card-head">
            <div className="goal-card-title">{t.totalTarget}</div>
            <button className="btn btn-ghost" onClick={setTotal}>{t.rename}</button>
          </div>
          <div className="goal-row">
            <span className="goal-lbl">{t.totalWords}</span>
            <span className="goal-num">{totalWords.toLocaleString()}</span>
            <span style={{color:'var(--txm)'}}>/</span>
            <span className="goal-num">{totalTarget.toLocaleString()}</span>
            <span className="goal-pct">{totalPct}%</span>
          </div>
          <div className="goal-bar"><div className={`goal-bar-fill ${totalWords>=totalTarget?'done':''}`} style={{width:totalPct+'%'}}/></div>
        </div>

        <div className="goal-card">
          <div className="goal-card-head">
            <div className="goal-card-title">{lang==='ar'?'نشاط الكتابة — السنة الماضية':'Writing Activity — Past Year'}</div>
          </div>
          <div className="heatmap-wrap">
            <div style={{display:'flex',gap:3,marginBottom:4}}>
              {heatmapWeeks.map((wk,wi)=>{
                // Find first non-null cell's month for label
                const first = wk.find(Boolean);
                const showMonth = first && (wi===0 || first.date.getDate()<=7);
                return (
                  <div key={wi} style={{display:'flex',flexDirection:'column',gap:3}}>
                    {wk.map((cell,di)=> cell ? (
                      <div key={di} className={`heatmap-cell ${getLevel(cell.w)}`}
                        title={`${cell.k}: ${cell.w.toLocaleString()} ${t.words}`}
                        style={{outline:cell.isToday?'1.5px solid var(--ac)':undefined}}/>
                    ) : (
                      <div key={di} style={{width:10,height:10}}/>
                    ))}
                  </div>
                );
              })}
            </div>
            <div className="heatmap-legend">
              <span>{lang==='ar'?'أقل':'Less'}</span>
              {['','l1','l2','l3','l4'].map(l=><div key={l} className={`heatmap-legend-cell ${l}`} style={{background:l?undefined:'var(--bg-e)'}}/>)}
              <span>{lang==='ar'?'أكثر':'More'}</span>
            </div>
          </div>
        </div>
      </div>

      <Modal open={sprintSetupOpen} onClose={()=>setSprintSetupOpen(false)}>
        <div className="modal-head">
          <div className="modal-title">⏱ {t.sprintMode}</div>
          <div className="modal-sub">{t.sprintStart}</div>
        </div>
        <div className="modal-body">
          <div className="fg">
            <label className="fl">{t.sprintDuration}</label>
            <div className="seg">
              {[10, 15, 25, 45].map(m => (
                <button key={m} className={`seg-btn ${sprintMinutes===m?'on':''}`} onClick={()=>setSprintMinutes(m)}>{m}{t.min}</button>
              ))}
            </div>
          </div>
          <div className="fg">
            <label className="fl">{t.sprintGoal}</label>
            <input className="fi-inp" type="number" value={sprintGoal}
              onChange={e=>setSprintGoal(parseInt(e.target.value,10)||0)}/>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={()=>setSprintSetupOpen(false)}>{t.cancel}</button>
          <button className="btn btn-primary" onClick={startSprint}>⏱ {t.sprintStart}</button>
        </div>
      </Modal>
    </div>
  );
}

/* ▎ Settings View */
function SettingsView({state, dispatch, push, t, lang, activeProj}){
  const { tweaks } = state;
  const set = (patch) => dispatch({type:'SET_TWEAKS', tweaks: patch});
  const fileRef = useRef(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const [exportType, setExportType] = useState(null);
  // Per-project snapshots: load only snapshots for the currently-open project
  const [snapshots, setSnapshots] = useState(() => activeProj ? loadSnapshotsFor(activeProj.id) : []);
  const dialogs = useDialogs();

  // Refresh whenever the active project changes (so switching projects shows
  // that project's own history).
  useEffect(() => {
    setSnapshots(activeProj ? loadSnapshotsFor(activeProj.id) : []);
  }, [activeProj?.id]);

  const refreshSnaps = () => {
    setSnapshots(activeProj ? loadSnapshotsFor(activeProj.id) : []);
  };

  const manualSnapshot = () => {
    if(!activeProj) return;
    addProjectSnapshot(activeProj, 'manual');
    refreshSnaps();
    push(t.snapshotCreated, 'success');
  };

  const handleRestoreSnap = async (snapshotId) => {
    if(!activeProj) return;
    const snap = getProjectSnapshot(activeProj.id, snapshotId);
    if(!snap || !snap.data){
      push(t.toastImportErr, 'error');
      return;
    }
    const ok = await dialogs.confirm({
      title: t.snapshotRestore,
      body: t.confirmRestoreSnap,
      confirmLabel: t.snapshotRestore,
    });
    if(!ok) return;
    // 1. Take a safety snapshot of CURRENT project first (user can undo)
    addProjectSnapshot(activeProj, 'pre-restore');
    // 2. Replace the project via the reducer. CRITICAL: we must preserve the
    //    snapshot's ID matching the current project's ID, because REPLACE_PROJECT
    //    matches by id. The snapshot.data.id should equal activeProj.id already
    //    (since snapshots are stored keyed by the current project id).
    const restoredProject = { ...snap.data, id: activeProj.id, updatedAt: new Date().toISOString() };
    dispatch({ type: 'REPLACE_PROJECT', project: restoredProject });
    // 3. Refresh snapshot list so the new "pre-restore" entry appears
    refreshSnaps();
    push(t.snapshotRestored, 'success');
  };

  const handleDelSnap = async (snapshotId) => {
    if(!activeProj) return;
    const ok = await dialogs.confirm({
      title: t.snapshotDel, confirmLabel: t.delete, danger: true,
    });
    if(!ok) return;
    deleteProjectSnapshot(activeProj.id, snapshotId);
    refreshSnaps();
  };

  const exportProj = () => {
    if(!activeProj) return;
    downloadFile(`${slug(activeProj.name)}-${new Date().toISOString().slice(0,10)}.json`,
      JSON.stringify(activeProj, null, 2), 'application/json');
    push(t.toastExported, 'success');
  };

  useEffect(() => {
    if(exportType){ exportAsText(exportType); }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [exportType]);

  const exportAsText = (fmt) => {
    if(!activeProj) return;
    let out = '';
    if(fmt==='md'){
      out = `# ${activeProj.name}\n\n`;
      activeProj.chapters.forEach((c,i)=>{
        out += `\n\n## ${c.title||'Chapter '+(i+1)}\n\n` + htmlToMarkdown(c.content||'') + '\n';
      });
      downloadFile(`${slug(activeProj.name)}.md`, out, 'text/markdown');
    } else if(fmt==='html'){
      // A clean, readable standalone HTML doc — ready to send
      const isRTL = lang==='ar' || activeProj.chapters.some(c=>c.dir==='rtl');
      out = `<!DOCTYPE html>
<html lang="${lang}" dir="${isRTL?'rtl':'ltr'}">
<head>
<meta charset="utf-8">
<title>${activeProj.name}</title>
<style>
  body{max-width:720px;margin:40px auto;padding:0 24px;font-family:${isRTL?"'Amiri', 'Noto Naskh Arabic', Georgia, serif":"Georgia, 'Times New Roman', serif"};font-size:18px;line-height:1.85;color:#222;background:#fafaf7}
  h1{font-size:2.2em;text-align:center;margin:0 0 .3em;font-weight:700;letter-spacing:-.01em}
  h1+.meta{text-align:center;color:#888;font-size:.9em;margin-bottom:3em;font-style:italic}
  h2{font-size:1.5em;margin:3em 0 .8em;border-bottom:1px solid #ddd;padding-bottom:.4em}
  h3{font-size:1.15em;margin:1.2em 0 .4em}
  p{margin:.7em 0;text-indent:1.5em}
  p:first-of-type,h1+p,h2+p,h3+p,blockquote+p{text-indent:0}
  blockquote{border-${isRTL?'right':'left'}:3px solid #c9a872;padding-${isRTL?'right':'left'}:18px;margin:1.2em 0;color:#555;font-style:italic}
  hr{border:none;text-align:center;margin:2em 0}
  hr::before{content:'* * *';color:#999;letter-spacing:.5em}
  @media print{body{background:#fff;font-size:12pt}h2{page-break-before:always}}
</style>
</head>
<body>
<h1>${activeProj.name}</h1>
<p class="meta">${activeProj.chapters.length} ${lang==='ar'?'فصلاً':'chapters'} · ${activeProj.chapters.reduce((s,c)=>s+(c.wc||0),0).toLocaleString()} ${lang==='ar'?'كلمة':'words'}</p>
`;
      activeProj.chapters.forEach((c,i)=>{
        out += `\n<h2>${c.title||(lang==='ar'?'الفصل '+(i+1):'Chapter '+(i+1))}</h2>\n${sanitizeHTML(c.content||'')}\n`;
      });
      out += '\n</body>\n</html>';
      downloadFile(`${slug(activeProj.name)}.html`, out, 'text/html');
    } else {
      // Reader-friendly plain text (reuses the shared helper)
      const data = buildNovelTxt(activeProj, lang);
      downloadFile(`${slug(activeProj.name)}.txt`, data, 'text/plain;charset=utf-8');
    }
    push(t.toastExported, 'success');
    setExportType(null);
  };

  const importProj = (f) => {
    if(!f) return;
    const r = new FileReader();
    r.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if(data.id && data.chapters){
          data.chapters = data.chapters.map(c=>({...c, content: sanitizeHTML(c.content||'')}));
          data.id = uid('proj');
          dispatch({type:'CREATE_PROJECT', project: data});
          push(t.toastImported, 'success');
        } else push(t.toastImportErr, 'error');
      } catch { push(t.toastImportErr, 'error'); }
    };
    r.readAsText(f);
  };

  return (
    <div className="set-wrap">
      <div className="set-container">
        <div className="stats-head">
          <div className="stats-title">{t.settingsTitle}</div>
          <div className="stats-sub">{t.settingsSub}</div>
        </div>

        <div className="set-group">
          <div className="set-group-title">{t.appearance2}</div>
          <div className="set-row">
            <div className="set-row-label"><div className="set-row-title">{t.theme}</div></div>
            <div className="set-row-control">
              <div className="seg">
                {THEMES.map(th => <button key={th} className={`seg-btn ${tweaks.theme===th?'on':''}`} onClick={()=>set({theme:th})}>{t[th]||th}</button>)}
              </div>
            </div>
          </div>
          <div className="set-row">
            <div className="set-row-label">
              <div className="set-row-title">{t.accentColor}</div>
              <div className="set-row-sub">{t.accentColorDesc}</div>
            </div>

            </div>
          </div>
