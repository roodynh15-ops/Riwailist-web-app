<style>

#root:empty::before{
  content: "Loading Riwailist…";
  position: fixed; inset: 0; display: flex;
  align-items: center; justify-content: center;
  font-family: Georgia, serif; font-size: 16px;
  color: #8a8077; letter-spacing: .02em;
}

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   NOVELIST PRO · Design System
   ───────────────────────────────────────────────────────────────────────────
   Organised in sections. Search for ▎ to jump.
═══════════════════════════════════════════════════════════════════════════ */

/* ▎ Reset ───────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
[contenteditable]{-webkit-user-select:text;user-select:text}
::selection{background:var(--ac-b);color:var(--tx)}

/* ▎ Design Tokens ──────────────────────────────────────────────────────── */
:root{
  /* Colors — Dark (default) — warm charcoal */
  --bg:oklch(0.112 0.012 42);
  --bg-s:oklch(0.148 0.012 42);
  --bg-e:oklch(0.190 0.011 42);
  --bg-h:oklch(0.232 0.010 42);
  --bg-over:oklch(0.090 0.012 42 / 0.76);
  --bd:oklch(0.295 0.010 42);
  --bd-s:oklch(0.222 0.010 42);
  --tx:oklch(0.938 0.008 78);
  --tx2:oklch(0.618 0.010 78);
  --txm:oklch(0.415 0.008 78);
  --ac:oklch(0.792 0.148 52);
  --ac-h:oklch(0.852 0.148 52);
  --ac-d:oklch(0.792 0.148 52 / 0.13);
  --ac-b:oklch(0.792 0.148 52 / 0.30);
  --ac-ink:oklch(0.115 0.012 42);
  --ok:oklch(0.720 0.160 150);
  --ok-d:oklch(0.720 0.160 150 / 0.14);
  --warn:oklch(0.780 0.160 80);
  --err:oklch(0.670 0.190 25);
  --err-d:oklch(0.670 0.190 25 / 0.14);
  --info:oklch(0.720 0.120 230);
  --info-d:oklch(0.720 0.120 230 / 0.14);

  /* Shadows */
  --sh-sm:0 1px 3px oklch(0 0 0 / .35);
  --sh-md:0 4px 16px oklch(0 0 0 / .32);
  --sh-lg:0 12px 40px oklch(0 0 0 / .45);
  --sh-xl:0 24px 64px oklch(0 0 0 / .55);
  --sh-glow:0 0 0 3px var(--ac-d);

  /* Layout */
  --sb-w:264px;
  --th:44px;
  --r-xs:4px;
  --r-sm:7px;
  --r:10px;
  --r-lg:14px;
  --r-xl:20px;

  /* Typography */
  --fi:20px;
  --lh:1.85;
  --ff-ui:'Outfit',system-ui,-apple-system,sans-serif;
  --ff-serif:'Lora',Georgia,'Times New Roman',serif;
  --ff-mono:'JetBrains Mono',ui-monospace,monospace;
  --ff-ar:'Scheherazade New','Noto Naskh Arabic',system-ui,sans-serif;
  --ff-ar-serif:'Scheherazade New','Amiri','Noto Naskh Arabic',serif;

  /* Motion */
  --e1:cubic-bezier(.2,.6,.2,1);
  --e2:cubic-bezier(.4,0,.2,1);
  --t-fast:110ms;
  --t:170ms;
  --t-slow:260ms;

  color-scheme:dark;
}

/* ▎ Theme variations ──────────────────────────────────────────────────── */
.theme-warm{
  --bg:oklch(0.115 0.020 38);--bg-s:oklch(0.152 0.018 38);--bg-e:oklch(0.196 0.016 38);
  --bg-h:oklch(0.240 0.014 38);--bg-over:oklch(0.090 0.020 38 / .76);
  --bd:oklch(0.308 0.014 38);--bd-s:oklch(0.238 0.012 38);
  --ac:oklch(0.800 0.150 48);--ac-h:oklch(0.858 0.150 48);
  --ac-d:oklch(0.800 0.150 48 / 0.13);--ac-b:oklch(0.800 0.150 48 / 0.30);
}
.theme-sepia{
  --bg:oklch(0.960 0.016 82);--bg-s:oklch(0.918 0.016 82);--bg-e:oklch(0.878 0.014 82);
  --bg-h:oklch(0.835 0.013 82);--bg-over:oklch(0.925 0.016 82 / .84);
  --bd:oklch(0.768 0.013 82);--bd-s:oklch(0.845 0.012 82);
  --tx:oklch(0.215 0.022 48);--tx2:oklch(0.375 0.020 48);--txm:oklch(0.535 0.016 48);
  --ac:oklch(0.465 0.158 48);--ac-h:oklch(0.395 0.168 48);
  --ac-d:oklch(0.465 0.158 48 / .11);--ac-b:oklch(0.465 0.158 48 / .28);
  --ac-ink:oklch(0.965 0.016 82);
  --sh-sm:0 1px 3px oklch(0.2 0.02 48 / .10);
  --sh-md:0 4px 16px oklch(0.2 0.02 48 / .12);
  --sh-lg:0 12px 40px oklch(0.2 0.02 48 / .18);
  color-scheme:light;
}
.theme-sepia .prose-ed,.theme-sepia .bp-area{color:oklch(0.24 0.022 48)!important}

.theme-midnight{
  --bg:oklch(0.085 0.028 262);--bg-s:oklch(0.120 0.026 262);--bg-e:oklch(0.160 0.023 262);
  --bg-h:oklch(0.200 0.020 262);--bg-over:oklch(0.060 0.028 262 / .78);
  --bd:oklch(0.272 0.020 262);--bd-s:oklch(0.205 0.018 262);
  --ac:oklch(0.748 0.165 240);--ac-h:oklch(0.828 0.165 240);
  --ac-d:oklch(0.748 0.165 240 / .15);--ac-b:oklch(0.748 0.165 240 / .30);
  --ac-ink:oklch(0.080 0.028 262);
}

/* ▎ Body / global ─────────────────────────────────────────────────────── */

/* Force Scheherazade New for Arabic Unicode block in all writing areas —
   this works regardless of the element's dir attribute, so Arabic text typed
   inside an LTR chapter still renders with the correct Arabic font. */
@font-face {
  font-family: 'CrimsonPro';
  src: local('Crimson Pro');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                 U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193,
                 U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'CrimsonPro';
  src: local('Scheherazade New'), url('https://fonts.gstatic.com/s/scheherazadenew/v21/4navMSbUmcuDxm5SSVXS80WKGAO3hGZoUhkNBw.woff2') format('woff2');
  unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
}

body{
  background:var(--bg);color:var(--tx);
  font-family:var(--ff-ui);font-size:13px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  letter-spacing:0.01em;
}
[dir="rtl"] body,[dir="rtl"].theme-holder{font-family:var(--ff-ar)}
*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd-s);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--bd);background-clip:content-box;border:2px solid transparent}

/* Utility font helpers */
.fs{font-family:var(--ff-serif)}
.fa{font-family:var(--ff-ar)}
[dir="rtl"] .fs{font-family:var(--ff-ar-serif)}

/* Focus ring */
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:var(--r-xs)}
/* Rich editors have their own caret-color indication — suppress the focus outline
   so a distracting orange frame doesn't surround the whole writing area. */
.prose-ed:focus,.prose-ed:focus-visible,
.bp-area:focus,.bp-area:focus-visible,
.notes-area:focus,.notes-area:focus-visible,
.arc-ed:focus,.arc-ed:focus-visible{outline:none !important;box-shadow:none !important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--sh-glow)}

/* ▎ Animations ────────────────────────────────────────────────────────── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes pulseAc{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}

/* ▎ Home Screen ───────────────────────────────────────────────────────── */
.home{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:50;overflow:auto;animation:fadeIn .4s var(--e1)}
.home::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 700px 400px at 15% 0%,oklch(0.792 0.148 52 / 0.07) 0%,transparent 70%),
    radial-gradient(ellipse 500px 300px at 85% 100%,oklch(0.792 0.148 52 / 0.05) 0%,transparent 70%);
  pointer-events:none;z-index:0}
.home-top{position:relative;padding:22px 40px;display:flex;align-items:center;justify-content:space-between;z-index:1;border-bottom:1px solid var(--bd-s)}
.home-brand{display:flex;align-items:center;gap:14px}
.home-brand-mark{width:36px;height:36px;border-radius:10px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-family:var(--ff-serif);font-size:17px;font-weight:600;color:var(--ac-ink);box-shadow:var(--sh-md)}
.home-brand-text{display:flex;flex-direction:column}
.home-brand-name{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--tx)}
.home-brand-sub{font-size:10px;color:var(--txm);margin-top:1px;letter-spacing:.06em;text-transform:uppercase}
[dir="rtl"] .home-brand-name{font-family:var(--ff-ar)}
[dir="rtl"] .home-brand-sub{font-family:var(--ff-ar);text-transform:none;letter-spacing:0}
.home-top-actions{display:flex;gap:8px;align-items:center}

.pill{height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--bd-s);background:var(--bg-s);color:var(--tx2);font-size:11.5px;font-weight:500;cursor:pointer;transition:all var(--t-fast) var(--e1);display:inline-flex;align-items:center;gap:7px;letter-spacing:.01em}
.pill:hover{border-color:var(--ac);color:var(--ac);background:var(--ac-d)}
.pill svg{width:12px;height:12px}
[dir="rtl"] .pill{font-family:var(--ff-ar)}

.home-container{position:relative;max-width:1060px;margin:0 auto;padding:56px 40px 80px;width:100%;z-index:1;flex:1}
.home-hero{margin-bottom:52px;animation:fadeUp .5s var(--e1)}
.home-hero-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.home-hero-eyebrow::before{content:'';display:inline-block;width:28px;height:1.5px;background:var(--ac);border-radius:2px}
[dir="rtl"] .home-hero-eyebrow{font-family:var(--ff-ar);letter-spacing:0;text-transform:none}
[dir="rtl"] .home-hero-eyebrow::before{display:none}
[dir="rtl"] .home-hero-eyebrow::after{content:'';display:inline-block;width:28px;height:1.5px;background:var(--ac);border-radius:2px}
.home-hero-title{font-family:var(--ff-serif);font-size:clamp(34px,5vw,54px);font-weight:600;letter-spacing:-.03em;line-height:1.08;margin-bottom:18px;color:var(--tx)}
[dir="rtl"] .home-hero-title{font-family:var(--ff-ar-serif);font-weight:700;line-height:1.3}
.home-hero-sub{font-size:15px;color:var(--tx2);max-width:480px;line-height:1.7;font-weight:400}
[dir="rtl"] .home-hero-sub{font-family:var(--ff-ar);font-size:14.5px}

.home-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:0 2px}
.home-section-title{font-size:10.5px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;color:var(--txm)}
[dir="rtl"] .home-section-title{font-family:var(--ff-ar);letter-spacing:0;text-transform:none;font-size:12px}

/* Stats row — horizontal strip above project grid */
.home-stats{display:flex;align-items:center;gap:0;margin-bottom:44px;background:var(--bg-s);border:1px solid var(--bd-s);border-radius:var(--r-lg);overflow:hidden}
.home-stat{display:flex;flex-direction:column;gap:5px;padding:20px 28px;flex:1;border-right:1px solid var(--bd-s);transition:background var(--t-fast)}
.home-stat:last-child{border-right:none}
.home-stat:hover{background:var(--bg-e)}
.home-stat-v{font-family:var(--ff-serif);font-size:28px;font-weight:600;color:var(--tx);line-height:1;letter-spacing:-.03em}
.home-stat-l{font-size:10px;color:var(--txm);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
[dir="rtl"] .home-stat-l{font-family:var(--ff-ar);letter-spacing:0;text-transform:none;font-size:11.5px}

/* Project grid */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-bottom:48px}
.proj-card{background:var(--bg-s);border:1px solid var(--bd-s);border-radius:var(--r-lg);padding:22px;cursor:pointer;transition:all var(--t) var(--e1);display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;min-height:152px;animation:fadeUp .5s var(--e1) both}
.proj-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--ac-d) 0%,transparent 55%);opacity:0;transition:opacity var(--t)}
.proj-card:hover{border-color:var(--ac-b);transform:translateY(-4px);box-shadow:var(--sh-lg)}
.proj-card:hover::after{opacity:1}
/* Accent stripe on left */
.proj-card::before{content:'';position:absolute;top:0;inset-inline-start:0;width:3px;height:100%;background:var(--ac);opacity:0;transition:opacity var(--t)}
.proj-card:hover::before{opacity:0.7}
.proj-card-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}
.proj-card-emoji{width:46px;height:46px;border-radius:var(--r);background:var(--bg-e);display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform var(--t);border:1px solid var(--bd-s)}
.proj-card:hover .proj-card-emoji{transform:scale(1.06) rotate(-4deg)}
.proj-card-menu{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--txm);opacity:0;transition:all var(--t)}
.proj-card:hover .proj-card-menu{opacity:1}
.proj-card-menu:hover{background:var(--bg-h);color:var(--err)}
.proj-card-name{font-size:16px;font-weight:600;letter-spacing:-.02em;position:relative;z-index:1;color:var(--tx);line-height:1.2}
[dir="rtl"] .proj-card-name{font-family:var(--ff-ar-serif);font-size:18px;font-weight:700}
.proj-card-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--tx2);position:relative;z-index:1;margin-top:auto;flex-wrap:wrap}
.proj-card-meta b{color:var(--tx);font-weight:600}
.proj-card-meta-dot{width:2.5px;height:2.5px;border-radius:50%;background:var(--txm);opacity:.6}
[dir="rtl"] .proj-card-meta{font-family:var(--ff-ar);font-size:12px}
.proj-card-date{font-size:10px;color:var(--txm);letter-spacing:.01em}

.proj-card.new{border-style:dashed;border-color:var(--bd);background:transparent;align-items:center;justify-content:center;text-align:center}
.proj-card.new::after,.proj-card.new::before{display:none}
.proj-card.new:hover{border-color:var(--ac);background:var(--ac-d);transform:translateY(-4px);box-shadow:var(--sh-lg)}
.proj-card.new .proj-new-icon{width:48px;height:48px;border-radius:50%;background:var(--bg-e);display:flex;align-items:center;justify-content:center;color:var(--tx2);margin-bottom:10px;transition:all var(--t);border:1px solid var(--bd-s)}
.proj-card.new:hover .proj-new-icon{background:var(--ac);color:var(--ac-ink);transform:scale(1.08);border-color:transparent}
.proj-card.new .proj-new-label{font-size:13.5px;font-weight:600;color:var(--tx2);letter-spacing:-.01em}
[dir="rtl"] .proj-card.new .proj-new-label{font-family:var(--ff-ar)}

/* ▎ App layout ────────────────────────────────────────────────────────── */
.app{display:flex;height:100vh;width:100vw;overflow:hidden;animation:fadeIn .3s var(--e1)}
.sidebar{width:var(--sb-w);min-width:var(--sb-w);background:var(--bg-s);border-right:1px solid var(--bd-s);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
[dir="rtl"] .sidebar{border-right:none;border-left:1px solid var(--bd-s)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}

/* ▎ Sidebar sections ──────────────────────────────────────────────────── */
.sb-head{padding:16px 14px 14px;border-bottom:1px solid var(--bd-s);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-head-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;padding:6px;margin:-6px;border-radius:var(--r-sm);transition:background var(--t-fast)}
.sb-head-brand:hover{background:var(--bg-h)}
.logo-badge{width:30px;height:30px;border-radius:8px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-family:var(--ff-serif);font-size:15px;font-weight:700;color:var(--ac-ink);flex-shrink:0;box-shadow:var(--sh-sm)}
.logo-text{font-size:13px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.logo-sub{font-size:10px;color:var(--txm);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
[dir="rtl"] .logo-text,[dir="rtl"] .logo-sub{font-family:var(--ff-ar)}
.sb-icon-btn{width:28px;height:28px;border-radius:var(--r-sm);color:var(--txm);display:flex;align-items:center;justify-content:center;transition:all var(--t-fast);flex-shrink:0}
.sb-icon-btn:hover{background:var(--bg-h);color:var(--tx2)}
.sb-icon-btn svg{width:14px;height:14px}

/* ── Vertical nav (replaces old 4-column grid) ── */
.sb-nav{display:flex;flex-direction:column;gap:2px;padding:10px 8px 6px;flex-shrink:0;border-bottom:1px solid var(--bd-s)}
.nav-btn{display:flex;flex-direction:row;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--txm);font-size:12.5px;font-weight:500;letter-spacing:.005em;transition:all var(--t-fast);border:1px solid transparent;width:100%;text-align:left}
.nav-btn:hover{background:var(--bg-h);color:var(--tx2)}
.nav-btn.active{background:var(--ac-d);color:var(--ac);border-color:var(--ac-b)}
.nav-btn svg{width:15px;height:15px;flex-shrink:0;opacity:.8}
.nav-btn.active svg{opacity:1}
[dir="rtl"] .nav-btn{font-family:var(--ff-ar);font-size:13px;text-align:right}

.sb-search{padding:8px 10px;flex-shrink:0;position:relative}
.search-wrap{position:relative}
.search-icon{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--txm);pointer-events:none}
.search-input{width:100%;background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-sm);padding:7px 10px 7px 32px;color:var(--tx);font-size:12px;outline:none;transition:border-color var(--t-fast);font-family:var(--ff-ui)}
[dir="rtl"] .search-input{padding:7px 32px 7px 10px;font-family:var(--ff-ar)}
.search-input:focus{border-color:var(--ac);background:var(--bg-h)}
.search-input::placeholder{color:var(--txm)}

.sb-sec-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px;flex-shrink:0}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--txm)}
[dir="rtl"] .sec-lbl{font-family:var(--ff-ar);letter-spacing:0;text-transform:none;font-size:11.5px}
.add-btn{width:22px;height:22px;border-radius:var(--r-xs);color:var(--txm);display:flex;align-items:center;justify-content:center;transition:all var(--t-fast)}
.add-btn:hover{background:var(--bg-h);color:var(--ac)}
.add-btn svg{width:13px;height:13px}

.sb-list{flex:1;overflow-y:auto;padding:2px 8px 8px;display:flex;flex-direction:column;gap:1px;min-height:0}
.sb-list.empty-center{align-items:center;justify-content:center;padding:24px}
.sb-empty{text-align:center;color:var(--txm);font-size:11.5px;line-height:1.7;white-space:pre-line;padding:24px 8px}
[dir="rtl"] .sb-empty{font-family:var(--ff-ar);font-size:12.5px}

.li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;color:var(--tx2);transition:all var(--t-fast);border:1px solid transparent;min-width:0;position:relative}
.li:hover{background:var(--bg-h);color:var(--tx)}
.li.active{background:var(--ac-d);color:var(--ac);border-color:var(--ac-b)}
.li.dragging{opacity:.4}
.li.drag-over{box-shadow:inset 0 2px 0 var(--ac)}
.li-grip{width:14px;color:transparent;cursor:grab;flex-shrink:0}
.li:hover .li-grip{color:var(--txm)}
.li-grip:active{cursor:grabbing}
.li-grip svg{width:12px;height:12px}
.li-num{font-size:10px;color:var(--txm);font-variant-numeric:tabular-nums;width:18px;text-align:center;flex-shrink:0}
.li.active .li-num{color:var(--ac)}
.li-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-name{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
[dir="rtl"] .li-name{font-family:var(--ff-ar)}
.li-sub{font-size:10.5px;color:var(--txm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[dir="rtl"] .li-sub{font-family:var(--ff-ar)}
.li-edit{background:var(--bg-e);border:1px solid var(--ac);border-radius:var(--r-xs);padding:2px 6px;outline:none;color:var(--tx);font-size:12.5px;width:100%;min-width:0}
[dir="rtl"] .li-edit{font-family:var(--ff-ar)}
.li-meta{font-size:10px;color:var(--txm);flex-shrink:0;font-variant-numeric:tabular-nums}
.li-del{width:20px;height:20px;border-radius:var(--r-xs);color:transparent;display:flex;align-items:center;justify-content:center;transition:all var(--t-fast);flex-shrink:0}
.li:hover .li-del{color:var(--txm)}
.li-del:hover{background:var(--err-d);color:var(--err)!important}
.li-del svg{width:12px;height:12px}
.li-avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--ac-ink)}
.li-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Scene nested under chapter */
.li-scene{padding-inline-start:28px;font-size:12px}
.li-scene .li-name{font-size:12px;color:var(--txm)}
.li-scene.active .li-name{color:var(--ac)}
.li-scene::before{content:'';position:absolute;inset-inline-start:14px;top:0;bottom:0;width:1px;background:var(--bd-s)}

.sb-foot{padding:10px 12px;border-top:1px solid var(--bd-s);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px}
.foot-stat{font-size:10.5px;color:var(--txm);text-align:center;flex:1;line-height:1.35}
.foot-stat strong{color:var(--tx2);font-weight:600;font-variant-numeric:tabular-nums}
[dir="rtl"] .foot-stat{font-family:var(--ff-ar);font-size:11.5px}
.foot-lang{height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--bd-s);background:transparent;color:var(--txm);font-size:10.5px;cursor:pointer;transition:all var(--t-fast);font-family:var(--ff-ui)}
.foot-lang:hover{border-color:var(--ac);color:var(--ac)}

.foot-home-btn{
  height:30px;padding:0 12px;border-radius:var(--r-sm);
  border:1px solid var(--bd-s);background:var(--bg-e);
  color:var(--tx2);font-size:11.5px;font-weight:500;cursor:pointer;
  transition:all var(--t-fast);display:inline-flex;align-items:center;gap:6px;
  font-family:var(--ff-ui);letter-spacing:.01em;
}
.foot-home-btn:hover{border-color:var(--ac);color:var(--ac);background:var(--ac-d);transform:translateY(-1px);box-shadow:var(--sh-sm)}
.foot-home-btn:active{transform:translateY(0)}
.foot-home-btn svg{width:14px;height:14px}
[dir="rtl"] .foot-home-btn{font-family:var(--ff-ar);font-size:13px}

/* ▎ Toolbar ───────────────────────────────────────────────────────────── */
.toolbar{height:var(--th);min-height:var(--th);background:var(--bg-s);border-bottom:1px solid var(--bd-s);display:flex;align-items:center;padding:0 14px;gap:2px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tb-sep{width:1px;height:18px;background:var(--bd-s);margin:0 6px;flex-shrink:0;opacity:.7}
.tb-btn{height:26px;min-width:26px;padding:0 6px;border-radius:var(--r-xs);color:var(--tx2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.01em;gap:4px;transition:all var(--t-fast);white-space:nowrap;flex-shrink:0;font-family:var(--ff-ui)}
.tb-btn:hover{background:var(--bg-h);color:var(--tx)}
.tb-btn.on{background:var(--ac-d);color:var(--ac)}
.tb-btn:disabled{opacity:.35;cursor:not-allowed}
.tb-btn svg{width:13px;height:13px}
.tb-sel{height:26px;background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-xs);color:var(--tx2);font-size:11px;padding:0 22px 0 8px;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;font-family:var(--ff-ui)}
[dir="rtl"] .tb-sel{padding:0 8px 0 22px;font-family:var(--ff-ar)}
.tb-sel:focus{border-color:var(--ac)}
.tb-sel-wrap{position:relative;flex-shrink:0}
.tb-sel-wrap::after{content:'▾';position:absolute;inset-inline-end:7px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--txm);pointer-events:none}
.tb-space{flex:1;min-width:8px}
.tb-num{font-size:11px;color:var(--txm);min-width:22px;text-align:center;user-select:none;line-height:1;font-variant-numeric:tabular-nums}
.tb-step{height:22px;min-width:22px;padding:0 4px;border-radius:var(--r-xs);color:var(--txm);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all var(--t-fast)}
.tb-step:hover{background:var(--bg-h);color:var(--tx)}
.tb-group{display:flex;align-items:center;gap:1px}
.tb-theme-dot{width:13px;height:13px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:all var(--t-fast);flex-shrink:0}
.tb-theme-dot:hover{transform:scale(1.22)}
.tb-theme-dot.on{border-color:var(--ac);box-shadow:0 0 0 1.5px var(--bg-s) inset,0 0 0 3px var(--ac)}

.save-ind{font-size:10.5px;color:var(--txm);display:flex;align-items:center;gap:5px;padding:0 4px;white-space:nowrap}
[dir="rtl"] .save-ind{font-family:var(--ff-ar);font-size:11.5px}
.save-dot{width:5px;height:5px;border-radius:50%;background:var(--ac)}
.save-dot.saving{animation:pulseAc 1.2s var(--e2) infinite;background:var(--warn)}
.save-dot.saved{background:var(--ok)}

/* ▎ Editor ────────────────────────────────────────────────────────────── */
.ed-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ed-body{flex:1;display:flex;overflow:hidden;min-height:0}
.ed-scroll{flex:1;overflow-y:auto;padding:52px 64px 140px;scroll-behavior:smooth}
.ed-col{width:100%;max-width:none;margin:0}
.ed-col.wide{max-width:none}
.ch-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ch-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 10px;border-radius:999px;background:var(--bg-e);border:1px solid var(--bd-s);font-size:10.5px;color:var(--tx2);font-weight:500;letter-spacing:.01em}
[dir="rtl"] .ch-chip{font-family:var(--ff-ar)}
.ch-chip svg{width:10px;height:10px;color:var(--txm)}
.ch-chip-goal{cursor:pointer}
.ch-chip-goal:hover{border-color:var(--ac-b);color:var(--ac)}
.ch-chip.done{background:var(--ok-d);border-color:var(--ok);color:var(--ok)}

.ch-title{font-family:var(--ff-serif);font-size:33px;font-weight:600;color:var(--tx);background:transparent;border:none;border-bottom:1px solid transparent;outline:none;width:100%;margin-bottom:34px;line-height:1.2;padding-bottom:10px;transition:border-color var(--t);letter-spacing:-.025em}
.ch-title:hover,.ch-title:focus{border-bottom-color:var(--bd)}
.ch-title::placeholder{color:var(--txm)}
.ch-title[dir="rtl"]{font-family:var(--ff-ar-serif);text-align:right;font-weight:700;font-size:30px}

.prose-ed{font-family:'Lora','Scheherazade New',Georgia,serif;font-size:var(--fi);line-height:var(--lh);color:oklch(0.89 0.006 78);min-height:500px;outline:none;caret-color:var(--ac);text-wrap:pretty;word-break:break-word}
.prose-ed:empty::before{content:attr(data-ph);color:var(--txm);pointer-events:none;font-style:italic}
.prose-ed h1{font-family:var(--ff-serif);font-size:1.65em;font-weight:600;margin:1em 0 .35em;color:var(--tx);letter-spacing:-.01em}
.prose-ed h2{font-family:var(--ff-serif);font-size:1.3em;font-weight:600;margin:.85em 0 .3em;color:var(--tx)}
.prose-ed h3{font-family:var(--ff-serif);font-size:1.12em;font-weight:600;margin:.7em 0 .3em;color:var(--tx)}
.prose-ed blockquote{border-inline-start:3px solid var(--ac-b);padding-inline-start:20px;color:var(--tx2);font-style:italic;margin:.7em 0}
.prose-ed p{margin:.35em 0}
.prose-ed ul,.prose-ed ol{margin:.5em 0;padding-inline-start:1.8em}
.prose-ed li{margin:.15em 0}
.prose-ed hr{border:none;border-top:1px solid var(--bd-s);margin:1.4em 0}
.prose-ed a{color:var(--ac);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.prose-ed code{font-family:var(--ff-mono);font-size:.86em;background:var(--bg-e);padding:1px 6px;border-radius:4px}
.prose-ed[dir="rtl"]{font-family:var(--ff-ar-serif);text-align:right}
.theme-sepia .prose-ed{color:oklch(0.26 0.022 48)}

.ed-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--txm);padding:32px}
.ed-empty-icon{width:64px;height:64px;border-radius:50%;background:var(--bg-e);display:flex;align-items:center;justify-content:center;opacity:.55;border:1px solid var(--bd-s)}
.ed-empty-icon svg{width:28px;height:28px}
.ed-empty-title{font-size:15px;color:var(--tx2);font-weight:600;letter-spacing:-.01em}
[dir="rtl"] .ed-empty-title{font-family:var(--ff-ar)}
.ed-empty-sub{font-size:12.5px;color:var(--txm);text-align:center;max-width:320px;line-height:1.7}
[dir="rtl"] .ed-empty-sub{font-family:var(--ff-ar);font-size:13.5px}

/* Word-count progress footer */
.ed-foot{position:absolute;bottom:0;left:0;right:0;padding:10px 18px;background:linear-gradient(to top,var(--bg) 40%,transparent);display:flex;align-items:center;gap:16px;font-size:11px;color:var(--txm);pointer-events:none;z-index:2}
.ed-foot b{color:var(--tx2);font-weight:600;font-variant-numeric:tabular-nums}
[dir="rtl"] .ed-foot{font-family:var(--ff-ar);font-size:12px}
.ed-foot-prog{flex:1;max-width:220px;height:3px;border-radius:4px;background:var(--bg-e);overflow:hidden}
.ed-foot-prog-bar{height:100%;background:var(--ac);transition:width .4s var(--e1)}

/* Focus mode */
.focus-overlay{position:fixed;inset:0;z-index:140;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;animation:fadeIn .3s var(--e1)}
.focus-overlay .ed-scroll{padding:80px 80px 140px}
.focus-overlay .prose-ed{font-size:calc(var(--fi) + 2px)}
.focus-exit{position:fixed;top:14px;inset-inline-end:14px;height:30px;padding:0 13px;border-radius:999px;background:var(--bg-s);border:1px solid var(--bd);color:var(--tx2);font-size:11.5px;cursor:pointer;z-index:160;transition:all var(--t-fast);display:flex;align-items:center;gap:7px;box-shadow:var(--sh-sm)}
.focus-exit:hover{border-color:var(--ac);color:var(--ac)}
.focus-exit svg{width:11px;height:11px}

/* ▎ Character / Location / Event detail forms ────────────────────────── */
.detail-main{flex:1;overflow-y:auto;padding:44px 44px 80px}
.detail-form{max-width:720px;margin:0 auto;animation:fadeUp .22s var(--e1)}
.detail-title{font-family:var(--ff-serif);font-size:30px;font-weight:600;color:var(--tx);background:transparent;border:none;border-bottom:2px solid var(--bd-s);outline:none;width:100%;margin-bottom:28px;padding-bottom:10px;line-height:1.2;transition:border-color var(--t);letter-spacing:-.02em}
.detail-title:focus{border-bottom-color:var(--ac)}
.detail-title::placeholder{color:var(--txm)}
[dir="rtl"] .detail-title{font-family:var(--ff-ar-serif);font-weight:700;text-align:right}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg.full{grid-column:1/-1}
.fl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--txm)}
[dir="rtl"] .fl{font-family:var(--ff-ar);letter-spacing:0;font-size:11.5px;text-transform:none}
.fi-inp,.fi-sel,.fi-ta{background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-sm);padding:9px 11px;color:var(--tx);font-size:13px;outline:none;transition:border-color var(--t-fast),background var(--t-fast);width:100%;font-family:var(--ff-ui)}
[dir="rtl"] .fi-inp,[dir="rtl"] .fi-sel,[dir="rtl"] .fi-ta{font-family:var(--ff-ar);text-align:right;font-size:13.5px}
.fi-inp:focus,.fi-sel:focus,.fi-ta:focus{border-color:var(--ac);background:var(--bg-h)}
.fi-ta{resize:vertical;line-height:1.65;min-height:96px}
.fi-sel{-webkit-appearance:none;appearance:none;cursor:pointer;padding-inline-end:32px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%238a8077'><path d='M5.5 7.5l4.5 4.5 4.5-4.5'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:14px}
[dir="rtl"] .fi-sel{background-position:left 10px center}

.arc-ed{background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-sm);padding:11px 13px;min-height:130px;font-size:13px;color:var(--tx);line-height:1.7;outline:none;transition:border-color var(--t-fast)}
.arc-ed:focus{border-color:var(--ac)}
.arc-ed:empty::before{content:attr(data-ph);color:var(--txm);pointer-events:none}
[dir="rtl"] .arc-ed{font-family:var(--ff-ar);text-align:right;font-size:14px}

/* Color picker for avatars */
.color-row{display:flex;gap:6px;flex-wrap:wrap}
.color-dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform var(--t-fast)}
.color-dot:hover{transform:scale(1.15)}
.color-dot.on{border-color:var(--tx);box-shadow:0 0 0 1.5px var(--bg);transform:scale(1.12)}

/* Avatar big */
.avatar-xl{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;color:var(--ac-ink);flex-shrink:0}

.detail-head{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.detail-head-info{flex:1;min-width:0}
.detail-head-info .detail-title{margin-bottom:6px;border:none;padding:0}
.detail-head-info .meta{font-size:12px;color:var(--tx2)}
[dir="rtl"] .detail-head-info .meta{font-family:var(--ff-ar)}

/* Tags */
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;background:var(--bg-e);border:1px solid var(--bd-s);font-size:11px;color:var(--tx2);transition:all var(--t-fast)}
.tag:hover{border-color:var(--ac-b)}
.tag-remove{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--txm)}
.tag-remove:hover{color:var(--err);background:var(--err-d)}
.tag-remove svg{width:9px;height:9px}
.tag-add{height:24px;padding:0 10px;border-radius:999px;background:transparent;border:1px dashed var(--bd-s);color:var(--txm);font-size:11px;cursor:pointer;transition:all var(--t-fast)}
.tag-add:hover{border-color:var(--ac);color:var(--ac);border-style:solid}
[dir="rtl"] .tag,[dir="rtl"] .tag-add{font-family:var(--ff-ar);font-size:12px}

/* Relations */
.rel-list{display:flex;flex-direction:column;gap:8px}
.rel-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-sm)}
.rel-item-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--ac-ink);flex-shrink:0}
.rel-item-name{font-size:12.5px;flex-shrink:0}
[dir="rtl"] .rel-item-name{font-family:var(--ff-ar)}
.rel-item-sel{flex:1}
.rel-item-del{color:var(--txm);width:22px;height:22px;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;transition:all var(--t-fast)}
.rel-item-del:hover{color:var(--err);background:var(--err-d)}
.rel-add{display:flex;gap:8px;margin-top:4px}

/* Goals progress bar */
.goal-bar{height:6px;border-radius:4px;background:var(--bg-e);overflow:hidden;margin-top:6px}
.goal-bar-fill{height:100%;background:var(--ac);border-radius:4px;transition:width .4s var(--e1)}
.goal-bar-fill.done{background:var(--ok)}

/* ▎ Blueprint tabs ───────────────────────────────────────────────────── */
.bp-tabs{height:var(--th);min-height:var(--th);background:var(--bg-s);border-bottom:1px solid var(--bd-s);display:flex;align-items:flex-end;padding:0 24px;flex-shrink:0;gap:2px;overflow-x:auto;scrollbar-width:none}
.bp-tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:0 18px;height:36px;border-radius:var(--r-sm) var(--r-sm) 0 0;color:var(--txm);font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all var(--t-fast);letter-spacing:.01em;white-space:nowrap;font-family:var(--ff-ui)}
.tab-btn:hover{color:var(--tx2)}
.tab-btn.active{color:var(--ac);border-bottom-color:var(--ac)}
[dir="rtl"] .tab-btn{font-family:var(--ff-ar);font-size:13.5px}
.bp-scroll{flex:1;overflow-y:auto;padding:48px 44px 80px}
.bp-area{max-width:none;margin:0;font-family:'Lora',var(--ff-serif);font-size:18px;line-height:1.85;color:oklch(0.89 0.006 78);min-height:420px;outline:none;caret-color:var(--ac);text-wrap:pretty}
.bp-area:empty::before{content:attr(data-ph);color:var(--txm);pointer-events:none;font-style:italic}
.bp-area h1,.bp-area h2,.bp-area h3{font-family:var(--ff-serif);color:var(--tx);font-weight:600}
.bp-area h1{font-size:1.5em;margin:.9em 0 .35em}
.bp-area h2{font-size:1.25em;margin:.75em 0 .3em}
.bp-area h3{font-size:1.1em;margin:.6em 0 .25em}
.bp-area ul,.bp-area ol{margin:.5em 0;padding-inline-start:1.7em}
.bp-area li{margin:.2em 0}
.bp-area blockquote{border-inline-start:3px solid var(--ac-b);padding-inline-start:18px;color:var(--tx2);font-style:italic;margin:.6em 0}
[dir="rtl"] .bp-area{font-family:var(--ff-ar-serif);text-align:right;font-size:17px}
.theme-sepia .bp-area{color:oklch(0.26 0.022 48)}

/* ▎ Timeline ──────────────────────────────────────────────────────────── */
.timeline-wrap{padding:40px 40px 80px;max-width:820px;margin:0 auto}
.tl-item{display:flex;gap:14px;padding:14px;background:var(--bg-s);border:1px solid var(--bd-s);border-radius:var(--r);margin-bottom:10px;transition:all var(--t-fast);cursor:pointer;animation:fadeUp .25s var(--e1) both}
.tl-item:hover{border-color:var(--ac-b);transform:translateX(2px)}
[dir="rtl"] .tl-item:hover{transform:translateX(-2px)}
.tl-item.active{border-color:var(--ac);background:var(--ac-d)}
.tl-bullet{width:36px;height:36px;border-radius:var(--r-sm);background:var(--bg-e);display:flex;align-items:center;justify-content:center;color:var(--tx2);flex-shrink:0;font-weight:600;font-size:13px}
.tl-item.active .tl-bullet{background:var(--ac);color:var(--ac-ink)}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:4px}
[dir="rtl"] .tl-title{font-family:var(--ff-ar)}
.tl-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--txm);flex-wrap:wrap}
[dir="rtl"] .tl-meta{font-family:var(--ff-ar);font-size:12px}
.tl-desc{font-size:12.5px;color:var(--tx2);margin-top:6px;line-height:1.6}
[dir="rtl"] .tl-desc{font-family:var(--ff-ar);font-size:13.5px}

/* ▎ Notes view ───────────────────────────────────────────────────────── */
.notes-wrap{flex:1;overflow-y:auto;padding:44px 40px 80px}
.notes-area{max-width:none;margin:0;font-family:var(--ff-serif);font-size:17px;line-height:1.85;color:oklch(0.88 0.006 75);min-height:420px;outline:none;caret-color:var(--ac)}
.notes-area:empty::before{content:attr(data-ph);color:var(--txm);pointer-events:none;font-style:italic}
[dir="rtl"] .notes-area{font-family:var(--ff-ar-serif);text-align:right;font-size:16px}
.theme-sepia .notes-area{color:oklch(0.26 0.022 50)}

/* ▎ Stats view ───────────────────────────────────────────────────────── */
.stats-wrap{flex:1;overflow-y:auto;padding:44px}
.stats-container{max-width:900px;margin:0 auto}
.stats-head{margin-bottom:32px}
.stats-title{font-family:var(--ff-serif);font-size:30px;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}
[dir="rtl"] .stats-title{font-family:var(--ff-ar-serif);font-weight:700}
.stats-sub{font-size:13px;color:var(--tx2)}
[dir="rtl"] .stats-sub{font-family:var(--ff-ar);font-size:14px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:28px}
.stat-card{background:var(--bg-s);border:1px solid var(--bd-s);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:7px;transition:all var(--t-fast)}
.stat-card:hover{border-color:var(--bd);background:var(--bg-e)}
.stat-card-v{font-family:var(--ff-serif);font-size:32px;font-weight:600;line-height:1;letter-spacing:-.03em}
.stat-card-l{font-size:10px;color:var(--txm);font-weight:700;letter-spacing:.09em;text-transform:uppercase}
[dir="rtl"] .stat-card-l{font-family:var(--ff-ar);letter-spacing:0;text-transform:none;font-size:12.5px}
.stat-card-hint{font-size:11px;color:var(--tx2);margin-top:2px}
[dir="rtl"] .stat-card-hint{font-family:var(--ff-ar);font-size:12px}

.goal-card{background:var(--bg-s);border:1px solid var(--bd-s);border-radius:var(--r);padding:20px;margin-bottom:20px}
.goal-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.goal-card-title{font-size:14px;font-weight:600}
[dir="rtl"] .goal-card-title{font-family:var(--ff-ar);font-size:15px}
.goal-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.goal-lbl{font-size:12px;color:var(--tx2);min-width:90px}
[dir="rtl"] .goal-lbl{font-family:var(--ff-ar);font-size:13px}
.goal-num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--tx)}
.goal-pct{font-size:12px;color:var(--ac);font-weight:600;font-variant-numeric:tabular-nums}

.streak-days{display:flex;gap:4px;flex-wrap:wrap}
.streak-day{width:22px;height:22px;border-radius:var(--r-xs);background:var(--bg-e);border:1px solid var(--bd-s);display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--txm);font-variant-numeric:tabular-nums}
.streak-day.has{background:var(--ac-d);border-color:var(--ac-b);color:var(--ac)}
.streak-day.full{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.streak-day.today{box-shadow:0 0 0 1.5px var(--ac) inset}

/* ▎ Settings ─────────────────────────────────────────────────────────── */
.set-wrap{flex:1;overflow-y:auto;padding:44px}
.set-container{max-width:640px;margin:0 auto}
.set-group{background:var(--bg-s);border:1px solid var(--bd-s);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px}
.set-group-title{font-size:10px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--txm);margin-bottom:14px}
[dir="rtl"] .set-group-title{font-family:var(--ff-ar);letter-spacing:0;text-transform:none;font-size:12.5px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;gap:16px;border-top:1px solid var(--bd-s)}
.set-row:first-of-type{border-top:none;padding-top:0}
.set-row-label{flex:1;min-width:0}
.set-row-title{font-size:13px;font-weight:500;color:var(--tx);letter-spacing:-.01em}
[dir="rtl"] .set-row-title{font-family:var(--ff-ar);font-size:14px}
.set-row-sub{font-size:11.5px;color:var(--txm);margin-top:2px;line-height:1.5}
[dir="rtl"] .set-row-sub{font-family:var(--ff-ar);font-size:12.5px}
.set-row-control{display:flex;align-items:center;gap:8px;flex-shrink:0}

.seg{display:inline-flex;background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg-btn{height:25px;padding:0 11px;border-radius:var(--r-xs);color:var(--tx2);font-size:11px;font-weight:500;transition:all var(--t-fast);font-family:var(--ff-ui)}
.seg-btn.on{background:var(--ac-d);color:var(--ac)}
.seg-btn:hover:not(.on){background:var(--bg-h);color:var(--tx)}
[dir="rtl"] .seg-btn{font-family:var(--ff-ar);font-size:12.5px}

input[type=range].slider{-webkit-appearance:none;appearance:none;width:140px;height:4px;background:var(--bg-e);border-radius:4px;outline:none;cursor:pointer}
input[type=range].slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ac);cursor:pointer;box-shadow:0 0 0 1.5px var(--bg-s)}
input[type=range].slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ac);cursor:pointer;border:none}

/* Buttons */
.btn{height:30px;padding:0 14px;border-radius:var(--r-sm);background:var(--bg-e);border:1px solid var(--bd-s);color:var(--tx);font-size:12px;font-weight:500;cursor:pointer;transition:all var(--t-fast);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--ff-ui)}

.btn svg{width:13px;height:13px}
.btn-primary{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.btn-primary:hover{background:var(--ac-h);border-color:var(--ac-h)}
.btn-danger{color:var(--err)}
.btn-danger:hover{background:var(--err-d);border-color:var(--err)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn-ghost:hover{background:var(--bg-h);color:var(--tx)}
[dir="rtl"] .btn{font-family:var(--ff-ar);font-size:13px}

/* ▎ Modal ────────────────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:var(--bg-over);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s var(--e1)}
.modal{background:var(--bg-s);border:1px solid var(--bd);border-radius:var(--r-xl);padding:28px;max-width:440px;width:100%;box-shadow:var(--sh-xl);animation:scaleIn .22s var(--e1)}
.modal.wide{max-width:640px}
.modal-head{margin-bottom:16px}
.modal-title{font-family:var(--ff-serif);font-size:21px;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}
[dir="rtl"] .modal-title{font-family:var(--ff-ar-serif);font-weight:700;font-size:22px}
.modal-sub{font-size:13px;color:var(--tx2);line-height:1.6}
[dir="rtl"] .modal-sub{font-family:var(--ff-ar);font-size:14px}
.modal-body{margin-bottom:20px;display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

/* Emoji picker */
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:180px;overflow-y:auto;padding:4px;background:var(--bg-e);border-radius:var(--r-sm)}
.emoji-btn{height:32px;border-radius:var(--r-xs);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all var(--t-fast)}
.emoji-btn:hover{background:var(--bg-h)}
.emoji-btn.on{background:var(--ac-d);box-shadow:0 0 0 1px var(--ac) inset}

/* ▎ Responsive ───────────────────────────────────────────────────────── */

  .sidebar{position:fixed;inset:0 auto 0 0;z-index:100;transform:translateX(-100%);transition:transform var(--t) var(--e1);box-shadow:var(--sh-xl)}

  .ed-scroll{padding:32px 24px 100px}

  .home-top{padding:16px 20px}
  .home-grid{grid-template-columns:1fr}

/* ▎ Scrollbar hide util ──────────────────────────────────────────────── */

/* ▎ Misc ─────────────────────────────────────────────────────────────── */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.spinner{width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
.divider{height:1px;background:var(--bd-s);margin:0 12px}
.kbd{display:inline-block;font-family:var(--ff-mono);font-size:10.5px;background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-xs);padding:1px 5px;color:var(--tx2);min-width:18px;text-align:center}
/* Writing area uses the serif/arabic vars — fonts are applied inline per selection via execCommand */
/* Ensure wrapped SVG icons size to their container */
.search-wrap > span > svg{width:100%;height:100%}

/* Collapsible sidebar */
.sidebar{transition:width .25s var(--e1),min-width .25s var(--e1),border-color .2s,opacity .2s}

.sidebar-fab{
  position:fixed;top:14px;inset-inline-start:14px;
  width:32px;height:32px;border-radius:9px;
  background:var(--bg-s);border:1px solid var(--bd);

  cursor:pointer;z-index:90;
  transition:all .2s var(--e1);
  box-shadow:var(--sh-md);
  animation:fadeIn .22s var(--e1)
}
.sidebar-fab:hover{color:var(--ac);border-color:var(--ac);background:var(--ac-d);transform:scale(1.06)}

/* ── Extra polish ─────────────────────────────────────────────────── */
/* Subtle top gradient on the home hero */

/* Kind chooser cards */

}
@media (max-width:480px){.kind-chooser{grid-template-columns:1fr}}
.kind-card{
  background:var(--bg-e);border:2px solid var(--bd-s);border-radius:var(--r-lg);
  padding:22px 16px;cursor:pointer;text-align:center;
  transition:all var(--t) var(--e1);display:flex;flex-direction:column;gap:10px;align-items:center;
}
.kind-card:hover{border-color:var(--ac);background:var(--ac-d);transform:translateY(-2px)}
.kind-card.on{border-color:var(--ac);background:var(--ac-d);box-shadow:var(--sh-md)}
.kind-card-icon{font-size:36px;line-height:1}
.kind-card-title{font-size:15px;font-weight:700;color:var(--tx);font-family:var(--ff-serif);letter-spacing:-.01em}
[dir="rtl"] .kind-card-title{font-family:var(--ff-ar-serif);font-size:16px}
.kind-card-desc{font-size:11.5px;color:var(--tx2);line-height:1.6}
[dir="rtl"] .kind-card-desc{font-family:var(--ff-ar);font-size:12.5px}

/* Toast */
.toast-stack{position:fixed;top:16px;inset-inline-end:16px;display:flex;flex-direction:column;gap:8px;z-index:400;pointer-events:none;max-width:340px}
.toast{background:var(--bg-s);border:1px solid var(--bd);border-radius:var(--r);padding:11px 14px;box-shadow:var(--sh-lg);display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--tx);pointer-events:auto;animation:slideInRight .28s var(--e1)}
[dir="rtl"] .toast{animation-name:slideInLeft;font-family:var(--ff-ar);font-size:13.5px}
.toast.success{border-color:var(--ok);background:var(--ok-d)}
.toast.error{border-color:var(--err);background:var(--err-d)}
.toast.info{border-color:var(--info);background:var(--info-d)}
.toast-icon{width:17px;height:17px;flex-shrink:0;margin-top:1px}
.toast-body{flex:1;line-height:1.5}
.toast-close{color:var(--txm);width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-xs);flex-shrink:0}
.toast-close:hover{color:var(--tx);background:var(--bg-h)}

/* Command palette */
.cmdp-overlay{position:fixed;inset:0;background:var(--bg-over);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:14vh 20px 20px;animation:fadeIn .15s var(--e1)}
.cmdp{background:var(--bg-s);border:1px solid var(--bd);border-radius:var(--r-xl);width:100%;max-width:560px;overflow:hidden;box-shadow:var(--sh-xl);animation:scaleIn .18s var(--e1);display:flex;flex-direction:column;max-height:70vh}
.cmdp-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd-s)}
.cmdp-head svg{width:15px;height:15px;color:var(--tx2);flex-shrink:0}
.cmdp-input{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font-size:14px;font-family:var(--ff-ui)}
[dir="rtl"] .cmdp-input{font-family:var(--ff-ar);font-size:15px}
.cmdp-input::placeholder{color:var(--txm)}
.cmdp-kbd{font-size:10px;color:var(--txm);background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-xs);padding:2px 6px;font-family:var(--ff-mono)}
.cmdp-list{flex:1;overflow-y:auto;padding:4px}
.cmdp-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;color:var(--tx2);transition:background var(--t-fast)}
.cmdp-item:hover,.cmdp-item.on{background:var(--ac-d);color:var(--ac)}
.cmdp-item svg{width:14px;height:14px;flex-shrink:0}
.cmdp-item-body{flex:1;min-width:0}
.cmdp-item-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[dir="rtl"] .cmdp-item-title{font-family:var(--ff-ar);font-size:14px}
.cmdp-item-sub{font-size:10.5px;color:var(--txm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[dir="rtl"] .cmdp-item-sub{font-family:var(--ff-ar);font-size:11.5px}
.cmdp-item-kbd{font-size:10px;color:var(--txm);background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-xs);padding:2px 5px;font-family:var(--ff-mono);flex-shrink:0}
.cmdp-group-label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--txm);padding:10px 12px 4px}
[dir="rtl"] .cmdp-group-label{font-family:var(--ff-ar);letter-spacing:0;text-transform:none;font-size:11.5px}
.cmdp-empty{text-align:center;padding:28px 16px;color:var(--txm);font-size:12.5px}
[dir="rtl"] .cmdp-empty{font-family:var(--ff-ar);font-size:13.5px}

/* ═══════════════════════════════════════════════════════════════════════════
   SCREENPLAY MODE — page layout & elements
   ───────────────────────────────────────────────────────────────────────────
   The page is sized like a US Letter (8.5" × 11") scaled to screen.
   Courier New is monospace: 10 characters per inch at 12pt.
   All indents are expressed in `ch` units (character widths) for accuracy.
   Left margin  = 1.5" = 15 ch (for hole punch)
   Right limit  = 7.5" = 75 ch
   Character    = 3.7" from paper edge → 2.2" (22 ch) from left margin
   Parenthetical= 3.1" from paper edge → 1.6" (16 ch) from left margin
   Dialogue     = 2.5" from paper edge → 1.0" (10 ch) from left margin
   Transition   = right-aligned within the 60-ch text area
═══════════════════════════════════════════════════════════════════════════ */

.sp-wrap{background:var(--bg)}
.sp-wrap .ed-scroll{padding:48px 56px 140px;display:block}

/* The "page" container — full-width, borderless, like the novel editor.
   Keeps Courier monospace font for industry-standard screenplay formatting,
   but removes the bordered "paper" frame so writing fills the screen. */
.sp-page{
  width:100%;
  max-width:none;
  margin:0;
  background:transparent;
  border:none;
  border-radius:0;
  padding:0;
  font-family: 'Courier New', 'Courier Prime', Courier, monospace;
  font-size:15px;
  line-height:1.5;
  color: oklch(0.92 0.004 75);
  min-height:500px;
  box-shadow:none;
  position:relative;
}
.theme-sepia .sp-page{color:oklch(0.18 0.02 50)}

[dir="rtl"] .sp-page{font-family:'Courier New', 'Amiri', monospace}

/* Mobile padding tweaks */
@media (max-width: 768px){
  .sp-wrap .ed-scroll{padding:32px 24px 100px}
}

/* Each line row */
.sp-line{
  position:relative;
  display:flex;
  align-items:flex-start;
  margin:0;
  padding:1px 0;
  transition: background var(--t-fast), margin var(--t-fast);
}
.sp-line.active{background: var(--ac-d);border-radius:3px}

/* Element type label — shown only on hover/active, left margin */
.sp-type-label{
  position:absolute;
  inset-inline-start:-4px;
  transform: translateX(-100%);
  top:3px;
  font-family: var(--ff-ui);
  font-size:9px;
  font-weight:600;
  color:var(--txm);
  text-transform:uppercase;
  letter-spacing:.05em;
  white-space:nowrap;
  opacity:0;
  transition: opacity var(--t-fast);
  padding:2px 6px;
  background:var(--bg-e);
  border-radius:3px;
  pointer-events:none;
}
[dir="rtl"] .sp-type-label{transform:translateX(100%)}
.sp-line:hover .sp-type-label, .sp-line.active .sp-type-label{opacity:.8}

/* Textarea styling — inherit font from page */
.sp-input{
  background: transparent;
  border: none;
  outline: none;
  color: inherit;
  font-family: inherit;
  font-size: inherit;
  line-height: inherit;
  width: 100%;
  resize: none;
  overflow: hidden;
  padding: 0;
  margin: 0;
  display: block;
}
.sp-input:focus{outline:none}
.sp-input::placeholder{color:var(--txm);font-style:italic}

/* ▎ Element indents ──────────────────────────────────────────────────── */

/* Scene Heading — 0 indent from left margin, UPPERCASE, bold */
.sp-scene .sp-input{
  text-transform: uppercase;
  font-weight:700;
  letter-spacing:0.02em;
  color:var(--ac);
}
.sp-scene{margin-top:1.2em}
.sp-scene:first-child{margin-top:0}

/* Action — 0 indent, normal */
.sp-action{margin:.3em 0}
.sp-action .sp-input{
  color: oklch(0.88 0.006 75);
}
.theme-sepia .sp-action .sp-input{color:oklch(0.22 0.022 50)}

/* Character — indent 22ch (2.2") from left margin, UPPERCASE */
.sp-character{margin-top:.8em}
.sp-character .sp-input{
  padding-inline-start: 22ch;
  text-transform: uppercase;
  font-weight:600;
}
/* For narrower screens, scale down the indent */
@media (max-width: 700px){
  .sp-character .sp-input{padding-inline-start: 12ch}
}

/* Parenthetical — indent 16ch (1.6") from left margin */
.sp-paren .sp-input{
  padding-inline-start: 16ch;
  color: var(--tx2);
  font-style: italic;
}
@media (max-width: 700px){
  .sp-paren .sp-input{padding-inline-start: 9ch}
}

/* Dialogue — indent 10ch (1.0") from left margin, narrower column */
.sp-dialogue .sp-input{
  padding-inline-start: 10ch;
  padding-inline-end: 10ch;
  max-width: 100%;
}
.sp-dialogue{margin-bottom:.4em}
@media (max-width: 700px){
  .sp-dialogue .sp-input{padding-inline-start: 4ch;padding-inline-end: 4ch}
}

/* Transition — right-aligned, UPPERCASE */
.sp-transition{margin:.8em 0}
.sp-transition .sp-input{
  text-align: end;
  text-transform: uppercase;
  font-weight:600;
  color: var(--ac);
}
[dir="rtl"] .sp-transition .sp-input{text-align: start}

/* ▎ Autocomplete suggestions ─────────────────────────────────────────── */
.sp-suggest{
  position:absolute;
  top: calc(100% + 2px);
  inset-inline-start: 22ch;
  background:var(--bg-e);
  border:1px solid var(--bd);
  border-radius:var(--r-sm);
  padding:4px;
  min-width:180px;
  max-width: 340px;
  z-index:30;
  box-shadow:var(--sh-lg);
  font-family: var(--ff-ui);
  font-size:12px;
}
.sp-scene + .sp-suggest, .sp-line.sp-scene .sp-suggest{inset-inline-start:0}
.sp-line.sp-character .sp-suggest{inset-inline-start: 22ch}
.sp-suggest-item{
  padding:6px 10px;
  border-radius:var(--r-xs);
  cursor:pointer;
  color:var(--tx2);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family: 'Courier New', monospace;
  text-transform:uppercase;
}
.sp-suggest-item:hover, .sp-suggest-item.on{background:var(--ac-d);color:var(--ac)}
.sp-suggest-hint{
  padding:4px 10px 2px;
  font-size:10px;
  color:var(--txm);
  border-top:1px solid var(--bd-s);
  margin-top:2px;
}

/* Add line button */
.sp-add-line{
  margin-top:1em;
  padding:8px 16px;
  border:1px dashed var(--bd-s);
  border-radius:var(--r-sm);
  color:var(--txm);
  font-size:11px;
  font-family:var(--ff-ui);
  background:transparent;
  cursor:pointer;
  transition: all var(--t-fast);
  display:block;
  width:100%;
  text-align:center;
}
.sp-add-line:hover{border-color:var(--ac);color:var(--ac)}

/* Scene synopsis input inside screenplay sidebar */
.sp-scene-syn{
  display:block;width:100%;margin-top:3px;
  background:transparent;border:none;outline:none;
  font-size:10.5px;color:var(--tx2);padding:2px 0;font-style:italic;
  font-family:var(--ff-ui);
}
[dir="rtl"] .sp-scene-syn{font-family:var(--ff-ar);font-size:11.5px}
.sp-scene-syn::placeholder{color:var(--txm);opacity:.6}
.sp-scene-syn:focus{color:var(--tx)}
.sp-scene-min{font-size:9.5px;color:var(--txm);margin-top:2px}
[dir="rtl"] .sp-scene-min{font-family:var(--ff-ar);font-size:10.5px}

/* ▎ Pixel Icon Editor — 8×8 custom project icons ─────────────────────── */
.pix-editor{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.pix-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:var(--bd-s);padding:1px;border-radius:var(--r-sm);width:208px;height:208px;user-select:none;touch-action:none}
.pix-cell{background:var(--bg-e);cursor:crosshair;transition:filter var(--t-fast);position:relative}
.pix-cell:hover{filter:brightness(1.3)}
.pix-cell.filled:hover{filter:brightness(0.85)}
.pix-side{flex:1;min-width:180px;display:flex;flex-direction:column;gap:12px}
.pix-palette{display:flex;gap:5px;flex-wrap:wrap}
.pix-swatch{width:28px;height:28px;border-radius:6px;border:2px solid var(--bd-s);cursor:pointer;transition:all var(--t-fast);position:relative}
.pix-swatch:hover{transform:scale(1.08);border-color:var(--tx2)}
.pix-swatch.on{border-color:var(--tx);box-shadow:0 0 0 1.5px var(--bg-s) inset,var(--sh-md);transform:scale(1.08)}
.pix-swatch.eraser{background:repeating-linear-gradient(45deg,var(--bg-e) 0 4px,var(--bd-s) 4px 8px)}
.pix-tools{display:flex;gap:6px;flex-wrap:wrap}
.pix-tool-btn{height:28px;padding:0 10px;border-radius:var(--r-xs);border:1px solid var(--bd-s);background:transparent;color:var(--tx2);font-size:11px;cursor:pointer;transition:all var(--t-fast)}
.pix-tool-btn:hover{border-color:var(--ac);color:var(--ac)}
[dir="rtl"] .pix-tool-btn{font-family:var(--ff-ar);font-size:12px}
.pix-preview{display:flex;align-items:center;gap:10px;margin-top:4px}
.pix-preview-lbl{font-size:10.5px;color:var(--txm);letter-spacing:.04em;text-transform:uppercase}
[dir="rtl"] .pix-preview-lbl{font-family:var(--ff-ar);letter-spacing:0;text-transform:none;font-size:12px}
.pix-preview-canvas{width:48px;height:48px;border:1px solid var(--bd-s);border-radius:var(--r-sm);overflow:hidden;background:var(--bg-e)}
.pix-preview-small{width:28px;height:28px;border-radius:var(--r-xs);overflow:hidden;background:var(--bg-e);flex-shrink:0}
.pix-hint{font-size:11px;color:var(--txm);line-height:1.5}
[dir="rtl"] .pix-hint{font-family:var(--ff-ar);font-size:12px}

/* Icon mode toggle */
.icon-mode-seg{display:inline-flex;background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-sm);padding:2px;gap:2px;margin-bottom:8px}
.icon-mode-seg .seg-btn{padding:0 14px}

/* ▎ Session stats & Sprint mode ──────────────────────────────────────── */
.session-card{margin-top:10px;padding:12px 14px;background:var(--ac-d);border:1px solid var(--ac-b);border-radius:var(--r);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.session-stat{display:flex;flex-direction:column;gap:2px;min-width:70px}
.session-stat-v{font-family:var(--ff-serif);font-size:18px;font-weight:600;color:var(--ac);line-height:1;font-variant-numeric:tabular-nums}
.session-stat-l{font-size:10px;color:var(--tx2);letter-spacing:.04em;text-transform:uppercase}
[dir="rtl"] .session-stat-l{font-family:var(--ff-ar);letter-spacing:0;text-transform:none;font-size:11px}

/* Sprint overlay — floating pill in top corner during an active sprint */
.sprint-pill{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:var(--bg-s);border:1px solid var(--ac);border-radius:999px;
  padding:8px 16px;display:flex;align-items:center;gap:12px;
  z-index:150;box-shadow:var(--sh-lg);
  font-size:13px;color:var(--tx);
  animation:fadeDown .3s var(--e1);
}
.sprint-pill-time{font-family:var(--ff-mono);font-weight:600;color:var(--ac);font-variant-numeric:tabular-nums;min-width:54px;text-align:center}
.sprint-pill-prog{flex:1;min-width:90px;height:4px;border-radius:2px;background:var(--bg-e);overflow:hidden}
.sprint-pill-prog-bar{height:100%;background:var(--ac);transition:width 1s linear}
.sprint-pill-stop{background:transparent;border:none;color:var(--tx2);cursor:pointer;padding:2px 4px;border-radius:var(--r-xs)}
.sprint-pill-stop:hover{color:var(--err);background:var(--err-d)}
.sprint-pill-stop svg{width:13px;height:13px}
[dir="rtl"] .sprint-pill{font-family:var(--ff-ar)}

/* ▎ Find & Replace panel ─────────────────────────────────────────────── */
.fr-panel{
  position:fixed;
  top:16px;
  inset-inline-end:16px;
  width:340px;
  max-width:calc(100vw - 32px);
  background:var(--bg-s);
  border:1px solid var(--bd);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-xl);
  z-index:250;
  padding:12px;
  animation:fadeDown .2s var(--e1);
}
.fr-row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.fr-row:last-child{margin-bottom:0}
.fr-inp{flex:1;background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-sm);padding:7px 10px;font-size:12.5px;color:var(--tx);outline:none;font-family:var(--ff-ui);min-width:0}
[dir="rtl"] .fr-inp{font-family:var(--ff-ar);font-size:13.5px}
.fr-inp:focus{border-color:var(--ac)}
.fr-btn{height:28px;padding:0 10px;border-radius:var(--r-xs);border:1px solid var(--bd-s);background:transparent;color:var(--tx2);font-size:11px;cursor:pointer;transition:all var(--t-fast);flex-shrink:0}
.fr-btn:hover{border-color:var(--ac);color:var(--ac)}
.fr-btn.primary{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.fr-btn.primary:hover{background:var(--ac-h)}
[dir="rtl"] .fr-btn{font-family:var(--ff-ar);font-size:12px}
.fr-close{width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;border:none;color:var(--txm)}
.fr-close:hover{color:var(--tx);background:var(--bg-h);border-radius:var(--r-xs)}
.fr-info{font-size:11px;color:var(--txm);margin-inline-start:4px}
[dir="rtl"] .fr-info{font-family:var(--ff-ar);font-size:12px}
.fr-toggle{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2);cursor:pointer;user-select:none;padding:3px 6px;border-radius:var(--r-xs)}
.fr-toggle:hover{background:var(--bg-h)}
.fr-toggle.on{background:var(--ac-d);color:var(--ac)}
[dir="rtl"] .fr-toggle{font-family:var(--ff-ar);font-size:12px}
.fr-toggle input{margin:0;accent-color:var(--ac)}
::highlight(riw-find){background:oklch(0.85 0.18 80 / .4);color:inherit}
::highlight(riw-find-active){background:var(--ac);color:var(--ac-ink)}

/* ▎ Snapshot (version history) list ──────────────────────────────────── */.snap-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.snap-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg-e);border:1px solid var(--bd-s);border-radius:var(--r-sm);transition:border-color var(--t-fast)}
.snap-row:hover{border-color:var(--bd)}
.snap-ic{min-width:38px;height:28px;padding:0 6px;border-radius:var(--r-xs);background:var(--ac-d);color:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.snap-ic svg{width:14px;height:14px}
.snap-body{flex:1;min-width:0}
.snap-title{font-size:12.5px;font-weight:500;color:var(--tx);font-variant-numeric:tabular-nums}
[dir="rtl"] .snap-title{font-family:var(--ff-ar)}
.snap-meta{font-size:10.5px;color:var(--txm);margin-top:1px}
[dir="rtl"] .snap-meta{font-family:var(--ff-ar);font-size:11.5px}
.snap-acts{display:flex;gap:4px;flex-shrink:0}
.snap-btn{height:26px;padding:0 10px;border-radius:var(--r-xs);background:transparent;border:1px solid var(--bd-s);color:var(--tx2);font-size:11px;transition:all var(--t-fast);cursor:pointer}
.snap-btn:hover{border-color:var(--ac);color:var(--ac)}
.snap-btn.danger:hover{border-color:var(--err);color:var(--err);background:var(--err-d)}
[dir="rtl"] .snap-btn{font-family:var(--ff-ar);font-size:12px}
.snap-empty{text-align:center;padding:18px 12px;color:var(--txm);font-size:12px;border:1px dashed var(--bd-s);border-radius:var(--r-sm);margin-top:10px}
[dir="rtl"] .snap-empty{font-family:var(--ff-ar);font-size:13px}
/* ▎ kind-chooser — moved to Extra polish block above ──────────────── */

/* ═══════════════════════════════════════════════════════════════════════════
   NEW FEATURES — v2 Enhancements
═══════════════════════════════════════════════════════════════════════════ */

/* ▎ Chapter Status Badges ─────────────────────────────────────────────── */
.ch-status{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:999px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;cursor:pointer;transition:all var(--t-fast);user-select:none}
.ch-status.draft{background:oklch(0.28 0.008 42);color:oklch(0.60 0.008 78);border:1px solid oklch(0.32 0.008 42)}
.ch-status.writing{background:oklch(0.20 0.080 240 / .3);color:oklch(0.72 0.120 240);border:1px solid oklch(0.72 0.120 240 / .3)}
.ch-status.revision{background:oklch(0.25 0.100 50 / .3);color:oklch(0.80 0.148 52);border:1px solid oklch(0.80 0.148 52 / .3)}
.ch-status.done{background:oklch(0.20 0.100 150 / .3);color:oklch(0.72 0.160 150);border:1px solid oklch(0.72 0.160 150 / .3)}
.ch-status:hover{opacity:.8;transform:scale(1.04)}
[dir="rtl"] .ch-status{font-family:var(--ff-ar);letter-spacing:0;text-transform:none}

/* Status dot in sidebar list */
.li-status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:all var(--t-fast)}
.li-status-dot.draft{background:var(--txm)}
.li-status-dot.writing{background:oklch(0.72 0.120 240)}
.li-status-dot.revision{background:oklch(0.80 0.148 52)}
.li-status-dot.done{background:oklch(0.72 0.160 150)}

/* Sidebar progress bar per chapter */
.li-progress{height:2px;border-radius:2px;background:var(--bg-h);overflow:hidden;margin-top:3px}
.li-progress-bar{height:100%;border-radius:2px;background:var(--ac);transition:width .4s var(--e1)}
.li-progress-bar.done{background:var(--ok)}

/* ▎ Sidebar view toggles ──────────────────────────────────────────────── */
.sb-view-toggle{display:flex;gap:2px;flex-shrink:0}
.sb-view-btn{width:22px;height:22px;border-radius:var(--r-xs);color:var(--txm);display:flex;align-items:center;justify-content:center;transition:all var(--t-fast);border:1px solid transparent}
.sb-view-btn:hover{background:var(--bg-h);color:var(--tx2)}
.sb-view-btn.active{background:var(--ac-d);color:var(--ac);border-color:var(--ac-b)}
.sb-view-btn svg{width:12px;height:12px}

/* ▎ Corkboard View ────────────────────────────────────────────────────── */
.corkboard{flex:1;overflow-y:auto;padding:16px 10px 16px;background:oklch(0.10 0.012 42);min-height:0}
.corkboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cork-card{background:oklch(0.96 0.015 82);border-radius:var(--r-sm);padding:12px;cursor:pointer;transition:all var(--t) var(--e1);position:relative;min-height:120px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 8px oklch(0 0 0 / .35),0 0 0 1px oklch(0 0 0 / .15)}
.cork-card:hover{transform:translateY(-3px) rotate(0.3deg);box-shadow:0 8px 20px oklch(0 0 0 / .45)}
.cork-card.active{box-shadow:0 0 0 2.5px var(--ac),0 8px 20px oklch(0 0 0 / .4)}
.cork-card-pin{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:var(--ac);box-shadow:0 2px 4px oklch(0 0 0 / .5);z-index:1}
.cork-card-num{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.55 0.015 60);font-family:var(--ff-ui)}
.cork-card-title{font-family:'Lora',Georgia,serif;font-size:13px;font-weight:600;color:oklch(0.18 0.020 42);line-height:1.3;letter-spacing:-.01em}
.cork-card-excerpt{font-size:10.5px;color:oklch(0.40 0.015 55);line-height:1.55;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cork-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.cork-card-wc{font-size:9.5px;color:oklch(0.50 0.015 55);font-variant-numeric:tabular-nums}
.cork-card-status{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:999px}
.cork-card-status.draft{background:oklch(0.85 0.010 55);color:oklch(0.45 0.015 55)}
.cork-card-status.writing{background:oklch(0.85 0.080 240);color:oklch(0.30 0.120 240)}
.cork-card-status.revision{background:oklch(0.88 0.100 50);color:oklch(0.35 0.148 50)}
.cork-card-status.done{background:oklch(0.82 0.100 150);color:oklch(0.25 0.160 150)}

/* ▎ Reading Mode ──────────────────────────────────────────────────────── */
.reading-wrap{flex:1;overflow-y:auto;background:var(--bg);display:flex;flex-direction:column}
.reading-toolbar{height:var(--th);min-height:var(--th);background:var(--bg-s);border-bottom:1px solid var(--bd-s);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.reading-title{font-family:var(--ff-serif);font-size:15px;font-weight:600;color:var(--tx);letter-spacing:-.01em;flex:1}
.reading-scroll{flex:1;overflow-y:auto;padding:60px 0 120px}
.reading-inner{max-width:680px;margin:0 auto;padding:0 40px}
.reading-book-title{font-family:var(--ff-serif);font-size:clamp(28px,4vw,42px);font-weight:600;color:var(--tx);letter-spacing:-.03em;line-height:1.1;margin-bottom:10px;text-align:center}
.reading-book-meta{text-align:center;font-size:13px;color:var(--txm);margin-bottom:56px;padding-bottom:32px;border-bottom:1px solid var(--bd-s)}
.reading-ch-title{font-family:var(--ff-serif);font-size:24px;font-weight:600;color:var(--tx);letter-spacing:-.02em;margin:48px 0 24px;padding-top:48px;border-top:1px solid var(--bd-s)}
.reading-ch-title:first-of-type{border-top:none;margin-top:0;padding-top:0}
.reading-ch-num{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);display:block;margin-bottom:8px}
.reading-content{font-family:'Lora',Georgia,serif;font-size:18px;line-height:1.9;color:oklch(0.84 0.006 78);text-wrap:pretty}
.reading-content p{margin:.6em 0;text-indent:1.5em}
.reading-content p:first-child{text-indent:0}
.reading-content blockquote{border-inline-start:3px solid var(--ac-b);padding-inline-start:20px;color:var(--tx2);font-style:italic;margin:1em 0;text-indent:0}
.reading-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--txm);padding:60px}
[dir="rtl"] .reading-content{font-family:var(--ff-ar-serif);text-align:right}
[dir="rtl"] .reading-book-title,[dir="rtl"] .reading-ch-title{font-family:var(--ff-ar-serif)}
.theme-sepia .reading-content{color:oklch(0.26 0.022 48)}

/* ▎ Full Year Heatmap ─────────────────────────────────────────────────── */
.heatmap-wrap{overflow-x:auto;padding:4px 0 8px}
.heatmap-grid{display:flex;gap:3px}
.heatmap-col{display:flex;flex-direction:column;gap:3px}
.heatmap-cell{width:10px;height:10px;border-radius:2px;background:var(--bg-e);transition:all var(--t-fast);cursor:default;position:relative}
.heatmap-cell:hover{transform:scale(1.3);z-index:2}
.heatmap-cell.l1{background:oklch(0.30 0.080 150)}
.heatmap-cell.l2{background:oklch(0.48 0.130 150)}
.heatmap-cell.l3{background:oklch(0.62 0.160 150)}
.heatmap-cell.l4{background:oklch(0.72 0.160 150)}
.heatmap-months{display:flex;font-size:9px;color:var(--txm);margin-bottom:4px;gap:0;padding-inline-start:0;font-family:var(--ff-ui);letter-spacing:.03em}
.heatmap-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--txm);margin-top:8px;font-family:var(--ff-ui)}
.heatmap-legend-cell{width:10px;height:10px;border-radius:2px}


/* ▎ Chapter view status in header ────────────────────────────────────── */
.ch-header-right{display:flex;align-items:center;gap:8px;margin-inline-start:auto}

/* ▎ Outline / Structure panel ────────────────────────────────────────── */
.outline-wrap{flex:1;overflow-y:auto;padding:32px 28px 60px}
.outline-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--r-sm);margin-bottom:6px;background:var(--bg-s);border:1px solid var(--bd-s);transition:all var(--t-fast);cursor:pointer}
.outline-item:hover{border-color:var(--ac-b);background:var(--bg-e)}
.outline-num{font-family:var(--ff-serif);font-size:22px;font-weight:600;color:var(--ac);line-height:1;min-width:32px;text-align:center;font-variant-numeric:tabular-nums}
.outline-body{flex:1;min-width:0}
.outline-title{font-size:14px;font-weight:600;color:var(--tx);letter-spacing:-.01em;margin-bottom:3px}
.outline-excerpt{font-size:11.5px;color:var(--tx2);line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.outline-meta{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--txm);margin-top:5px}
[dir="rtl"] .outline-title{font-family:var(--ff-ar)}
[dir="rtl"] .outline-excerpt{font-family:var(--ff-ar)}

/* ▎ Word frequency panel ─────────────────────────────────────────────── */
.freq-list{display:flex;flex-direction:column;gap:6px}
.freq-row{display:flex;align-items:center;gap:10px}
.freq-word{font-family:var(--ff-serif);font-size:14px;color:var(--tx);min-width:120px;font-weight:500}
.freq-bar-wrap{flex:1;height:6px;background:var(--bg-e);border-radius:4px;overflow:hidden}
.freq-bar{height:100%;background:var(--ac);border-radius:4px;transition:width .6s var(--e1)}
.freq-count{font-size:11px;color:var(--txm);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}

/* ▎ Supabase Sync Modal ───────────────────────────────────────────────── */
.sync-modal-overlay{position:fixed;inset:0;background:var(--bg-over);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);animation:fadeIn .2s var(--e1)}
